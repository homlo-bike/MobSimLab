# Switches and crossings catalogue (ADR-0030 point 5; Project Preferences → Parameters → Switches and crossings).
#
# The railway design tool connects tracks only by placing one of these elements. Each attribute uses the
# value-entry shape of assumptions/parameters (central, optional low/high, basis, sources, check, rationale).
# Geometry model and field meanings: assumptions/README.md#switches-and-crossings.

- id: db-ew-190-1-9
  label: DB EW 49/54/60-190-1:9, straight crossing
  element: turnout
  standard: db
  geometry: straight-crossing
  crossing: rigid
  typical_modes:
    - light_rail
    - metro
    - commuter_rail
    - regional_rail
    - long_distance_rail
  attributes:
    crossing_ratio_n:
      central: 9
      basis: cited
      sources:
        - dewiki-weiche
        - db-ril-800-0120
      check: secondary
      rationale: Designation 1:9; listed as the standard turnout with a straight crossing.
    diverging_radius_m:
      central: 190
      basis: cited
      sources:
        - dewiki-weiche
        - db-ril-800-0120
      check: secondary
      rationale: Designation radius 190 m.
    length_a_m:
      low: 11.5
      central: 12.222
      high: 13.0
      basis: cited
      sources:
        - db-ril-800-0120
      check: unverified
      rationale: DB standard drawing value from the compiler's recollection of the DB drawing; not read. With a straight crossing the curve ends before the crossing, so a > R·tan(α/2) = 10.523 m and a < b.
    length_b_m:
      low: 14.0
      central: 14.916
      high: 16.0
      basis: cited
      sources:
        - db-ril-800-0120
      check: unverified
      rationale: DB standard drawing value from the compiler's recollection of the DB drawing; not read. Includes the straight crossing leg.
    total_length_m:
      low: 26.0
      central: 27.138
      high: 29.0
      basis: cited
      sources:
        - db-ril-800-0120
      check: unverified
      rationale: a + b.
    diverging_speed_kmh:
      central: 40
      basis: cited
      sources:
        - dewiki-weiche
        - db-ril-800-0120
        - voestalpine-tram-train-hu
      check: secondary
      rationale: Matches v = sqrt(I·R/11.8) with I = 100 mm cant deficiency in the uncanted diverging track (switch.cant_deficiency_mm). A Hungarian tram-train line uses R 200 m and 300 m turnouts at 40 km/h.
    through_speed_kmh:
      low: 120
      central: 160
      high: 200
      basis: educated-guess
      sources:
        - mobsimlab-derivation
      check: unverified
      rationale: Rigid-crossing standard turnouts are used on lines up to about 160 km/h; the line, not the turnout, usually limits it.
