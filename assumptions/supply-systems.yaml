    u_min2_v:
      central: 1000
      basis: cited
      sources:
        - en-50163
        - iec-60850
      check: unverified
      rationale: "EN 50163 / IEC 60850 table of supply voltages: Umin1/Umax1 bound permanent operation, Umin2/Umax2 the short-time limits (durations defined in the standard). Values to be checked against the current edition."
    u_min1_v:
      central: 1000
      basis: cited
      sources:
        - en-50163
        - iec-60850
      check: unverified
      rationale: "EN 50163 / IEC 60850 table of supply voltages: Umin1/Umax1 bound permanent operation, Umin2/Umax2 the short-time limits (durations defined in the standard). Values to be checked against the current edition."
    u_max1_v:
      central: 1800
      basis: cited
      sources:
        - en-50163
        - iec-60850
      check: unverified
      rationale: "EN 50163 / IEC 60850 table of supply voltages: Umin1/Umax1 bound permanent operation, Umin2/Umax2 the short-time limits (durations defined in the standard). Values to be checked against the current edition."
    u_max2_v:
      central: 1950
      basis: cited
      sources:
        - en-50163
        - iec-60850
      check: unverified
      rationale: "EN 50163 / IEC 60850 table of supply voltages: Umin1/Umax1 bound permanent operation, Umin2/Umax2 the short-time limits (durations defined in the standard). Values to be checked against the current edition."
    contact_wire_height_m: &id002
      low: 5.0
      central: 5.5
      high: 5.75
      basis: cited
      sources:
        - tsi-ene
        - era-tsi-ene
      check: secondary
      rationale: "TSI ENE: nominal contact wire height between 5.00 m and 5.75 m on new mainline (5.0 m and 6.5 m are the pantograph verification points, seen in the ERA text); lower under structures on existing lines."
    pantograph_head_mm:
      central: 1600
      basis: cited
      sources:
        - tsi-loc-pas
        - en-50367
      check: unverified
      rationale: "TSI LOC&PAS / EN 50367 pantograph heads: 1600 mm (European) and 1950 mm (several national DC networks). Metro and light rail lines often use their own head profile; take it from the line."
      options:
        - 1600
        - 1950
    standstill_current_a:
      central: 300
      basis: cited
      sources:
        - tsi-ene
        - tsi-loc-pas
      check: unverified
      rationale: TSI ENE and LOC&PAS set a maximum current per pantograph at standstill for DC systems so the contact wire does not overheat; 300 A for 1.5 kV DC. Value to be checked.

