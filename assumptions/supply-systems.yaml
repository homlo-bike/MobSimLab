# Energy supply systems (standards table, Project Preferences → Parameters → Energy supply).
#
# Vehicles list the ids they support in `supplySystems`; a section's supply system must be in that list.
# Each attribute uses the value-entry shape of assumptions/parameters (central, optional low/high,
# basis, sources, check, rationale; `options` for list-valued attributes). Schema: assumptions/README.md.

- id: ocl-600v-dc
  label: Overhead contact line, 600 V DC
  collection: ocl
  current: dc
  typical_modes:
    - tram
    - light_rail
  attributes:
    nominal_v:
      central: 600
      basis: cited
      sources:
        - en-50163
        - iec-60850
      check: unverified
      rationale: "EN 50163 / IEC 60850 table of supply voltages: Umin1/Umax1 bound permanent operation, Umin2/Umax2 the short-time limits (durations defined in the standard). Values to be checked against the current edition."
    u_min2_v:
      central: 400
      basis: cited
      sources:
        - en-50163
        - iec-60850
      check: unverified
      rationale: "EN 50163 / IEC 60850 table of supply voltages: Umin1/Umax1 bound permanent operation, Umin2/Umax2 the short-time limits (durations defined in the standard). Values to be checked against the current edition."
    u_min1_v:
      central: 400
      basis: cited
      sources:
        - en-50163
        - iec-60850
      check: unverified
      rationale: "EN 50163 / IEC 60850 table of supply voltages: Umin1/Umax1 bound permanent operation, Umin2/Umax2 the short-time limits (durations defined in the standard). Values to be checked against the current edition."
    u_max1_v:
      central: 720
      basis: cited
      sources:
        - en-50163
        - iec-60850
      check: unverified
      rationale: "EN 50163 / IEC 60850 table of supply voltages: Umin1/Umax1 bound permanent operation, Umin2/Umax2 the short-time limits (durations defined in the standard). Values to be checked against the current edition."
    u_max2_v:
      central: 800
      basis: cited
      sources:
        - en-50163
        - iec-60850
      check: unverified
      rationale: "EN 50163 / IEC 60850 table of supply voltages: Umin1/Umax1 bound permanent operation, Umin2/Umax2 the short-time limits (durations defined in the standard). Values to be checked against the current edition."
    contact_wire_height_m: &id001
      low: 4.2
      central: 5.5
      high: 6.5
      basis: educated-guess
      sources:
        - en-50119
        - mobsimlab-derivation
      check: unverified
      rationale: Street overhead line hangs above road vehicle height (about 4.7 m or more over roads in many national rules); lower in tunnels and under bridges. EN 50119 covers design but leaves heights to the project.

