# Walk coverage and stop spacing analysis defaults (ADR-0035 §5, §6). Schema: assumptions/README.md.

- key: analysis.walk_rule_minutes
  label: "Walk rule: largest walk to the nearest stop or station, in minutes (headline coverage figure)"
  group: Analysis
  unit: min
  used_by: [walk coverage report, agent tools, coverage map layer]
  values:
    - context:
        mode: "*"
      low: 10
      central: 15
      high: 20
      basis: documented
      sources: [moreno-2021, mobsimlab-derivation]
      check: unverified
      rationale: "Product owner rule (2026-11-01): a 15-minute walk to the nearest stop or station is the headline figure, following the 15-minute city idea of Moreno et al. (2021). About 1.1 km at the central 4.5 km/h walking speed, measured on the street network. 10 and 20 min are the usual sensitivity values."

- key: analysis.frequent_headway_min
  label: "Frequent service: longest headway for a stop to count in the frequent-only coverage"
  group: Analysis
  unit: min
  used_by: [frequent-only walk coverage]
  values:
    - context:
        mode: "*"
      low: 10
      central: 15
      high: 20
      basis: cited
      sources: [itdp-pnft, tcqsm3]
      check: unverified
      rationale: "ITDP People Near Frequent Transit counts stops served at least every 15 minutes; TCQSM frequency levels of service put 10–14 min and 15–20 min headways at the boundary where passengers stop consulting a timetable."

- key: walk.crossing_delay_s
  label: Average wait at a signalised pedestrian crossing
  group: Analysis
  unit: s
  used_by: [walk coverage, walk catchments]
  values:
    - context:
        mode: "*"
      low: 10
      central: 20
      high: 40
      basis: documented
      sources: [hcm7]
      check: unverified
      rationale: "HCM average pedestrian delay at a signalised crossing d = (C − g)² / (2C). C = 90 s with a 30 s walk interval gives 20 s; a 60 s cycle with 25 s walk gives about 10 s; a 120 s cycle with 20 s walk gives about 42 s."

- key: analysis.cycle_speed_kmh
  label: "Cycling speed for the 15-minute city by bicycle, including stops at junctions"
  group: Analysis
  unit: km/h
  used_by: [15-minute city destination counts, agent tools]
  values:
    - context:
        mode: "*"
      low: 12
      central: 15
      high: 18
      basis: documented
      sources: [moreno-2021, mobsimlab-derivation]
      check: unverified
      rationale: "Average urban cycling speed door to door, with waits at junctions folded in, as used for the bicycle variant of the 15-minute city (Moreno et al. 2021 count destinations within 15 minutes on foot or by bicycle). 12 km/h is a cautious value for older or casual riders, 18 km/h a commuter on a fast cycle network. Signalised crossings add walk.crossing_delay_s on top, as for walking."

- key: analysis.station_grouping_m
  label: "Station grouping: stops and stations closer than this are one stop or station and share a name"
  group: Analysis
  unit: m
  used_by: [stop and station names in the railway editor, renaming stops and stations]
  values:
    - context:
        mode: "*"
      low: 100
      central: 150
      high: 250
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: "06-gis §9.3 default: platforms of one interchange (a tram stop in front of a station, two bus stops on either side of a junction) usually lie within about 150 m of each other; farther apart they are separate stops that need their own names. A street line's own grouping distance (line rules) still applies to its stops."

- key: analysis.same_place_m
  label: "Network map: stops of any name closer than this are drawn as one station"
  group: Analysis
  unit: m
  used_by: [network and strip maps, fare zones]
  values:
    - context:
        mode: "*"
      low: 20
      central: 40
      high: 80
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: "Two stops this close are on the same platform or kerb even when their names differ (a renamed stop, a typo), so the diagrams merge them. Stops with the same name are merged over a longer distance."

- key: analysis.gap_cell_m
  label: "Walk coverage: size of the cells people are gathered in, and of each gap"
  group: Analysis
  unit: m
  used_by: [walk coverage gaps, people not reached]
  values:
    - context:
        mode: "*"
      low: 100
      central: 200
      high: 400
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: "The population grid is 100 m; gathering it in 200 m cells keeps the walk request small and makes each gap a block rather than a single grid cell. Smaller cells show gaps in more detail and take longer; 100 m is the grid itself."
