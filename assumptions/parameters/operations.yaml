# Operations, timetabling and recording defaults. Schema: assumptions/README.md.

- key: timetable.recovery_share
  label: Recovery time in the planned timetable, as a share of the running time
  group: Operations
  unit: share
  used_by: [timetable generation, cycle time, fleet size]
  values:
    - context:
        mode: "*"
      low: 0.05
      central: 0.1
      high: 0.2
      basis: documented
      sources: [tcqsm3, uic-451-1]
      check: unverified
      rationale: Wide fallback between rail (UIC) and bus (TCQSM) practice.
    - context:
        mode: [bus, brt, trolleybus, intercity_bus]
      low: 0.1
      central: 0.15
      high: 0.2
      basis: documented
      sources: [tcqsm3]
      check: unverified
      rationale: "TCQSM: recovery time commonly 10–20 % of running time for bus routes."
    - context:
        mode: [tram, light_rail]
      low: 0.08
      central: 0.12
      high: 0.15
      basis: educated-guess
      sources: [tcqsm3, mobsimlab-derivation]
      check: unverified
      rationale: Street running behaves like bus; segregated sections like rail.
    - context:
        mode: [metro, commuter_rail, regional_rail, long_distance_rail, high_speed_rail]
      low: 0.03
      central: 0.05
      high: 0.07
      basis: cited
      sources: [uic-451-1]
      check: unverified
      rationale: UIC 451-1 regular running time supplement of about 3–7 % depending on speed and traction. Clause to be checked.

- key: timetable.layover_min
  label: Layover at each terminal before the vehicle turns back
  group: Operations
  unit: min
  used_by: [vehicle scheduling, fleet size]
  values:
    - context:
        mode: "*"
      low: 3
      central: 5
      high: 10
      basis: documented
      sources: [tcqsm3]
      check: unverified
      rationale: "TCQSM: minimum layover for driver relief and recovery, commonly 5–10 min or about 10 % of cycle time."
    - context:
        mode: [bus, brt, trolleybus, tram, light_rail]
      low: 3
      central: 5
      high: 10
      basis: documented
      sources: [tcqsm3]
      check: unverified
      rationale: As above.
    - context:
        mode: intercity_bus
      low: 10
      central: 15
      high: 30
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Cleaning, luggage, driver rest rules.
    - context:
        mode: metro
      low: 2
      central: 3
      high: 5
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Driver changes end; automated lines shorter.
    - context:
        mode: commuter_rail
      low: 3
      central: 5
      high: 10
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Turnback platform occupancy.
    - context:
        mode: regional_rail
      low: 5
      central: 10
      high: 20
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Typical regional turnaround.
    - context:
        mode: [long_distance_rail, high_speed_rail]
      low: 15
      central: 25
      high: 45
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Cleaning and catering at terminals.

- key: recording.late_threshold_s
  label: A call counts as late from this delay on (recording)
  group: Operations
  unit: s
  used_by: [punctuality statistics, reports]
  values:
    - context:
        mode: "*"
      low: 60
      central: 300
      high: 600
      basis: documented
      sources: [tcqsm3, orr-ppm]
      check: unverified
      rationale: TCQSM and UK PPM both use 5 min as the common on-time window.
    - context:
        mode: [bus, brt, trolleybus, tram, light_rail]
      low: 60
      central: 300
      high: 300
      basis: cited
      sources: [tcqsm3]
      check: unverified
      rationale: "TCQSM on-time window: up to 5 min late (some agencies use 1–3 min)."
    - context:
        mode: metro
      low: 60
      central: 120
      high: 300
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: High-frequency metros measure headway regularity rather than lateness; 2 min is a usable proxy.
    - context:
        mode: [commuter_rail, regional_rail]
      low: 180
      central: 300
      high: 360
      basis: cited
      sources: [sbb-punctuality, orr-ppm, db-punctuality]
      check: unverified
      rationale: SBB counts 3 min, UK PPM 5 min, DB 6 min (late from 6:00 on).
    - context:
        mode: [long_distance_rail, high_speed_rail]
      low: 300
      central: 360
      high: 600
      basis: cited
      sources: [db-punctuality, orr-ppm]
      check: unverified
      rationale: DB 6 min; UK PPM 10 min for long-distance operators.

- key: operations.depot_run_speed_kmh
  label: Speed of empty runs between a line and its depot tracks
  group: Operations
  unit: km/h
  used_by: [depot run times, vehicle scheduling]
  values:
    - context:
        mode: "*"
      low: 15
      central: 25
      high: 40
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Wide fallback.
    - context:
        mode: [bus, brt, trolleybus, intercity_bus]
      low: 20
      central: 30
      high: 50
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Urban road speed; the street's own limit wins when routed on the road graph.
    - context:
        mode: [tram, light_rail]
      low: 10
      central: 15
      high: 25
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Depot fans and yard tracks driven on sight.
    - context:
        mode: [metro, commuter_rail, regional_rail, long_distance_rail, high_speed_rail]
      low: 15
      central: 25
      high: 40
      basis: documented
      sources: [db-ril-408]
      check: unverified
      rationale: Shunting movements are limited to 25 km/h in DB operating rules; signalled depot access tracks can allow 40 km/h.

- key: operations.refuel_time_min
  label: Time to refuel a vehicle at the depot during the day
  group: Operations
  unit: min
  used_by: [vehicle scheduling, depot throughput]
  values:
    - context:
        mode: "*"
      low: 3
      central: 6
      high: 10
      basis: documented
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: "Diesel: 250–300 l tank at 40–60 l/min pump rate is about 5 min plus positioning."
    - context:
        traction: hydrogen
      low: 7
      central: 10
      high: 20
      basis: documented
      sources: [sae-j2601-2]
      check: unverified
      rationale: Heavy-duty hydrogen fuelling of 30–40 kg; rate depends on the J2601-2 protocol and station pre-cooling.
    - context:
        traction: cng
      low: 5
      central: 8
      high: 15
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Fast-fill CNG.

- key: demand.walk_speed_kmh
  label: Walking speed for walking links between stations
  group: Demand
  unit: km/h
  used_by: [transfer links, access/egress links, catchment]
  values:
    - context:
        mode: "*"
      low: 3.8
      central: 4.5
      high: 5.4
      basis: cited
      sources: [mutcd-2009, hcm7]
      check: unverified
      rationale: MUTCD uses 3.5 ft/s (≈ 3.8 km/h) for slow pedestrians at crossings; typical free walking is about 1.25 m/s (4.5 km/h); HCM free-flow up to about 1.5 m/s (5.4 km/h).

- key: journey.walk_detour_factor
  label: "Journey planner: walking distance over straight-line distance"
  group: Demand
  unit: ratio
  used_by: [journey planner access, egress and transfer walks]
  values:
    - context:
        mode: "*"
      low: 1.2
      central: 1.3
      high: 1.5
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: "Stand-in until walks are routed on the walk graph: street networks make a walk roughly 20–50 % longer than the straight line (lower in dense grids, higher with rivers, rail lines and cul-de-sacs). 1.3 is the planning value used by the journey planner (ADR-0034); replace with a cited circuity study."

- key: journey.min_change_s
  label: "Journey planner: minimum time to change vehicles at the same stop"
  group: Demand
  unit: s
  used_by: [journey planner transfers]
  values:
    - context:
        mode: "*"
      low: 0
      central: 60
      high: 180
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: "Alighting, finding the next vehicle and boarding at one stop or one platform. 0 for cross-platform timed connections (those come from the published timetable as transfer_type 1); 60 s as a cautious default."

- key: journey.level_change_s
  label: "Journey planner: added time to change platform within one station (stairs, lifts)"
  group: Demand
  unit: s
  used_by: [journey planner transfers, estimated platform-to-platform times]
  values:
    - context:
        mode: "*"
      low: 30
      central: 60
      high: 180
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: "Added to the straight-line walk between two platforms of one station until rail-model provides platform-to-platform times from the station layout (ADR-0032, 06 §9.3). About one flight of stairs or a lift ride; deep metro stations need the high value."

- key: operations.energy_reserve_share
  label: Energy reserve kept in the battery or tank, share of its capacity (energy planning)
  group: Operations
  unit: share
  used_by: [block feasibility, charging plan]
  values:
    - context:
        mode: "*"
      low: 0.1
      central: 0.15
      high: 0.25
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Fallback.
    - context:
        traction: battery
      low: 0.1
      central: 0.2
      high: 0.3
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Operators plan against the usable state-of-charge window and keep a reserve for diversions, traffic and battery ageing; 20 % of nominal is a common planning figure.
    - context:
        traction: [diesel, hydrogen, cng]
      low: 0.1
      central: 0.15
      high: 0.25
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Fuel reserve for disruption.

- key: timetable.min_buffer_s
  label: Minimum buffer time between the blocking times of two trains on one section
  group: Operations
  unit: s
  used_by: [timetable construction, conflict detection, capacity]
  values:
    - context:
        mode: "*"
      low: 30
      central: 60
      high: 120
      basis: educated-guess
      sources: [uic-406, mobsimlab-derivation]
      check: unverified
      rationale: "Buffer times absorb small delays so they do not spread to the next train (UIC 406 stability). National practice differs; one minute is a common planning value on mainlines."
    - context:
        mode: [metro, tram, light_rail]
      low: 10
      central: 20
      high: 40
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: "Short headways on metro and light rail leave little room; 20 s keeps a 2-minute headway feasible."

- key: timetable.target_load_factor
  label: Planned load at the maximum load point, as a share of the train's capacity
  group: Operations
  unit: share
  used_by: [frequency suggestion, train length]
  values:
    - context:
        mode: "*"
      low: 0.7
      central: 0.8
      high: 1.0
      basis: documented
      sources: [ceder-2016, tcqsm3]
      check: unverified
      rationale: "Ceder's maximum load point method sets the frequency so that the peak hour load at the busiest link stays at a desired occupancy; capacity counts standees at the planning density, so values near 0.8 leave room for uneven loading between trains."

- key: timetable.policy_headway_peak_min
  label: Longest headway allowed in the peak, whatever the demand
  group: Operations
  unit: min
  used_by: [frequency suggestion]
  values:
    - context:
        mode: "*"
      low: 10
      central: 15
      high: 30
      basis: documented
      sources: [ceder-2016, tcqsm3]
      check: unverified
      rationale: "Policy headway (Ceder: minimum frequency standard). Planners set it per mode; 15 min is a common urban floor."
    - context:
        mode: [metro, light_rail, tram]
      low: 3
      central: 5
      high: 10
      basis: educated-guess
      sources: [tcqsm3, mobsimlab-derivation]
      check: unverified
      rationale: Urban rail usually runs every 2–5 min in the peak so passengers need no timetable.

- key: timetable.policy_headway_offpeak_min
  label: Longest headway allowed off-peak, whatever the demand
  group: Operations
  unit: min
  used_by: [frequency suggestion]
  values:
    - context:
        mode: "*"
      low: 15
      central: 30
      high: 60
      basis: documented
      sources: [ceder-2016, tcqsm3]
      check: unverified
      rationale: Common off-peak minimum frequency standard; 60 min on rural and regional services.
    - context:
        mode: [metro, light_rail, tram]
      low: 5
      central: 10
      high: 15
      basis: educated-guess
      sources: [tcqsm3, mobsimlab-derivation]
      check: unverified
      rationale: Urban rail commonly keeps a 10 min off-peak service.

- key: timetable.terminal_separation_s
  label: Least time between an arrival and a departure crossing in a terminal throat
  group: Operations
  unit: s
  used_by: [timetable construction (return offset)]
  values:
    - context:
        mode: "*"
      low: 60
      central: 90
      high: 180
      basis: educated-guess
      sources: [pachl-roc, mobsimlab-derivation]
      check: unverified
      rationale: "The periodic pattern keeps conflicting moves in the throat apart by at least the route setting, approach and clearing time; 90 s fits the example metro terminal."

- key: dwell.door_open_close_s
  label: Door opening and closing time within a dwell
  group: Operations
  unit: s
  used_by: [dwell model]
  values:
    - context:
        mode: "*"
      low: 2
      central: 5
      high: 10
      basis: documented
      sources: [tcqsm3]
      check: unverified
      rationale: "TCQSM: door opening and closing take about 2–5 s, plus the warning before closing."

- key: dwell.board_s_per_pax
  label: Boarding time per passenger per door channel
  group: Operations
  unit: s
  used_by: [dwell model]
  values:
    - context:
        mode: "*"
      low: 1.0
      central: 1.5
      high: 2.5
      basis: documented
      sources: [tcqsm3]
      check: unverified
      rationale: "TCQSM gives passenger service times for level, wide doors of about 1–2 s per passenger per channel; steps and fare payment raise them."

- key: dwell.alight_s_per_pax
  label: Alighting time per passenger per door channel
  group: Operations
  unit: s
  used_by: [dwell model]
  values:
    - context:
        mode: "*"
      low: 0.8
      central: 1.2
      high: 2.0
      basis: documented
      sources: [tcqsm3]
      check: unverified
      rationale: "TCQSM: alighting is somewhat quicker than boarding."

- key: capacity.occupancy_limit_share
  label: Recommended capacity consumption limit in the peak hour (UIC 406)
  group: Operations
  unit: share
  used_by: [capacity report, maximum capacity]
  values:
    - context:
        mode: "*"
      low: 0.6
      central: 0.75
      high: 0.85
      basis: cited
      sources: [uic-406]
      check: unverified
      rationale: "UIC 406 recommends about 75 % in the peak hour on mixed-traffic lines and 60 % daily; values to be checked against the current edition."
    - context:
        mode: [metro, commuter_rail]
      low: 0.75
      central: 0.85
      high: 0.9
      basis: cited
      sources: [uic-406]
      check: unverified
      rationale: "UIC 406: dedicated suburban passenger traffic about 85 % in the peak hour."

- key: stability.runs
  label: Runs with random primary delays in the stability test
  group: Operations
  unit: count
  used_by: [capacity run stability test]
  values:
    - context:
        mode: "*"
      low: 4
      central: 8
      high: 50
      basis: educated-guess
      sources: [uic-406, mobsimlab-derivation]
      check: unverified
      rationale: "UIC 406 assesses stability by running the timetable with random delays. Eight seeded runs are enough to tell a stable timetable from one where delays grow, and keep the test interactive in the browser; use more for a published study."

- key: stability.delayed_share
  label: Share of trips that start late in the stability test
  group: Operations
  unit: share
  used_by: [capacity run stability test]
  values:
    - context:
        mode: "*"
      low: 0.1
      central: 0.3
      high: 0.5
      basis: educated-guess
      sources: [db-punctuality, mobsimlab-derivation]
      check: unverified
      rationale: "Mainline departures are often a minute or more late; a third of trips with a primary delay is a demanding but common test assumption."
    - context:
        mode: [metro, tram, light_rail]
      low: 0.1
      central: 0.2
      high: 0.4
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: "Urban rail has short dwells that overrun often but by little; one trip in five starting late."

- key: stability.primary_delay_mean_s
  label: Mean primary delay of a trip that starts late (exponential distribution)
  group: Operations
  unit: s
  used_by: [capacity run stability test]
  values:
    - context:
        mode: "*"
      low: 60
      central: 120
      high: 300
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: "Primary delays are commonly modelled as exponential (many small, few large); two minutes is a moderate mainline value."
    - context:
        mode: [metro, tram, light_rail]
      low: 20
      central: 45
      high: 90
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: "Door and boarding overruns on urban rail are typically tens of seconds."

- key: stability.primary_delay_max_s
  label: Largest primary delay in the stability test
  group: Operations
  unit: s
  used_by: [capacity run stability test]
  values:
    - context:
        mode: "*"
      low: 300
      central: 600
      high: 1200
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: "Caps the exponential tail; larger delays are disruptions handled by the traffic management layer, not stability."
    - context:
        mode: [metro, tram, light_rail]
      low: 120
      central: 180
      high: 300
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: "Beyond about three minutes a metro controller intervenes (holding, short-turning)."

- key: stability.recovery_s
  label: Time run after the tested period, without new delays, to see whether delays die out
  group: Operations
  unit: s
  used_by: [capacity run stability test]
  values:
    - context:
        mode: "*"
      low: 900
      central: 1800
      high: 3600
      basis: educated-guess
      sources: [uic-406, mobsimlab-derivation]
      check: unverified
      rationale: "UIC 406 calls a timetable stable when delays decay within the period; half an hour after the period lets the running-time supplements and buffers absorb them."

- key: stability.residual_delay_s
  label: Delays have died out when the mean arrival delay at the end of the recovery time is under this
  group: Operations
  unit: s
  used_by: [capacity run stability test, verdict]
  values:
    - context:
        mode: "*"
      low: 30
      central: 60
      high: 120
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: "Well under the punctuality thresholds (recording.late_threshold_s), so a stable timetable is back on time for passengers."
    - context:
        mode: [metro, tram, light_rail]
      low: 15
      central: 30
      high: 60
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: "Half a minute is below what a metro passenger notices at a 2–5 minute headway."
