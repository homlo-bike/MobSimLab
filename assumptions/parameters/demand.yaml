- key: demand.road.max_iterations
  label: "Road assignment: most iterations of the equilibrium"
  group: Demand
  unit: iterations
  used_by:
    - "road assignment: bi-conjugate Frank-Wolfe"
  values:
    - context:
        mode: "*"
      low: 20
      central: 100
      high: 500
      basis: educated-guess
      sources:
        - mobsimlab-derivation
      check: unverified
      rationale: The assignment stops at this or at demand.road.relative_gap, whichever comes first.

- key: demand.road.relative_gap
  label: "Road assignment: relative gap at which the equilibrium counts as reached"
  group: Demand
  unit: share
  used_by:
    - "road assignment: bi-conjugate Frank-Wolfe"
  values:
