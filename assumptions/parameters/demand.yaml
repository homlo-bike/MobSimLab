        mode: "*"
      low: 0.5
      central: 1.4
      high: 2.5
      basis: documented
      sources:
        - nchrp-716
        - mobsimlab-derivation
      check: unverified
      rationale: Services, offices and public buildings draw visitors too, at a fraction of the rate of shops.

