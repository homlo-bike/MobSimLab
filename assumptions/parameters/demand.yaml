- key: demand.mode.ivt.hbw
  label: "Mode choice: utility of one minute in a vehicle for home–work trips"
  group: Demand
  unit: 1/min
  used_by:
    - "mode choice: utilities of car and public transport"
    - "distribution: generalised time"
  values:
    - context:
        mode: "*"
      low: -0.035
      central: -0.025
      high: -0.015
      basis: documented
      sources:
        - nchrp-716
        - ortuzar-willumsen-2011
      check: unverified
      rationale:
        "NCHRP Report 716 lists in-vehicle time coefficients of US models: about −0.019 to −0.028 per minute
        for work trips and −0.008 to −0.025 for other trips. All other time and cost terms are set relative to this
        one."

