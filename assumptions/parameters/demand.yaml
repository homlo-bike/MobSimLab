  used_by:
    - "time periods: trips per period"
  values:
    - context:
        mode: "*"
      low: 0.25
      central: 0.3
      high: 0.35
      basis: documented
      sources:
        - nchrp-716
        - mid-2017
        - mobsimlab-derivation
      check: unverified
      rationale:
        Departure time distributions of household travel surveys, grouped into the four periods. What is
        left of the weekday after the four periods is the night (shown in the weekday total only).

