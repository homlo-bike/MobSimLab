        mode: "*"
      low: 4
      central: 4
      high: 8
      basis: cited
      sources:
        - bpr-1964
      check: unverified
      rationale: See demand.road.bpr_alpha.

- key: demand.road.free_flow_share
  label: "Road assignment: free-flow speed as a share of the legal speed"
  group: Demand
