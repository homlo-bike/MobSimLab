- key: demand.deterrence.hbw.power
  label: "Distribution: power b of the deterrence function for home–work trips (f = t^b · e^(c·t))"
  group: Demand
  unit: –
  used_by:
    - "trip distribution: gravity model"
  values:
    - context:
        mode: "*"
      low: -0.026
      central: -0.02
      high: -0.014
      basis: cited
      sources:
        - nchrp-716
      check: unverified
      rationale:
        NCHRP Report 716 gives gamma friction factors for large urban areas (f = a·t^b·e^(c·t), t in minutes).
        Calibration to an observed trip length changes c and keeps b.

- key: demand.deterrence.hbw.exponential
  label: "Distribution: exponential c of the deterrence function for home–work trips, per minute"
  group: Demand
  unit: 1/min
  used_by:
    - "trip distribution: gravity model"
    - calibration to an observed trip length
  values:
    - context:
        mode: "*"
      low: -0.1845
      central: -0.123
      high: -0.0615
      basis: cited
      sources:
        - nchrp-716
      check: unverified
      rationale:
        NCHRP Report 716 gives gamma friction factors for large urban areas (f = a·t^b·e^(c·t), t in minutes).
        t is the generalised time between zones (the mode choice logsum, in minutes of in-vehicle time).

- key: demand.deterrence.hbe.power
