- key: demand.attraction.school_pupils
  label: "Special generator: pupils per school, where the school has no number of its own"
  group: Demand
  unit: pupils
  used_by:
    - "trip generation: home–education attractions"
  values:
    - context:
        mode: "*"
      low: 200
      central: 500
      high: 1000
      basis: educated-guess
      sources:
        - mobsimlab-derivation
      check: unverified
      rationale:
        Primary schools have about 200 to 400 pupils, secondary schools 600 to 1500. OpenStreetMap seldom
        says which, so one middle value is used; enter the real number on the zone where it is known.

- key: demand.attraction.university_students
  label: "Special generator: students per university or college, where it has no number of its own"
  group: Demand
  unit: students
  used_by:
    - "trip generation: home–education and home–other attractions"
  values:
    - context:
        mode: "*"
      low: 2000
      central: 8000
      high: 25000
      basis: educated-guess
      sources:
        - mobsimlab-derivation
      check: unverified
      rationale:
        Colleges have a few thousand students, large city universities 20 000 to 40 000 spread over several
        sites. Enter the real number on the zone where it is known.

- key: demand.attraction.hospital_visits
  label: "Special generator: visitor and patient trips a weekday per hospital"
  group: Demand
  unit: trips
  used_by:
    - "trip generation: home–other attractions"
  values:
    - context:
        mode: "*"
      low: 500
      central: 1500
      high: 4000
      basis: educated-guess
      sources:
        - ite-trip-generation
        - mobsimlab-derivation
      check: unverified
      rationale:
        Trip generation surveys give hospitals roughly 10 to 15 trips per bed a weekday, staff included;
        a 300-bed hospital is about 1500 visitor and patient trips once staff (counted as jobs) are taken out.

- key: demand.attraction.clinic_visits
  label: "Special generator: patient trips a weekday per clinic or doctor's practice"
  group: Demand
  unit: trips
  used_by:
    - "trip generation: home–other attractions"
  values:
    - context:
        mode: "*"
      low: 50
      central: 150
      high: 400
      basis: educated-guess
      sources:
        - ite-trip-generation
        - mobsimlab-derivation
      check: unverified
      rationale: A practice with a few doctors sees about 50 to 100 patients a day, each a trip there and back.

- key: demand.attraction.tourism_visits
  label: "Special generator: visitor trips a weekday per tourist attraction or museum"
  group: Demand
  unit: trips
  used_by:
    - "trip generation: home–other attractions"
  values:
    - context:
        mode: "*"
      low: 100
      central: 1000
      high: 5000
      basis: educated-guess
      sources:
        - mobsimlab-derivation
      check: unverified
      rationale:
        Small museums see a few hundred visitors a day, major sights several thousand. Enter the real number
        on the zone where it is known.

- key: demand.attraction.cbd_factor
  label: "Central business district: attraction uplift for zones in the centre"
  group: Demand
  unit: factor
  used_by:
    - "trip generation: attractions"
  values:
    - context:
        mode: "*"
      low: 1
      central: 1.2
      high: 1.5
      basis: educated-guess
      sources:
        - mobsimlab-derivation
      check: unverified
      rationale:
        City centres draw more trips than their jobs and shops alone suggest (agglomeration of shops, culture,
        services). A zone is in the centre when the planner marks it, or when its jobs per km² reach demand.cbd_job_density_km2.

- key: demand.cbd_job_density_km2
  label: "Central business district: jobs per km² from which a zone counts as centre"
  group: Demand
  unit: jobs/km²
  used_by:
    - "trip generation: central business district zones"
  values:
    - context:
        mode: "*"
      low: 5000
      central: 10000
      high: 20000
      basis: educated-guess
      sources:
        - mobsimlab-derivation
      check: unverified
      rationale:
        Office and retail cores of European and North American cities have about 10 000 to 50 000 jobs per
        km²; dense mixed districts 5000 to 10 000.

