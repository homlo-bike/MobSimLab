- key: demand.mode.wait_weight
  label: "Mode choice: weight of a minute waiting, relative to a minute in a vehicle"
  group: Demand
  unit: ×
  used_by:
    - "mode choice: public transport utility"
    - transit assignment
  values:
    - context:
        mode: "*"
      low: 1.5
      central: 2.0
      high: 2.5
      basis: cited
      sources:
        - wardman-2004
      check: unverified
      rationale: "Wardman's meta-analysis of UK values: waiting is valued at about 1.5 to 2.5 times in-vehicle time."

- key: demand.mode.walk_weight
  label: "Mode choice: weight of a minute walking to, from or between stops, relative to a minute in a vehicle"
  group: Demand
  unit: ×
  used_by:
    - "mode choice: public transport utility"
    - transit assignment
  values:
    - context:
        mode: "*"
      low: 1.5
      central: 2.0
      high: 2.5
      basis: cited
      sources:
        - wardman-2004
      check: unverified
      rationale:
        "Wardman's meta-analysis: walking to and from public transport is valued at about 1.5 to 2.5 times
        in-vehicle time."

- key: demand.mode.transfer_penalty_min
  label: "Mode choice: penalty for each change of vehicle, in minutes of in-vehicle time"
  group: Demand
  unit: min
  used_by:
    - "mode choice: public transport utility"
    - transit assignment
  values:
    - context:
        mode: "*"
      low: 3
      central: 5
      high: 10
      basis: cited
      sources:
        - wardman-2004
      check: unverified
      rationale:
        "Wardman's meta-analysis: about 5 minutes per interchange, more where the change is unpleasant or
        uncertain; the walk and wait of the change are counted on top."

- key: demand.mode.walk_mode_weight
  label: "Mode choice: weight of a minute of a trip made on foot, relative to a minute in a vehicle"
  group: Demand
  unit: ×
  used_by:
    - "mode choice: walk utility"
  values:
    - context:
        mode: "*"
      low: 1.5
      central: 2.0
      high: 3.0
      basis: documented
      sources:
        - nchrp-716
        - mobsimlab-derivation
      check: unverified
      rationale:
        Models in NCHRP Report 716 weigh non-motorised time at about twice in-vehicle time; the alternative-specific
        constant takes up the rest.

- key: demand.mode.cycle_mode_weight
  label: "Mode choice: weight of a minute of a trip made by bicycle, relative to a minute in a vehicle"
  group: Demand
  unit: ×
  used_by:
    - "mode choice: cycle utility"
  values:
    - context:
        mode: "*"
      low: 1.5
      central: 2.0
      high: 3.0
      basis: documented
      sources:
        - nchrp-716
        - mobsimlab-derivation
      check: unverified
      rationale:
        As for walking. Cycle facilities lower the perceived time on the streets that have them (catchment
        effects).

- key: demand.mode.nest_scale
  label: "Mode choice: nest scale of motorised (car, public transport) and non-motorised (walk, cycle) modes"
  group: Demand
  unit: –
  used_by:
    - "mode choice: nested logit"
  values:
    - context:
        mode: "*"
      low: 0.4
      central: 0.6
      high: 0.9
      basis: documented
      sources:
        - tag-m2
        - ortuzar-willumsen-2011
      check: unverified
      rationale:
        "Between 0 and 1: 1 is a plain multinomial logit; lower values make car and public transport (or
        walk and cycle) closer substitutes than modes across nests. TAG unit M2.1 gives illustrative values of about
        0.5 to 0.8 for mode choice below destination choice."

- key: demand.mode.asc.transit
  label: "Mode choice: constant of public transport, relative to car"
  group: Demand
  unit: utility
  used_by:
    - "mode choice: public transport utility"
    - calibration to observed mode shares
  values:
    - context:
        mode: "*"
      low: -2.0
      central: -1.0
      high: 0.0
      basis: educated-guess
      sources:
        - mobsimlab-derivation
      check: unverified
      rationale:
        "Uncalibrated starting value: what time and cost do not capture (comfort, reliability, habit). Calibration
        to observed mode shares replaces it."

- key: demand.mode.asc.walk
  label: "Mode choice: constant of walking, relative to car"
  group: Demand
  unit: utility
  used_by:
    - "mode choice: walk utility"
    - calibration to observed mode shares
  values:
    - context:
        mode: "*"
      low: -1.0
      central: 0.0
      high: 1.0
      basis: educated-guess
      sources:
        - mobsimlab-derivation
      check: unverified
      rationale: Uncalibrated starting value; calibration to observed mode shares replaces it.

- key: demand.mode.asc.cycle
  label: "Mode choice: constant of cycling, relative to car"
  group: Demand
  unit: utility
  used_by:
    - "mode choice: cycle utility"
    - calibration to observed mode shares
  values:
    - context:
        mode: "*"
      low: -2.5
      central: -1.5
      high: -0.5
      basis: educated-guess
      sources:
        - mobsimlab-derivation
      check: unverified
      rationale:
        Uncalibrated starting value, low because few people own and use a bicycle for everyday trips in most
        cities; calibration to observed mode shares replaces it.

- key: demand.mode.car_availability
  label: "Mode choice: share of people who have a car available for the trip"
  group: Demand
  unit: share
  used_by:
    - "mode choice: car available or not"
  values:
    - context:
        mode: "*"
      low: 0.2
      central: 0.6
      high: 0.9
      basis: educated-guess
      sources:
        - mobsimlab-derivation
      check: unverified
      rationale:
        People without a car choose among public transport, walking and cycling. About 0.8 in car-oriented
        suburbs, 0.4 to 0.6 in European cities, lower in many cities of lower-income countries. Enter the local value
        where the census gives it.

- key: demand.mode.cycle_availability
  label: "Mode choice: share of people who have a bicycle available and can ride it"
  group: Demand
  unit: share
  used_by:
    - "mode choice: cycle available or not"
  values:
    - context:
        mode: "*"
      low: 0.3
      central: 0.7
      high: 0.9
      basis: educated-guess
      sources:
        - mobsimlab-derivation
      check: unverified
      rationale:
        About three quarters of households in north-western Europe own a bicycle; much less where cycling
        is rare. Children under 10 and many older people are left out.

- key: demand.vot.share.hbw
  label: "Value of time: home–work trips, as a share of income per hour"
  group: Demand
  unit: share
  used_by:
    - "mode choice: cost against time"
    - "appraisal: travel time savings"
  values:
    - context:
        mode: "*"
      low: 0.4
      central: 0.5
      high: 0.7
      basis: cited
      sources:
        - usdot-vot-2016
      check: unverified
      rationale: US DOT guidance values personal local travel at 50 % of median hourly income.

- key: demand.vot.share.other
  label: "Value of time: education, other and non-home-based trips, as a share of income per hour"
  group: Demand
  unit: share
  used_by:
    - "mode choice: cost against time"
    - "appraisal: travel time savings"
  values:
    - context:
        mode: "*"
      low: 0.3
      central: 0.5
      high: 0.6
      basis: cited
      sources:
        - usdot-vot-2016
      check: unverified
      rationale: US DOT guidance values personal local travel at 50 % of median hourly income, whatever the purpose.

- key: demand.vot.income_hours
  label: "Value of time: hours a year over which GDP per capita is spread to give income per hour"
  group: Demand
  unit: h
  used_by:
    - "mode choice: cost against time"
  values:
    - context:
        mode: "*"
      low: 1600
      central: 2080
      high: 2500
      basis: documented
      sources:
        - usdot-vot-2016
        - mobsimlab-derivation
      check: unverified
      rationale:
        US DOT divides annual income by 2080 hours. GDP per capita (World Bank, local currency) stands in
        for income, as in the benefit tables.

- key: demand.mode.fare_usd
  label: "Mode choice: average fare paid per public transport trip (2023 US$ PPP)"
  group: Demand
  unit: US$ (2023 PPP)
  used_by:
    - "mode choice: public transport cost"
  values:
    - context:
        mode: "*"
      low: 0
      central: 1.5
      high: 3
      basis: educated-guess
      sources:
        - mobsimlab-derivation
      check: unverified
      rationale:
        Averages over single tickets, passes and free travel come to about 1 to 2 US$ (PPP) per boarding
        in many cities. Converted to the project currency like the cost tables.

- key: demand.mode.car_cost_per_km_usd
  label: "Mode choice: perceived cost of driving per km, fuel and wear (2023 US$ PPP)"
  group: Demand
  unit: US$/km (2023 PPP)
  used_by:
    - "mode choice: car cost"
  values:
    - context:
        mode: "*"
      low: 0.08
      central: 0.15
      high: 0.3
      basis: educated-guess
      sources:
        - mobsimlab-derivation
      check: unverified
      rationale:
        "Drivers perceive fuel and some wear, not the full cost of owning a car: about 0.1 to 0.2 US$ (PPP)
        per km."

- key: demand.mode.parking_cost_usd
  label: "Mode choice: parking cost at a trip end in the central business district (2023 US$ PPP)"
  group: Demand
  unit: US$ (2023 PPP)
  used_by:
    - "mode choice: car cost"
  values:
    - context:
        mode: "*"
      low: 0
      central: 5
      high: 15
      basis: educated-guess
      sources:
        - mobsimlab-derivation
      check: unverified
      rationale:
        Average over free and paid spaces, charged on half the trip legs (the leg that arrives). Elsewhere
        parking is free in the model unless a zone sets its own.

- key: demand.car_occupancy
  label: "Assignment: people per car"
  group: Demand
  unit: persons
  used_by:
    - "road assignment: cars from car trips"
  values:
    - context:
        mode: "*"
      low: 1.1
      central: 1.3
      high: 1.6
      basis: documented
      sources:
        - nhts-2017
        - mid-2017
      check: unverified
      rationale: Average car occupancy in national travel surveys is about 1.3 to 1.5, lower on commuting trips.

- key: demand.road.bpr_alpha
  label: "Road assignment: BPR volume-delay α"
  group: Demand
  unit: –
  used_by:
    - "road assignment: congestion"
  values:
    - context:
        mode: "*"
      low: 0.15
      central: 0.15
      high: 1.0
      basis: cited
      sources:
        - bpr-1964
      check: unverified
      rationale:
        t = t0 · (1 + α (v/c)^β). The Bureau of Public Roads values are α = 0.15 and β = 4; urban arterials
        with signals are often given larger α.

- key: demand.road.bpr_beta
  label: "Road assignment: BPR volume-delay β"
  group: Demand
  unit: –
  used_by:
