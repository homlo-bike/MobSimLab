# Demand model parameters (ADR-0019, 09 §2): zones, trip generation, time periods, distribution, mode choice
# and assignment. Schema: assumptions/README.md. Values by trip purpose are separate keys (hbw home–work,
# hbe home–education, hbo home–other, nhb non-home-based); periods am (morning peak), md (midday), pm
# (evening peak), ev (evening). Walking and cycling speeds are demand.walk_speed_kmh and analysis.cycle_speed_kmh,
# the walk to a stop is mode.catchment_m.

- key: demand.area_buffer_m
  label: "Model area: distance around the project's lines and stations that the model covers"
  group: Demand
  unit: m
  used_by:
    - demand model area
    - automatic zones
  values:
    - context:
        mode: "*"
      low: 1000
      central: 2000
      high: 5000
      basis: educated-guess
      sources:
        - mobsimlab-derivation
      check: unverified
      rationale:
        "Product owner choice (2026-11-16): the model covers the lines plus a 2 km buffer. That holds the
        walk and cycle catchments of every stop (mode.catchment_m is at most about 1.2 km) and the short car trips
        that compete with the line. Use more for lines whose riders come from far away (park and ride, regional rail)."

- key: demand.zone_max_count
  label: "Automatic zones: most hexagons the model area is cut into"
  group: Demand
  unit: zones
  used_by:
    - automatic zones (H3 resolution chosen from the area)
  values:
    - context:
        mode: "*"
      low: 200
      central: 600
      high: 2000
      basis: educated-guess
      sources:
        - mobsimlab-derivation
      check: unverified
      rationale:
        The finest H3 resolution (9, about 0.1 km² per hexagon, down to 6, about 36 km²) that gives at most
        this many zones is used. 600 zones keeps a run to minutes on the worker; 2000 zones gives stop-level detail
        in a large city at about ten times the run time (the skims grow with the square of the zone count).

- key: demand.trip_rate.hbw
  label: "Trips: home–work trips per worker living in the zone, a weekday"
  group: Demand
  unit: trips/worker
  used_by:
    - "trip generation: home–work productions"
  values:
    - context:
        mode: "*"
      low: 1.3
      central: 1.6
      high: 1.9
      basis: documented
      sources:
        - mid-2017
        - nhts-2017
        - mobsimlab-derivation
      check: unverified
      rationale:
        Two legs per commuting day times the share of workers who travel to work on an average weekday (about
        0.8, after leave, sickness, part time and home working). Workers are the zone's people times the country's
        employment ratio (World Bank) for people aged 15 and over.

- key: demand.trip_rate.hbe
  label: "Trips: home–education trips per child under 15 living in the zone, a weekday"
  group: Demand
  unit: trips/child
  used_by:
    - "trip generation: home–education productions"
  values:
    - context:
        mode: "*"
      low: 1.4
      central: 1.7
      high: 1.9
      basis: documented
      sources:
        - mid-2017
        - mobsimlab-derivation
      check: unverified
      rationale:
        Two legs per school day times about 0.85 attendance on an average weekday across the year's school
        weeks. University students are attracted by universities (demand.attraction.university_students) and produced
        through this rate and home–other trips.

- key: demand.trip_rate.hbo
  label: "Trips: home–other trips (shopping, errands, leisure, visits, care) per person, a weekday"
  group: Demand
  unit: trips/person
  used_by:
    - "trip generation: home–other productions"
  values:
    - context:
        mode: "*"
      low: 0.9
      central: 1.3
      high: 1.7
      basis: documented
      sources:
        - mid-2017
        - nhts-2017
        - nts-2019
        - mobsimlab-derivation
      check: unverified
      rationale:
        National travel surveys find about 2.7 (England) to 3.4 (United States) trips per person and day,
        3.1 in Germany (MiD 2017). Home–other trips are about 40 to 50 % of them.

- key: demand.trip_rate.nhb
  label: "Trips: trips that neither start nor end at home, per person living in the model area, a weekday"
  group: Demand
  unit: trips/person
  used_by:
    - "trip generation: non-home-based productions"
  values:
    - context:
        mode: "*"
      low: 0.4
      central: 0.6
      high: 0.9
      basis: documented
      sources:
        - mid-2017
        - nhts-2017
        - mobsimlab-derivation
      check: unverified
      rationale:
        About 15 to 25 % of all trips (work to shop, work to work). They are produced and attracted where
        the jobs, shops and services are, in proportion to the zones' non-home-based attractions.

- key: demand.attraction.per_retail_job
  label: "Attraction: weight of one retail job for home–other trips"
  group: Demand
  unit: weight
  used_by:
    - "trip generation: home–other attractions"
  values:
    - context:
        mode: "*"
      low: 5
      central: 8
      high: 12
      basis: documented
      sources:
        - nchrp-716
        - mobsimlab-derivation
      check: unverified
      rationale:
        "Attraction models give retail employment five to ten times the weight of a household for shopping
        and personal business trips. Weights are relative: the attractions are scaled to the productions."

- key: demand.attraction.per_other_job
  label: "Attraction: weight of one non-retail job for home–other trips"
  group: Demand
  unit: weight
