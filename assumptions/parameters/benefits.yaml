# Benefit estimate parameters (ADR-0040): access for people, ridership, GDP growth, resident earnings,
# land value uplift and the stimulated economy. Schema: assumptions/README.md.
#
# Money values come from the project's country (World Bank GDP per capita in local currency) or from regions
# entered in the GIS tab, which take priority. These parameters are shares, elasticities and ratios.

- key: benefit.uplift_inner_share
  label: "Land value: share of the catchment where the full uplift applies"
  group: Benefits
  unit: share
  used_by:
    - "land value uplift: distance decay"
  values:
    - context:
        mode: "*"
      low: 0.4
      central: 0.5
      high: 0.6
      basis: documented
      sources:
        - debrezion-2007
        - mobsimlab-derivation
      check: unverified
      rationale:
        Uplift is strongest within about 400 m of a rail station and fades to nothing at about 800 m; the
        full uplift applies within this share of the mode's catchment (mode.catchment_m), then falls linearly to zero
        at the catchment edge.
- key: benefit.time_limit.jobs
  label: "Access: longest public transport trip to count jobs as reachable"
  group: Benefits
  unit: min
  used_by:
    - "access for people: places reachable"
  values:
    - context:
        mode: "*"
      low: 30
      central: 45
      high: 60
      basis: educated-guess
      sources: &id001
        - mobsimlab-derivation
      check: unverified
      rationale:
        45 minutes is a common commuting threshold in cumulative-opportunity accessibility studies; 30 and
        60 are the usual sensitivity values.
- key: benefit.time_limit.school
  label: "Access: longest public transport trip to count schools as reachable"
  group: Benefits
  unit: min
  used_by:
    - "access for people: places reachable"
  values:
    - context:
        mode: "*"
      low: 20
      central: 30
      high: 45
      basis: educated-guess
      sources: *id001
      check: unverified
      rationale: A school trip of about 30 minutes; shorter for young pupils.
- key: benefit.time_limit.university
  label: "Access: longest public transport trip to count universities and colleges as reachable"
  group: Benefits
  unit: min
  used_by:
    - "access for people: places reachable"
  values:
    - context:
        mode: "*"
      low: 30
      central: 45
      high: 60
      basis: educated-guess
      sources: *id001
      check: unverified
      rationale: Same threshold as jobs.
- key: benefit.time_limit.hospital
  label: "Access: longest public transport trip to count hospitals as reachable"
  group: Benefits
  unit: min
  used_by:
    - "access for people: places reachable"
  values:
    - context:
        mode: "*"
      low: 20
      central: 30
      high: 45
      basis: educated-guess
      sources: *id001
      check: unverified
      rationale: 30 minutes to a hospital is a usual access standard in health accessibility studies.
- key: benefit.time_limit.clinic
  label: "Access: longest public transport trip to count clinics and doctors as reachable"
  group: Benefits
  unit: min
  used_by:
    - "access for people: places reachable"
  values:
    - context:
        mode: "*"
      low: 15
      central: 20
      high: 30
      basis: educated-guess
      sources: *id001
      check: unverified
      rationale: Primary care should be closer than hospitals.
- key: benefit.access_decay_per_min
  label: "Access: weight of a destination falls by this factor per minute (exp(−β·t))"
  group: Benefits
  unit: 1/min
  used_by:
    - resident earnings from job access
  values:
    - context:
        mode: "*"
      low: 0.03
      central: 0.05
      high: 0.08
      basis: educated-guess
      sources: *id001
      check: unverified
      rationale:
        Negative-exponential accessibility; β = 0.05/min halves the weight of a job every 14 minutes, in
        the range used for commuting in European accessibility studies.
- key: benefit.ed_decay
  label: "Productivity: distance decay of effective density (1/t^α)"
  group: Benefits
  unit: exponent
  used_by:
    - "GDP growth: effective density"
  values:
    - context:
        mode: "*"
      low: 0.8
      central: 1.0
      high: 1.8
      basis: documented
      sources:
        - dft-agglomeration-2018
      check: unverified
      rationale:
        Effective density weights jobs by 1 / (generalised time)^α. UK appraisal guidance uses α = 1 for
        most sectors and up to 1.8 for some; to be checked against TAG A2.4.
- key: benefit.elasticity_agglomeration
  label: "Productivity: agglomeration elasticity (GDP per worker to effective density)"
  group: Benefits
  unit: elasticity
  used_by:
    - GDP growth
  values:
    - context:
        mode: "*"
      low: 0.02
      central: 0.04
      high: 0.07
      basis: cited
      sources:
        - dft-agglomeration-2018
      check: unverified
      rationale:
        A DfT evidence review reports mean agglomeration elasticities usually between 0.02 and 0.05; the
        high value covers business services in large cities.
- key: benefit.elasticity_job_access
  label: "Earnings: elasticity of wages to job accessibility from home"
  group: Benefits
  unit: elasticity
  used_by:
    - resident earnings from job access
  values:
    - context:
        mode: "*"
      low: 0.007
      central: 0.015
      high: 0.04
      basis: cited
      sources:
        - isacsson-2015
      check: unverified
      rationale:
        "Stockholm micro-data: 0.007 for accessibility measured from home and 0.015 for workers who change
        work place; US metropolitan studies find larger values (high)."
- key: benefit.labour_income_share
  label: "Earnings: labour income share of GDP"
  group: Benefits
  unit: share
  used_by:
    - resident earnings from job access
  values:
    - context:
        mode: "*"
      low: 0.4
      central: 0.52
      high: 0.6
      basis: documented
      sources:
        - ilostat-labour-share
      check: unverified
      rationale:
        ILO estimates the global labour income share at a little over half of GDP; national values range
        from about 0.4 to 0.6.
- key: benefit.age_18_24_share
  label: "Education: share of the population aged 18 to 24"
  group: Benefits
  unit: share
  used_by:
    - "access for people: universities"
  values:
    - context:
        mode: "*"
      low: 0.07
      central: 0.09
      high: 0.13
      basis: educated-guess
      sources:
        - worldbank-benefit-wdi
        - mobsimlab-derivation
      check: unverified
      rationale:
        Seven one-year cohorts are about 8–9 % of the population in ageing countries and up to 13 % in young
        ones.
- key: benefit.floor_m2_per_person
  label: "Population fallback: residential floor area per person"
  group: Benefits
  unit: m²
  used_by:
    - population near stations when WorldPop is unavailable
  values:
    - context:
        mode: "*"
      low: 20
      central: 35
      high: 50
      basis: educated-guess
      sources: *id001
      check: unverified
      rationale:
        Dwelling floor area per person ranges from under 20 m² in dense low-income cities to about 40–50
        m² in Western Europe and North America.
- key: benefit.unknown_building_residential_share
  label: "Buildings tagged only 'building=yes': share counted as homes"
  group: Benefits
  unit: share
  used_by:
    - population and jobs from buildings
  values:
