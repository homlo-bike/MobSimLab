    - context:
        mode: metro
      low: 0.01
      central: 0.04
      high: 0.1
      basis: documented
      sources:
        - debrezion-2007
        - rennert-2022
        - mohammad-2013
      check: unverified
      rationale:
        "Debrezion et al. (2007): about 4.2 % for homes and 16.4 % for commercial property in a rail station
