- key: benefit.value_per_m2_gdp_ratio
  label: "Land value fallback: value of 1 m² of homes as a share of GDP per person"
  group: Benefits
  unit: share
  used_by:
    - land value uplift where no region gives a value
  values:
    - context:
        mode: "*"
      low: 0.03
      central: 0.07
      high: 0.15
      basis: educated-guess
      sources: *id001
      check: unverified
      rationale:
        "Average home prices per m² divided by GDP per person: about 0.03 in the United States, 0.07 in France
        and Germany, 0.1 or more in China and fast-growing cities. Deliberately wide; enter a region value where known."
- key: benefit.commercial_value_factor
  label: "Land value fallback: value of 1 m² of work places relative to homes"
  group: Benefits
  unit: ratio
  used_by:
    - land value uplift where no region gives a value
  values:
    - context:
        mode: "*"
      low: 0.8
      central: 1.2
      high: 1.8
      basis: educated-guess
      sources: *id001
      check: unverified
      rationale: Offices and shops in station areas are usually worth somewhat more per m² than homes.
- key: benefit.property_tax_rate
  label: "Tax: recurrent property tax as a share of property value per year"
  group: Benefits
  unit: share
  used_by:
    - extra property tax from land value uplift
  values:
    - context:
        mode: "*"
      low: 0.002
      central: 0.005
      high: 0.012
      basis: educated-guess
      sources: *id001
      check: unverified
      rationale:
        Effective recurrent property tax rates range from about 0.2 % to over 1 % of market value a year;
        a region's tax revenue replaces this where entered.
- key: benefit.domestic_share.civil
  label: "Stimulated economy: share of spending on civil works, stations and depots that stays in the country"
  group: Benefits
  unit: share
  used_by:
    - stimulated economy
  values:
    - context:
        mode: "*"
      low: 0.75
      central: 0.85
      high: 0.95
      basis: educated-guess
      sources: *id001
      check: unverified
      rationale: Construction is mostly local labour and materials.
- key: benefit.domestic_share.systems
  label: "Stimulated economy: share of spending on track, power and signalling that stays in the country"
  group: Benefits
  unit: share
  used_by:
