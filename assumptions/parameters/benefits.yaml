        mode: "*"
      low: 0.5
      central: 0.7
      high: 0.85
      basis: educated-guess
      sources: *id001
      check: unverified
      rationale:
        Most untagged buildings in OpenStreetMap are houses or blocks of flats; the rest are shops, offices
        and sheds.
- key: benefit.default_levels
  label: "Buildings without height or levels in OpenStreetMap: number of floors"
