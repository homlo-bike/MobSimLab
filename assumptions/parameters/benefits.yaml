- key: benefit.ridership.resident_share
  label: "Ridership: share of residents near a station who use the line on a weekday"
  group: Benefits
  unit: share
  used_by:
    - ridership formula
  values:
    - context:
        mode: "*"
      low: 0.05
      central: 0.12
      high: 0.25
      basis: educated-guess
      sources: *id001
      check: unverified
      rationale: Starting point for the ridership formula; replace with local mode share data.
    - context:
        mode:
          - bus
          - trolleybus
      low: 0.03
      central: 0.08
      high: 0.15
      basis: educated-guess
      sources: *id001
      check: unverified
      rationale: Bus lines attract a smaller share of the people living near them than rail.
    - context:
        mode:
          - intercity_bus
          - long_distance_rail
          - high_speed_rail
      low: 0.005
      central: 0.02
      high: 0.05
      basis: educated-guess
      sources: *id001
      check: unverified
      rationale: Long-distance services are used occasionally, not daily.
    - context:
        mode: metro
      low: 0.1
      central: 0.2
      high: 0.3
      basis: educated-guess
      sources: *id001
      check: unverified
      rationale: Metro catchments in large cities reach transit mode shares of a third or more.
- key: benefit.ridership.trips_per_user
  label: "Ridership: trips per user per weekday"
  group: Benefits
  unit: trips
  used_by:
    - ridership formula
  values:
    - context:
        mode: "*"
      low: 1.6
      central: 2.0
      high: 2.4
      basis: educated-guess
      sources: *id001
      check: unverified
      rationale: A return trip, with some users making one-way or extra trips.
- key: benefit.ridership.days_per_year
  label: "Ridership: weekday equivalents per year"
  group: Benefits
  unit: days
  used_by:
    - ridership formula
  values:
    - context:
        mode: "*"
      low: 280
      central: 300
      high: 330
      basis: educated-guess
      sources: *id001
      check: unverified
      rationale:
        Annual ridership is usually 280–330 times average weekday ridership, as weekends and holidays carry
        less.
