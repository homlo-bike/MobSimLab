# Platform–vehicle interface (accessibility) defaults. Schema: assumptions/README.md.

- key: access.level_gap_horizontal_mm
  label: "Level access: largest horizontal gap between platform edge and vehicle floor"
  group: Accessibility
  unit: mm
  used_by: [level-access check per door]
  values:
    - context:
        mode: "*"
      low: 50
      central: 75
      high: 100
      basis: cited
      sources: [tsi-prm, railfuture-step-gap, ada-49cfr38]
      check: secondary
      rationale: TSI PRM (and GB NTSN) treat boarding as unassisted level access with a horizontal gap ≤ 75 mm; ADA level boarding for rapid and light rail uses 3 in (≈ 76 mm).

- key: access.level_gap_vertical_mm
  label: "Level access: largest height difference between platform and vehicle floor"
  group: Accessibility
  unit: mm
  used_by: [level-access check per door]
  values:
    - context:
        mode: "*"
      low: 16
      central: 50
      high: 50
      basis: cited
      sources: [tsi-prm, railfuture-step-gap, ada-49cfr38]
      check: secondary
      rationale: "TSI PRM: vertical step ≤ 50 mm in either direction (seen in source); ADA: ± 5/8 in (≈ 16 mm) for rapid and light rail (to be checked)."

- key: access.step_gap_horizontal_mm
  label: "Step limit: largest horizontal gap (straight track)"
  group: Accessibility
  unit: mm
  used_by: [step-gap check per door when level access is not met]
  values:
    - context:
        mode: "*"
      low: 75
      central: 200
      high: 200
      basis: cited
      sources: [tsi-prm]
      check: unverified
      rationale: "TSI PRM step position limits for the first access step relative to a platform on straight, level track: horizontal 200 mm. Clause to be checked."

- key: access.step_above_platform_mm
  label: "Step limit: vehicle floor at most this much above the platform"
  group: Accessibility
  unit: mm
  used_by: [step-gap check per door]
  values:
    - context:
        mode: "*"
      low: 50
      central: 230
      high: 230
      basis: cited
      sources: [tsi-prm]
      check: unverified
      rationale: "TSI PRM step position: first step at most 230 mm above the platform. Clause to be checked."

- key: access.step_below_platform_mm
  label: "Step limit: vehicle floor at most this much below the platform"
  group: Accessibility
  unit: mm
  used_by: [step-gap check per door]
  values:
    - context:
        mode: "*"
      low: 50
      central: 160
      high: 160
      basis: cited
      sources: [tsi-prm]
      check: unverified
      rationale: "TSI PRM step position: first step at most 160 mm below the platform. Clause to be checked."

- key: vehicle.floor_height_mm
  label: "Vehicle floor height above rail, used when the vehicle file has none"
  group: Accessibility
  unit: mm
  used_by: [platform accessibility check per service line and station]
  values:
    - context:
        mode: "*"
      low: 300
      central: 800
      high: 1300
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Wide fallback across rail modes; the vehicle catalogue's own floor heights range from 300 to 1300 mm.
    - context:
        mode: tram
      low: 300
      central: 350
      high: 400
      basis: documented
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Low-floor trams in the vehicle catalogue have 300–400 mm floors at the doors (10 of 13 with a floor height; most 350 mm).
    - context:
        mode: light_rail
      low: 350
      central: 400
      high: 1000
      basis: documented
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Low-floor light rail and tram-trains in the catalogue have 356–550 mm floors; high-floor Stadtbahn stock (Stuttgart DT 8) has 1000 mm.
    - context:
        mode: metro
      low: 700
      central: 1100
      high: 1200
      basis: documented
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Most metro cars in the catalogue have 950–1200 mm floors (about 1100 mm typical); small-profile lines such as the Glasgow Subway are lower (695 mm).
    - context:
        mode: commuter_rail
      low: 600
      central: 800
      high: 1100
      basis: documented
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Commuter units in the catalogue have 780–1100 mm floors; low-floor units built for 550 or 760 mm platforms have about 600–800 mm.
    - context:
        mode: regional_rail
      low: 500
      central: 780
      high: 1250
      basis: documented
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Regional units in the catalogue range from low-floor (495–780 mm) to high-floor British stock (about 1250 mm); 780 mm suits the common 760 mm platform.
    - context:
        mode: long_distance_rail
      low: 760
      central: 1200
      high: 1300
      basis: documented
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Long-distance coaches in the catalogue have 1180–1296 mm floors.
    - context:
        mode: high_speed_rail
      low: 760
      central: 1240
      high: 1300
      basis: documented
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: High-speed trains in the catalogue have 940–1240 mm floors; the Talgo Avril is a low-floor exception at about 760 mm.
