# Street and depot layout defaults. Schema: assumptions/README.md.

- key: depot.vehicles_per_lane
  label: "Street depot: vehicles per parking lane"
  group: Depots and streets
  unit: vehicles
  used_by: [automatic bus depot layout]
  values:
    - context:
        mode: "*"
      low: 2
      central: 4
      high: 8
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Longer lanes save area but block vehicles in (last in, first out); 3–5 is a common compromise.

- key: depot.lateral_spacing_m
  label: "Street depot: space between vehicles in neighbouring lanes"
  group: Depots and streets
  unit: m
  used_by: [automatic bus depot layout]
  values:
    - context:
        mode: "*"
      low: 0.8
      central: 1.0
      high: 1.5
      basis: documented
      sources: [eu-dir-96-53, mobsimlab-derivation]
      check: unverified
      rationale: Bus width 2.55 m (Directive 96/53/EC) in parking lanes of 3.5–4.0 m leaves about 1.0–1.5 m; mirrors need at least about 0.8 m.

- key: depot.walkway_width_m
  label: "Street depot: walkway width between lanes"
  group: Depots and streets
  unit: m
  used_by: [automatic bus depot layout]
  values:
    - context:
        mode: "*"
      low: 0.9
      central: 1.2
      high: 1.5
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Escape route and staff access width as used in workplace rules (about 0.9–1.2 m).

- key: depot.walkway_every_n_lanes
  label: "Street depot: a walkway after every n lanes"
  group: Depots and streets
  unit: lanes
  used_by: [automatic bus depot layout]
  values:
    - context:
        mode: "*"
      low: 1
      central: 2
      high: 4
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Every second lane gives each vehicle a walkway on one side.

- key: depot.aisle_width_m
  label: "Street depot: width of the aisles at the lane ends and of the perimeter road"
  group: Depots and streets
  unit: m
  used_by: [automatic bus depot layout, swept-path check]
  values:
    - context:
        mode: "*"
      low: 8
      central: 12
      high: 18
      basis: documented
      sources: [eu-dir-96-53, mobsimlab-derivation]
      check: unverified
      rationale: A bus must turn within a 12.5 m outer / 5.3 m inner radius (96/53/EC); a 90° turn into a lane needs an aisle of roughly 10–15 m; straight drive-through lanes need only about 8 m.

- key: depot.longitudinal_gap_m
  label: "Street depot: gap between vehicles one behind the other in a lane"
  group: Depots and streets
  unit: m
  used_by: [automatic bus depot layout]
  values:
    - context:
        mode: "*"
      low: 0.5
      central: 1.0
      high: 2.0
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Room to walk between vehicles and for charging connectors.

- key: depot.turning_circle_m
  label: "Street depot: kerb-to-kerb turning circle of a bus the catalogue gives none for"
  group: Depots and streets
  unit: m
  used_by: [automatic bus depot layout, swept-path check]
  values:
    - context:
        mode: "*"
      low: 21
      central: 24
      high: 25
      basis: documented
      sources: [eu-dir-96-53, mobsimlab-derivation]
      check: unverified
      rationale: "A bus must turn within a circle of 12.5 m outer radius (25 m diameter, 96/53/EC); catalogue 12 m buses quote about 19–22 m. The swept-path check uses the vehicle's own value where the catalogue has one."

- key: depot.swept_clearance_m
  label: "Street depot: smallest gap between a manoeuvring vehicle and a parked vehicle or the fence"
  group: Depots and streets
  unit: m
  used_by: [swept-path check, automatic bus depot layout]
  values:
    - context:
        mode: "*"
      low: 0.2
      central: 0.3
      high: 0.5
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: "Margin for driver accuracy at walking pace in a depot, on top of the body outline (mirrors fold over parked vehicles); swept-path templates are commonly drawn with 0.3–0.5 m."

- key: depot.charger_power_kw
  label: "Street depot: power of the charger at each charging slot"
  group: Depots and streets
  unit: kW
  used_by: [automatic bus depot layout, road simulation charging]
  values:
    - context:
        mode: "*"
      low: 50
      central: 150
      high: 300
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: "Overnight plug-in depot chargers for battery buses are commonly 40–150 kW per vehicle; 150 kW also allows a midday top-up. Pantograph chargers reach 300 kW or more."

- key: street.lane_width_m
  label: Lane width of a street (vehicles drawn half a lane from the centreline)
  group: Depots and streets
  unit: m
  used_by: [vehicle drawing offset, swept-path check]
  values:
    - context:
        mode: "*"
      low: 3.0
      central: 3.25
      high: 3.75
      basis: documented
      sources: [rast06, aashto-green-book]
      check: unverified
      rationale: Urban lanes used by buses are about 3.25–3.50 m in German guidance (RASt 06); US standard lane is 12 ft (3.66 m). Values to be checked.

- key: street.lanes
  label: Lanes of a street carriageway (swept-path check of road vehicles)
  group: Depots and streets
  unit: lanes
  used_by: [swept-path check when OSM has no lanes tag]
  values:
    - context:
        mode: "*"
      low: 1
      central: 2
      high: 4
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: One lane per direction is the most common urban street; OSM lanes=* wins when present.

- key: street.speed_limit_kmh
  label: Speed limit of a street where OSM has no maxspeed (trams running in the street keep to it)
  group: Depots and streets
  unit: km/h
  used_by: [speed of street-running trams, road traffic]
  values:
    - context:
        mode: "*"
      low: 30
      central: 50
      high: 60
      basis: cited
      sources: [stvo, bostrab]
      check: unverified
      rationale: "50 km/h is the general limit inside built-up areas (StVO § 3(3)); many towns use 30 km/h on residential streets and some countries 60 km/h. Trams on track embedded in the street run under the road traffic rules (BOStrab), so the street's limit caps their speed there. OSM maxspeed wins when present."

- key: street.mixed_traffic_delay_share
  label: "Extra running time of buses and trams in the traffic of a main road (share of the free-flow time)"
  group: Depots and streets
  unit: share
  used_by:
    [street line running times and reliability check, tram street running reliability, GIS tab street setup]
  values:
    - context:
        mode: "*"
      low: 0.1
      central: 0.25
      high: 0.5
      basis: educated-guess
      sources: [tcqsm3, hcm7, mobsimlab-derivation]
      check: unverified
      rationale: "Buses and trams in the general traffic of a main road lose time in queues at signals and in jams; at peak, urban bus speeds in mixed traffic are commonly 20–50 % below those in a reserved lane (TCQSM bus running speed and lane type adjustments; HCM urban street speeds). The central 25 % is a planning value until the simulation measures it; set a bus or tram lane in the GIS tab to remove it."

- key: street.bus_lane_delay_share
  label: "Extra running time in a painted (not separated) bus or tram lane (share of the free-flow time)"
  group: Depots and streets
  unit: share
  used_by:
    [street line running times and reliability check, tram street running reliability, GIS tab street setup]
  values:
    - context:
        mode: "*"
      low: 0.03
      central: 0.08
      high: 0.15
      basis: educated-guess
      sources: [tcqsm3, mobsimlab-derivation]
      check: unverified
      rationale: "A lane that is only painted is entered by turning, parking and loading vehicles; TCQSM treats such lanes as giving part of the benefit of a separated lane. 8 % is about a third of the mixed-traffic loss. A kerb, barrier or separate track bed (separation in the GIS tab) removes it."

- key: street.walking_pace_kmh
  label: Speed in a living street or pedestrian zone (walking pace)
  group: Depots and streets
  unit: km/h
  used_by: [speed of street-running trams, road traffic]
  values:
    - context:
        mode: "*"
      low: 4
      central: 7
      high: 10
      basis: educated-guess
      sources: [stvo, mobsimlab-derivation]
      check: unverified
      rationale: "Living streets and pedestrian zones allow walking pace only (StVO sign 325.1); courts read this as about 4–7 km/h, and trams in pedestrian zones often run at 10–15 km/h by local rule."

- key: street.driving_side
  label: Driving side of buses, BRT and trolleybuses
  group: Depots and streets
  unit: side
  kind: enum
  options: [right, left]
  used_by: [road network, stop side, door side]
  values:
    - context:
        mode: "*"
      central: right
      basis: cited
      sources: [vienna-convention-1968]
      check: unverified
      rationale: Right-hand traffic in most countries; the project country sets it (left in for example GB, IE, MT, CY, JP, IN, AU, NZ, ZA, HK, SG, TH, ID).

- key: track.running_side
  label: Running side for new double track
  group: Depots and streets
  unit: side
  kind: enum
  options: [right, left]
  used_by: [new double track, signal placement]
  values:
    - context:
        mode: "*"
      central: right
      basis: documented
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: "Follow the national mainline convention: right in for example DE, AT, NL, ES, PL, CZ, US; left in GB, FR (except Alsace-Moselle), BE, CH, IT, SE, PT, JP. Trams and most metros follow road traffic."

- key: street.peak_cars_trunk_vph
  label: "Cars at peak on an urban trunk road (OSM trunk, trunk_link, motorway_link), per hour in each direction, where the planner sets none"
  group: Depots and streets
  unit: cars per hour per direction
  used_by: [GIS tab street setup traffic peaks, road simulation background traffic]
  values:
    - context:
        mode: "*"
      low: 800
      central: 1500
      high: 2500
      basis: educated-guess
      sources: [rast06, hcm7, mobsimlab-derivation]
      check: unverified
      rationale: "A two-lane-per-direction urban expressway or trunk road carries roughly 1,000–2,500 vehicles per hour per direction at peak; HCM gives about 1,800–1,900 cars per hour per lane as base saturation flow, and signals and merges keep the hourly flow well below twice that. The same value is used for the morning and the evening peak; set a street's own counts in the GIS tab."

- key: street.peak_cars_primary_vph
  label: "Cars at peak on a primary road (OSM primary, primary_link), per hour in each direction, where the planner sets none"
  group: Depots and streets
  unit: cars per hour per direction
  used_by: [GIS tab street setup traffic peaks, road simulation background traffic]
  values:
    - context:
        mode: "*"
      low: 500
      central: 900
      high: 1500
      basis: educated-guess
      sources: [rast06, hcm7, mobsimlab-derivation]
      check: unverified
      rationale: "RASt 06 street types for main roads (Hauptverkehrsstraßen) span roughly 800–2,600 vehicles per hour over the cross-section at peak, so about 400–1,300 per direction; a signalised lane takes about 600–900 per hour at a typical green share (HCM). The same value is used for the morning and the evening peak; set a street's own counts in the GIS tab."

- key: street.peak_cars_secondary_vph
  label: "Cars at peak on a secondary road (OSM secondary, secondary_link), per hour in each direction, where the planner sets none"
  group: Depots and streets
  unit: cars per hour per direction
  used_by: [GIS tab street setup traffic peaks, road simulation background traffic]
  values:
    - context:
        mode: "*"
      low: 300
      central: 600
      high: 1000
      basis: educated-guess
      sources: [rast06, hcm7, mobsimlab-derivation]
      check: unverified
      rationale: "Lower end of the RASt 06 main road range: distributor roads with one lane per direction carry a few hundred to about 1,000 vehicles per hour per direction at peak. The same value is used for the morning and the evening peak; set a street's own counts in the GIS tab."

- key: street.peak_cars_tertiary_vph
  label: "Cars at peak on a tertiary road (OSM tertiary, tertiary_link), per hour in each direction, where the planner sets none"
  group: Depots and streets
  unit: cars per hour per direction
  used_by: [GIS tab street setup traffic peaks, road simulation background traffic]
  values:
    - context:
        mode: "*"
      low: 150
      central: 300
      high: 600
      basis: educated-guess
      sources: [rast06, hcm7, mobsimlab-derivation]
      check: unverified
      rationale: "RASt 06 collector streets (Sammelstraßen) carry roughly 400–1,000 vehicles per hour over the cross-section at peak, so about 200–500 per direction. The same value is used for the morning and the evening peak; set a street's own counts in the GIS tab."

- key: street.peak_cars_local_vph
  label: "Cars at peak on a local street (OSM unclassified, residential, living_street, service, road), per hour in each direction, where the planner sets none"
  group: Depots and streets
  unit: cars per hour per direction
  used_by: [GIS tab street setup traffic peaks, road simulation background traffic]
  values:
    - context:
        mode: "*"
      low: 10
      central: 50
      high: 150
      basis: educated-guess
      sources: [rast06, hcm7, mobsimlab-derivation]
      check: unverified
      rationale: "RASt 06 residential streets (Wohnstraßen, Wohnwege) carry up to about 400 vehicles per hour over the cross-section, most far less; 50 per direction is a quiet street with only its own residents' traffic. The same value is used for the morning and the evening peak; set a street's own counts in the GIS tab."

- key: road.off_peak_traffic_share
  label: "Road simulation: background traffic outside the peaks, as a share of the street's peak value"
  group: Depots and streets
  unit: share
  used_by: [road simulation background traffic]
  values:
    - context:
        mode: "*"
      low: 0.4
      central: 0.6
      high: 0.8
      basis: educated-guess
      sources: [hcm7, mobsimlab-derivation]
      check: unverified
      rationale: "Streets only carry peak values (GIS tab traffic peaks), so midday and evening runs scale them. Urban weekday hourly profiles put a midday hour at roughly 5–6 % of the daily traffic against 8–10 % in the peak hour (HCM K-factors), about 0.6 of the peak; late evening is lower, so set your own value for evening runs."

- key: road.trolley_wire_charge_kw
  label: "Road simulation: power a trolleybus takes from its wires to charge its battery while driving"
  group: Depots and streets
  unit: kW
  used_by: [road simulation trolleybus energy]
  values:
    - context:
        mode: "*"
      low: 60
      central: 120
      high: 200
      basis: educated-guess
      sources: [uitp-trolleybus-tco, mobsimlab-derivation]
      check: unverified
      rationale: "In-motion charging trolleybuses recharge their traction battery from the wires at roughly 50–200 kW on top of the power for driving; the road simulation gives this power to the battery on every street with a trolleybus wire (OSM trolley_wire)."

- key: road.battery_capacity_kwh
  label: "Road simulation: usable battery of a battery bus, or of a trolleybus for running off the wires"
  group: Depots and streets
  unit: kWh
  used_by: [road simulation battery energy]
  values:
    - context:
        mode: "*"
      low: 250
      central: 350
      high: 450
      basis: educated-guess
      sources: [vde-ebus-fleet, mobsimlab-derivation]
      check: unverified
      rationale: "12 m battery buses for overnight depot charging carry about 300–500 kWh installed, of which roughly 80 % is usable."
    - context:
        mode: brt
      low: 350
      central: 500
      high: 650
      basis: educated-guess
      sources: [vde-ebus-fleet, mobsimlab-derivation]
      check: unverified
      rationale: "18 m articulated battery buses carry about 450–800 kWh installed."
    - context:
        mode: trolleybus
      low: 30
      central: 60
      high: 120
      basis: educated-guess
      sources: [uitp-trolleybus-tco, mobsimlab-derivation]
      check: unverified
      rationale: "In-motion charging trolleybuses carry a smaller battery for sections without wires, typically 30–120 kWh."
