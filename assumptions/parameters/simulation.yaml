# Simulation and signalling defaults. Schema: assumptions/README.md.

- key: sim.start_adhesion
  label: Wheel–rail adhesion for starting, when a vehicle gives no starting tractive effort (simulation)
  group: Simulation
  unit: coefficient
  used_by: [rail kernel starting tractive effort = adhesion × adhesive weight × g]
  values:
    - context:
        mode: "*"
      low: 0.15
      central: 0.25
      high: 0.33
      basis: documented
      sources: [curtius-kniffler]
      check: unverified
      rationale: Curtius–Kniffler μ = 0.161 + 7.5/(v + 44) gives 0.33 at standstill on dry rail; 0.25 is a common design value with wheel-slip control; wet or leaf-contaminated rail can fall to 0.15 or less.
    - context:
        mode: [tram, light_rail]
      low: 0.15
      central: 0.2
      high: 0.3
      basis: educated-guess
      sources: [curtius-kniffler, mobsimlab-derivation]
      check: unverified
      rationale: Grooved rail in streets collects dirt and water; lower central value.

- key: sim.time_gap_s
  label: Time gap to the vehicle ahead, buses and trams driving on sight (simulation)
  group: Simulation
  unit: s
  used_by: [SUMO tau, on-sight car-following for trams]
  values:
    - context:
        mode: "*"
      low: 1.0
      central: 1.5
      high: 2.0
      basis: documented
      sources: [sumo-vtype]
      check: secondary
      rationale: SUMO default tau is 1.0 s; professional drivers of heavy vehicles keep longer gaps.
    - context:
        mode: [bus, brt, trolleybus, intercity_bus]
      low: 1.0
      central: 1.5
      high: 2.0
      basis: documented
      sources: [sumo-vtype]
      check: secondary
      rationale: As above.
    - context:
        mode: [tram, light_rail]
      low: 1.5
      central: 2.0
      high: 3.0
      basis: educated-guess
      sources: [bostrab, mobsimlab-derivation]
      check: unverified
      rationale: On-sight running must allow stopping within the visible distance (BOStrab); longer than road vehicles because of lower service braking.

- key: sim.min_gap_stopped_m
  label: Minimum gap to the vehicle ahead when stopped, buses and trams (simulation)
  group: Simulation
  unit: m
  used_by: [SUMO minGap, stop queueing]
  values:
    - context:
        mode: "*"
      low: 1.0
      central: 2.5
      high: 4.0
      basis: cited
      sources: [sumo-vtype]
      check: secondary
      rationale: SUMO default minGap is 2.5 m.
    - context:
        mode: [tram, light_rail]
      low: 1.0
      central: 2.0
      high: 5.0
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Trams queue closely at stops but must keep couplers apart.

- key: sim.rail_min_following_distance_m
  label: Minimum distance between following metro and commuter trains (simulation)
  group: Simulation
  unit: m
  used_by: [rail kernel moving-block / on-sight separation floor]
  values:
    - context:
        mode: "*"
      low: 20
      central: 50
      high: 100
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Safety margin added behind the rear of the train ahead under moving block (CBTC) separation; fixed-block lines get their separation from block sections and overlaps instead.

- key: signalling.overlap_31_40_m
  label: Signal overlap before the clearance point, 31–40 km/h (metro and commuter rail)
  group: Simulation
  unit: m
  used_by: [route setting, interlocking release, headway]
  values:
    - context:
        mode: "*"
      low: 30
      central: 50
      high: 50
      basis: cited
      sources: [db-ril-819]
      check: unverified
      rationale: "DB Ril 819.0202: overlap 50 m for entry speeds up to 40 km/h. Metro lines with train stops often use shorter computed overlaps. Clause to be checked."

- key: signalling.overlap_41_60_m
  label: Signal overlap before the clearance point, 41–60 km/h (metro and commuter rail)
  group: Simulation
  unit: m
  used_by: [route setting, interlocking release, headway]
  values:
    - context:
        mode: "*"
      low: 50
      central: 100
      high: 100
      basis: cited
      sources: [db-ril-819]
      check: unverified
      rationale: "DB Ril 819.0202: overlap 100 m for entry speeds 41–60 km/h. Clause to be checked."

- key: signalling.overlap_above_60_m
  label: Signal overlap before the clearance point, above 60 km/h (metro and commuter rail)
  group: Simulation
  unit: m
  used_by: [route setting, interlocking release, headway]
  values:
    - context:
        mode: "*"
      low: 100
      central: 200
      high: 200
      basis: cited
      sources: [db-ril-819]
      check: unverified
      rationale: "DB Ril 819.0202: standard overlap 200 m above 60 km/h. Clause to be checked."

- key: signalling.route_setting_s
  label: Route setting time before switch throwing (electronic interlocking)
  group: Simulation
  unit: s
  used_by: [blocking times, route setting]
  values:
    - context:
        mode: "*"
      low: 2
      central: 3
      high: 10
      basis: documented
      sources: [pachl-roc]
      check: unverified
      rationale: "Blocking time component 'route formation': a few seconds for electronic interlockings, longer for relay interlockings; the switch throw time from the switch catalogue is added on top."

- key: signalling.sight_reaction_s
  label: Driver sight and reaction time at the approach point
  group: Simulation
  unit: s
  used_by: [blocking times]
  values:
    - context:
        mode: "*"
      low: 6
      central: 12
      high: 18
      basis: documented
      sources: [pachl-roc]
      check: unverified
      rationale: "Blocking time component 'sight and reaction': the time the driver needs to see the aspect at the distant signal or sighting point and react; about 0.2 min is the usual planning value."

- key: signalling.release_s
  label: Route release time after the train has cleared a section
  group: Simulation
  unit: s
  used_by: [blocking times, sectional release]
  values:
    - context:
        mode: "*"
      low: 1
      central: 3
      high: 10
      basis: documented
      sources: [pachl-roc]
      check: unverified
      rationale: "Blocking time component 'release': short for electronic interlockings with axle counters or track circuits; longer for manual or relay release."

- key: signalling.sighting_m
  label: Sighting distance added to the braking distance for the approach
  group: Simulation
  unit: m
  used_by: [blocking times]
  values:
    - context:
        mode: "*"
      low: 50
      central: 150
      high: 300
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: "Distance a driver needs to read a signal aspect before the braking point; lineside signals are typically readable for 10–15 s at line speed. Cab signalling (ETCS L2, CBTC) can set it to 0."
    - context:
        mode: [metro, tram, light_rail]
      low: 0
      central: 50
      high: 150
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: "Lower speeds and short blocks; CBTC lines use 0."

- key: signalling.system
  label: Train control and signalling of a railway system (which signals the railway design tool generates)
  group: Simulation
  unit: system
  kind: enum
  options: [line_of_sight, fixed_block, cbtc, etcs_l2]
  used_by: [generated signal plan (home and starter signals, block signals or cab-signalling block markers), blocking times]
  values:
    - context:
        mode: "*"
      central: fixed_block
      basis: documented
      sources: [db-ril-819]
      check: unverified
      rationale: "Mainline railways run on fixed blocks with lineside main and block signals; overlaps follow DB Ril 819.0202."
    - context:
        mode: tram
      central: line_of_sight
      basis: cited
      sources: [bostrab]
      check: unverified
      rationale: "Trams drive on sight (BOStrab); signals only protect switches, junctions and crossings with other railways."
    - context:
        mode: metro
      low: fixed_block
      central: cbtc
      high: cbtc
      basis: documented
      sources: [tcqsm3, vuchic-2007]
      check: unverified
      rationale: New and resignalled metro lines use communications-based train control (CBTC); older lines keep fixed blocks with train stops.
    - context:
        mode: high_speed_rail
      low: fixed_block
      central: etcs_l2
      high: etcs_l2
      basis: cited
      sources: [tsi-ccs]
      check: unverified
      rationale: High-speed lines in the EU are equipped with ETCS (TSI CCS); Level 2 uses cab signalling with block marker boards instead of lineside block signals. Older lines use national cab signalling such as LZB.

- key: signalling.signal_before_switch_m
  label: Distance of a signal in front of the switch point (blade tip) it protects
  group: Simulation
  unit: m
  used_by: [generated signal plan]
  values:
    - context:
        mode: "*"
      low: 5
      central: 10
      high: 50
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: The signal stands just in front of the first switch it protects, so a train waiting at it does not foul the switch; room for the insulated joint or axle counter and the signal mast. Signals facing a switch from its legs stand at the clearance marker (the fouling point in the topology export) instead.
