- key: mode.catchment_m
  label: Catchment, walking distance to a stop
  group: Modes
  unit: m
  used_by: [coverage analysis, demand model access links]
  values:
    - context:
        mode: "*"
      low: 300
      central: 400
      high: 800
      basis: cited
      sources: [tcqsm3]
      check: unverified
      rationale: "TCQSM: about 1/4 mile (400 m) to bus stops and 1/2 mile (800 m) to rail stations."
    - context:
        mode: [bus, trolleybus]
      low: 300
      central: 400
      high: 500
      basis: cited
      sources: [tcqsm3]
      check: unverified
      rationale: 1/4 mile.
    - context:
        mode: brt
      low: 400
      central: 600
      high: 800
      basis: documented
      sources: [tcqsm3]
      check: unverified
      rationale: Between bus and rail values.
    - context:
        mode: intercity_bus
      low: 800
      central: 1500
      high: 3000
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Reached mostly by feeder transit or car; walking catchment is a weak model here.
    - context:
        mode: tram
      low: 300
      central: 500
      high: 600
      basis: documented
      sources: [tcqsm3]
      check: unverified
      rationale: Between bus and rail values.
    - context:
        mode: [light_rail, metro]
      low: 500
      central: 800
      high: 1000
      basis: cited
      sources: [tcqsm3]
      check: unverified
      rationale: 1/2 mile.
    - context:
        mode: commuter_rail
      low: 800
      central: 1000
      high: 2000
      basis: documented
      sources: [tcqsm3]
      check: unverified
      rationale: Longer access trips, bike and park-and-ride.
    - context:
        mode: [regional_rail, long_distance_rail, high_speed_rail]
      low: 1000
      central: 2000
      high: 5000
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Station is usually reached by other modes; walking catchment only bounds the walk-only share.

- key: mode.right_of_way
  label: Structure and right of way (category A, B or C)
  group: Modes
  unit: category
  kind: enum
  options: [A, B, C]
  used_by: [default for new lines, interaction with road traffic in simulation]
  values:
    - context:
        mode: "*"
      central: C
      basis: cited
      sources: [vuchic-2007]
      check: unverified
      rationale: "Vuchic: A = fully separated, B = longitudinally separated with level crossings, C = mixed with traffic."
    - context:
        mode: [bus, trolleybus, intercity_bus]
      low: B
      central: C
      high: C
      basis: cited
      sources: [vuchic-2007]
      check: unverified
      rationale: Street running.
    - context:
        mode: brt
      low: A
      central: B
      high: B
      basis: cited
      sources: [vuchic-2007]
      check: unverified
      rationale: Busway with at-grade junctions.
    - context:
        mode: tram
      low: B
      central: C
      high: C
      basis: cited
      sources: [vuchic-2007]
      check: unverified
      rationale: Street running with some reserved track.
    - context:
        mode: light_rail
      low: A
      central: B
      high: C
      basis: cited
      sources: [vuchic-2007]
      check: unverified
      rationale: Mostly reserved track.
    - context:
        mode: [metro, commuter_rail, regional_rail, long_distance_rail, high_speed_rail]
      low: A
      central: A
      high: B
      basis: cited
      sources: [vuchic-2007]
      check: unverified
      rationale: Fully separated; mainline rail may keep level crossings (category B).

- key: mode.platform_height_mm
  label: Platform height above rail (rail) or kerb height above road (road modes)
  group: Modes
  unit: mm
  used_by: [level-access check, new stop defaults]
  values:
    - context:
        mode: "*"
      low: 160
      central: 300
      high: 1000
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Wide fallback.
    - context:
        mode: [bus, trolleybus]
      low: 160
      central: 180
      high: 220
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Raised bus kerbs (for example the Kassel kerb family) are made in 160–220 mm heights; low-floor bus entry is about 320 mm when not kneeling.
    - context:
        mode: brt
      low: 220
      central: 300
      high: 900
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Low-floor BRT uses raised kerbs; high-floor closed-station BRT (for example Bogotá) uses about 900 mm.
    - context:
        mode: intercity_bus
      low: 120
      central: 160
      high: 180
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: High-floor coaches; kerb height does not give level access.
    - context:
        mode: tram
      low: 200
      central: 250
      high: 300
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Low-floor trams have a floor of about 300–350 mm; platforms sit slightly below to allow for suspension travel.
    - context:
        mode: light_rail
      low: 300
      central: 350
      high: 900
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Low-floor or high-floor systems.
    - context:
        mode: metro
      low: 900
      central: 1000
      high: 1100
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: High-floor metro stock.
    - context:
        mode: commuter_rail
      low: 760
      central: 960
      high: 1219
      basis: documented
      sources: [tsi-inf, ada-49cfr38]
      check: unverified
      rationale: German S-Bahn 960 mm; TSI 760 mm; North American high-level platforms 48 in (1219 mm).
    - context:
        mode: [regional_rail, long_distance_rail, high_speed_rail]
      low: 550
      central: 760
      high: 760
      basis: cited
      sources: [tsi-inf, eu-accessible-platforms]
      check: secondary
      rationale: TSI INF nominal platform heights are 550 mm and 760 mm above the running surface.

- key: mode.platform_length_m
  label: Platform length (usable)
  group: Modes
  unit: m
  used_by: [new station defaults, platform-length compatibility check]
  values:
    - context:
        mode: "*"
      low: 30
      central: 120
      high: 400
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Wide fallback.
    - context:
        mode: [bus, trolleybus]
      low: 15
      central: 20
      high: 40
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: One 12 m bus plus approach, or two buses.
    - context:
        mode: brt
      low: 40
      central: 60
      high: 90
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Two to four 18 m articulated buses.
    - context:
        mode: intercity_bus
      low: 15
      central: 20
      high: 40
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: One coach bay.
    - context:
        mode: tram
      low: 30
      central: 45
      high: 75
      basis: documented
      sources: [bostrab]
      check: unverified
      rationale: BOStrab limits street-running train length (75 m); typical trams are 30–45 m. Clause to be checked.
    - context:
        mode: light_rail
      low: 60
      central: 90
      high: 120
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Two to four coupled LRVs.
    - context:
        mode: metro
      low: 80
      central: 120
      high: 210
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: "Examples: about 110 m (Berlin U-Bahn), 120 m (Munich U-Bahn), up to 200 m+ on large metros."
    - context:
        mode: commuter_rail
      low: 140
      central: 210
      high: 300
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: German S-Bahn standards are 140 m (Berlin) and 210 m (three 70 m units); some systems use longer.
    - context:
        mode: regional_rail
      low: 120
      central: 170
      high: 220
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Typical regional stations.
    - context:
        mode: [long_distance_rail, high_speed_rail]
      low: 300
      central: 400
      high: 420
      basis: documented
      sources: [tsi-inf]
      check: unverified
      rationale: 400 m accommodates a 2 × 200 m high-speed train; TSI INF leaves the length to the member state.

- key: mode.min_headway_s
  label: Following distance, minimum headway between vehicles on the same track or lane
  group: Modes
  unit: s
  used_by: [timetable conflict check, capacity]
  values:
    - context:
        mode: "*"
      low: 60
      central: 120
      high: 180
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Wide fallback.
    - context:
        mode: [bus, trolleybus]
      low: 30
      central: 60
      high: 90
      basis: documented
      sources: [tcqsm3]
      check: unverified
      rationale: Bus stop and lane capacity per TCQSM.
    - context:
        mode: brt
      low: 20
      central: 45
      high: 60
      basis: documented
      sources: [tcqsm3]
      check: unverified
      rationale: Multiple loading positions and passing lanes.
    - context:
        mode: intercity_bus
      low: 60
      central: 120
      high: 300
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Bay occupancy at terminals.
    - context:
        mode: tram
      low: 60
      central: 90
      high: 120
      basis: documented
      sources: [tcqsm3]
      check: unverified
      rationale: On-sight running, limited by stops and junctions.
    - context:
        mode: light_rail
      low: 90
      central: 120
      high: 180
      basis: documented
      sources: [tcqsm3]
      check: unverified
      rationale: Signalled sections.
    - context:
        mode: metro
      low: 75
      central: 90
      high: 120
      basis: documented
      sources: [tcqsm3]
      check: unverified
      rationale: CBTC lines reach 75–90 s; fixed block about 120 s.
    - context:
        mode: commuter_rail
      low: 90
      central: 120
      high: 180
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Core trunk sections (for example S-Bahn tunnels) reach about 120 s.
    - context:
        mode: regional_rail
      low: 120
      central: 180
      high: 240
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Conventional signalling.
    - context:
        mode: long_distance_rail
      low: 150
      central: 180
      high: 300
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Cab signalling 150–180 s.
    - context:
        mode: high_speed_rail
      low: 180
      central: 240
      high: 300
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: ETCS L2 / LZB at 300 km/h.

- key: mode.acceleration_ms2
  label: Acceleration (initial, at low speed)
  group: Modes
  unit: m/s²
  used_by: [running time, simulation when the vehicle file has no tractive effort curve]
  values:
    - context:
        mode: "*"
      low: 0.5
      central: 1.0
      high: 1.3
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Wide fallback.
    - context:
        mode: [bus, brt, trolleybus]
      low: 1.0
      central: 1.2
      high: 1.5
      basis: documented
      sources: [sumo-vtype]
      check: unverified
      rationale: Standing-passenger comfort keeps service acceleration at or below about 1.5 m/s²; SUMO's bus class uses about 1.2.
    - context:
        mode: intercity_bus
      low: 0.6
      central: 0.8
      high: 1.0
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Heavier, seated passengers.
    - context:
        mode: tram
      low: 1.0
      central: 1.2
      high: 1.4
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Typical LRV traction specification.
    - context:
        mode: [light_rail, metro]
      low: 0.9
      central: 1.1
      high: 1.3
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Typical specification.
    - context:
        mode: commuter_rail
      low: 0.7
      central: 0.9
      high: 1.1
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Suburban EMUs.
    - context:
        mode: regional_rail
      low: 0.5
      central: 0.8
      high: 1.0
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: EMU high, DMU/loco-hauled low.
    - context:
        mode: long_distance_rail
      low: 0.3
      central: 0.5
      high: 0.7
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Loco-hauled to EMU.
    - context:
        mode: high_speed_rail
      low: 0.3
      central: 0.4
      high: 0.6
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: High-speed EMUs.

- key: mode.service_braking_ms2
  label: Service braking deceleration
  group: Modes
  unit: m/s²
  used_by: [running time, simulation braking curves, signal overlap check]
  values:
    - context:
        mode: "*"
      low: 0.5
      central: 0.9
      high: 1.3
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Wide fallback.
    - context:
        mode: [bus, brt, trolleybus]
      low: 1.0
      central: 1.25
      high: 1.5
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Comfort limit for standing passengers.
    - context:
        mode: intercity_bus
      low: 0.8
      central: 1.0
      high: 1.5
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Comfort braking.
    - context:
        mode: tram
      low: 1.0
      central: 1.3
      high: 1.5
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Service braking; BOStrab §36 sets a separate, much higher emergency braking requirement (see mode.emergency_braking_ms2).
    - context:
        mode: [light_rail, metro]
      low: 0.9
      central: 1.1
      high: 1.3
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Typical specification.
    - context:
        mode: commuter_rail
      low: 0.7
      central: 0.9
      high: 1.1
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Typical specification.
    - context:
        mode: regional_rail
      low: 0.6
      central: 0.8
      high: 1.0
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Typical specification.
    - context:
        mode: long_distance_rail
      low: 0.5
      central: 0.7
      high: 0.9
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Typical specification.
    - context:
        mode: high_speed_rail
      low: 0.5
      central: 0.6
      high: 0.8
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Adhesion-limited at speed.

- key: mode.emergency_braking_ms2
  label: Emergency braking deceleration (mean)
  group: Modes
  unit: m/s²
  used_by: [on-sight stopping distance, safety checks]
  values:
    - context:
        mode: "*"
      low: 0.8
      central: 1.2
      high: 1.5
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Rail emergency braking without track brakes.
    - context:
        mode: [bus, brt, trolleybus, intercity_bus]
      low: 3.0
      central: 5.0
      high: 7.0
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Tyre-road adhesion; passenger safety, not the brake, is the practical limit.
    - context:
        mode: [tram, light_rail]
      low: 2.73
      central: 2.73
      high: 3.0
      basis: cited
      sources: [bostrab]
      check: unverified
      rationale: BOStrab §36 requires vehicles driving on sight to reach a mean emergency deceleration of 2.73 m/s² (magnetic track brakes). Figure to be checked against the clause.

- key: mode.new_track_gauge_mm
  label: Track gauge (new track and drawing of the rails)
  group: Modes
  unit: mm
  used_by: [new track default, rail drawing, gauge compatibility check]
  values:
    - context:
        mode: "*"
      low: 1000
      central: 1435
      high: 1668
      basis: documented
      sources: [tsi-inf]
      check: unverified
      rationale: "1435 mm standard gauge is the TSI default; common alternatives: 1000 (metre), 1067 (Cape), 1520/1524, 1600, 1668 (Iberian). Road modes ignore this value."
    - context:
        mode: [tram, light_rail]
      low: 1000
      central: 1435
      high: 1435
      basis: documented
      sources: [bostrab]
      check: unverified
      rationale: Many tram networks are metre gauge; new systems are mostly standard gauge.

- key: mode.new_track_electrification
  label: Electrification of new track or wire
  group: Modes
  unit: system
  kind: enum
  options:
    [
      none,
      ocl-600v-dc,
      ocl-750v-dc,
      ocl-1500v-dc,
      ocl-3000v-dc,
      ocl-15kv-16-7hz,
      ocl-25kv-50hz,
      trolley-600v-dc,
      trolley-750v-dc,
      third-rail-750v-dc,
      third-rail-1500v-dc,
      fourth-rail-630v-dc,
    ]
  used_by: [new track default, energy model, vehicle compatibility]
  values:
    - context:
        mode: "*"
      central: ocl-25kv-50hz
      basis: cited
      sources: [tsi-ene, en-50163]
      check: unverified
      rationale: "TSI ENE: 25 kV 50 Hz preferred for new mainline electrification; existing national systems may be kept."
    - context:
        mode: [bus, brt, intercity_bus]
      central: none
      basis: documented
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Road vehicles without wires.
    - context:
        mode: [tram, light_rail]
      low: ocl-600v-dc
      central: ocl-750v-dc
      high: ocl-750v-dc
      basis: cited
      sources: [en-50163]
      check: unverified
      rationale: EN 50163 nominal DC systems; 750 V DC overhead line for new tram systems, 600 V DC on older networks.
    - context:
        mode: trolleybus
      low: trolley-600v-dc
      central: trolley-750v-dc
      high: trolley-750v-dc
      basis: cited
      sources: [en-50163, en-50119]
      check: unverified
      rationale: Twin-wire trolleybus line; 750 V DC for new systems, 600 V DC on older networks.
    - context:
        mode: metro
      low: ocl-1500v-dc
      central: third-rail-750v-dc
      high: third-rail-1500v-dc
      basis: cited
      sources: [en-50163]
      check: unverified
      rationale: 750 V DC third rail is most common; 1500 V DC overhead line or shrouded 1500 V DC third rail on some systems.
    - context:
        mode: [commuter_rail, regional_rail, long_distance_rail]
      low: ocl-15kv-16-7hz
      central: ocl-25kv-50hz
      high: ocl-25kv-50hz
      basis: cited
      sources: [tsi-ene, en-50163]
      check: unverified
      rationale: Use the national system of the surrounding network (DE/AT/CH/SE/NO 15 kV 16.7 Hz; NL/FR-south 1500 V DC; BE/IT/PL/ES-conv. 3000 V DC).
    - context:
        mode: high_speed_rail
      central: ocl-25kv-50hz
      basis: cited
      sources: [tsi-ene]
      check: unverified
      rationale: TSI ENE for new high-speed lines.

- key: mode.crossing_priority_rank
  label: Crossing priority (lower rank goes first at an at-grade crossing)
  group: Modes
  unit: rank
  used_by: [junction control in co-simulation, transit signal priority defaults]
  values:
    - context:
        mode: "*"
      low: 1
      central: 5
      high: 9
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: General road traffic.
    - context:
        mode: [commuter_rail, regional_rail, long_distance_rail, high_speed_rail, metro]
      central: 1
      basis: cited
      sources: [vienna-convention-1968]
      check: unverified
      rationale: Railways have absolute priority at level crossings (Vienna Convention Art. 19).
    - context:
        mode: light_rail
      central: 2
      basis: documented
      sources: [vienna-convention-1968]
      check: unverified
      rationale: Treated like rail where crossings are protected; otherwise signal priority.
    - context:
        mode: tram
      central: 3
      basis: documented
      sources: [bostrab]
      check: unverified
      rationale: Tram signal priority at junctions is common practice; national road rules decide unsignalled cases.
    - context:
        mode: brt
      central: 3
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Signal priority on busways.
    - context:
        mode: [bus, trolleybus]
      central: 4
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Conditional signal priority.
    - context:
        mode: intercity_bus
      central: 5
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: No priority, like general traffic.
