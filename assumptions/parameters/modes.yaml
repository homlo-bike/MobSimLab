# Per-mode defaults (the "mode table" in Project Preferences → Parameters → Modes).
# Schema: see assumptions/README.md. Mode ids: bus, brt, trolleybus, intercity_bus,
# tram, light_rail, metro, commuter_rail, regional_rail, long_distance_rail,
# high_speed_rail. "*" is the global fallback required by ADR-0018.

- key: mode.min_curve_radius_m
  label: Curve radius, minimum
  group: Modes
  unit: m
  used_by: [alignment check (error below this), swept-path check, vehicle–infrastructure compatibility]
  values:
    - context:
        mode: "*"
      low: 12.5
      central: 25
      high: 300
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Wide fallback spanning road vehicles to mainline rail; every mode below has its own entry.
    - context:
        mode: [bus, brt, trolleybus, intercity_bus]
      low: 12.5
      central: 12.5
      high: 12.5
      basis: cited
      sources: [eu-dir-96-53]
      check: unverified
      rationale: "Directive 96/53/EC Annex I 1.5: a road vehicle must turn within a circle of 12.5 m outer radius (5.3 m inner). Used as the outer swept radius at walking pace, not as a running radius."
    - context:
        mode: tram
      low: 15
      central: 20
      high: 25
      basis: documented
      sources: [tud-tram-radius, bostrab]
      check: secondary
      rationale: Practice in German networks is about 20 to 30 m with extremes just under 12 m (seminar slides); BOStrab §17(3) only requires radii on segregated track to avoid speed restrictions. Depot tracks can go lower; vehicle file wins.
    - context:
        mode: light_rail
      low: 20
      central: 25
      high: 50
      basis: documented
      sources: [tud-tram-radius, bostrab-trr]
      check: unverified
      rationale: Light rail vehicles still run street sections, so the tram minimum applies at junctions; segregated sections use the recommended radius.
    - context:
        mode: metro
      low: 60
      central: 100
      high: 150
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Metro stock is typically specified for about 60 to 100 m on running lines (lower in depots). Wide range; take the vehicle file value when it exists.
    - context:
        mode: commuter_rail
      low: 150
      central: 300
      high: 600
      basis: documented
      sources: [en-13803, mobsimlab-derivation]
      check: unverified
      rationale: Derived from R = 11.8 v² / (D + I) with v = 120 km/h, D = 160 mm cant, I = 130 mm cant deficiency gives about 590 m for full line speed; 150–300 m is what mainline EMUs accept at reduced speed.
    - context:
        mode: regional_rail
      low: 300
      central: 600
      high: 1050
      basis: documented
      sources: [en-13803, mobsimlab-derivation]
      check: unverified
      rationale: "R = 11.8 v² / (D + I): v = 160 km/h, D = 160, I = 130 gives about 1040 m; lower values impose a local speed restriction."
    - context:
        mode: long_distance_rail
      low: 600
      central: 1050
      high: 1650
      basis: documented
      sources: [en-13803, mobsimlab-derivation]
      check: unverified
      rationale: "R = 11.8 v² / (D + I): v = 160 km/h → about 1040 m; v = 200 km/h → about 1630 m."
    - context:
        mode: high_speed_rail
      low: 2240
      central: 3220
      high: 4380
      basis: documented
      sources: [en-13803, eu-reco-2001-290, mobsimlab-derivation]
      check: unverified
      rationale: "R = 11.8 v² / (D + I) with D = 180 mm (2001/290/EC limit for new high-speed lines) and I = 150 mm: v = 250 km/h → about 2240 m (low), 300 km/h → about 3220 m (central), 350 km/h → about 4380 m (high)."

- key: mode.recommended_curve_radius_m
  label: Curve radius, recommended
  group: Modes
  unit: m
  used_by: [alignment check (warning below this)]
  values:
    - context:
        mode: "*"
      low: 25
      central: 100
      high: 1000
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Wide fallback; modes below have their own entries.
    - context:
        mode: [bus, trolleybus]
      low: 20
      central: 30
      high: 50
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Comfortable urban bus turning; trolleybus overhead wire curves favour larger radii.
    - context:
        mode: brt
      low: 30
      central: 50
      high: 100
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Busway running at about 50 km/h with standing passengers (0.65 m/s² lateral at 30 km/h needs about 100 m).
    - context:
        mode: intercity_bus
      low: 100
      central: 200
      high: 500
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Road design, not bus-specific; the road network sets the real limit.
    - context:
        mode: tram
      low: 25
      central: 50
      high: 100
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Larger radii reduce wheel squeal and wear; 50 m is a common planning target.
    - context:
        mode: light_rail
      low: 50
      central: 100
      high: 300
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Segregated light rail at 70–80 km/h.
    - context:
        mode: metro
      low: 200
      central: 300
      high: 500
      basis: documented
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: R = 11.8 v² / (D + I) with v = 80 km/h, D = 120 mm, I = 100 mm gives about 340 m for full speed.
    - context:
        mode: commuter_rail
      low: 500
      central: 600
      high: 1000
      basis: documented
      sources: [en-13803, mobsimlab-derivation]
      check: unverified
      rationale: Full 120 km/h without restriction (see minimum).
    - context:
        mode: regional_rail
      low: 1000
      central: 1500
      high: 2500
      basis: documented
      sources: [en-13803, mobsimlab-derivation]
      check: unverified
      rationale: 160 km/h with comfort margin (I = 100 mm instead of 130).
    - context:
        mode: long_distance_rail
      low: 1600
      central: 2500
      high: 4000
      basis: documented
      sources: [en-13803, mobsimlab-derivation]
      check: unverified
      rationale: 200 km/h with comfort margin.
    - context:
        mode: high_speed_rail
      low: 4000
      central: 7000
      high: 10000
      basis: documented
      sources: [en-13803, mobsimlab-derivation]
      check: unverified
      rationale: 300 km/h with low cant and deficiency for comfort and mixed speeds; 7000 m is common on 300 km/h lines.

- key: mode.max_speed_kmh
  label: Maximum speed
  group: Modes
  unit: km/h
  used_by: [running time, simulation speed limit when no line speed is set]
  values:
    - context:
        mode: "*"
      low: 50
      central: 80
      high: 160
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Wide fallback.
    - context:
        mode: bus
      low: 50
      central: 60
      high: 80
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Urban speed limits (50 km/h in most of Europe) bound service speed; the street's own limit wins.
    - context:
        mode: brt
      low: 60
      central: 70
      high: 90
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Segregated busway.
    - context:
        mode: trolleybus
      low: 50
      central: 60
      high: 70
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Overhead wire special work usually restricts speed.
    - context:
        mode: intercity_bus
      low: 80
      central: 100
      high: 100
      basis: cited
      sources: [eu-dir-92-6]
      check: unverified
      rationale: M3 vehicles in the EU must have a speed limiter set to 100 km/h.
    - context:
        mode: tram
      low: 50
      central: 60
      high: 80
      basis: documented
      sources: [bostrab]
      check: unverified
      rationale: Street running follows road limits; BOStrab permits higher speeds on segregated track. Clause to be checked.
    - context:
        mode: light_rail
      low: 70
      central: 80
      high: 100
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Typical LRV top speed.
    - context:
        mode: metro
      low: 70
      central: 80
      high: 100
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Typical metro top speed.
    - context:
        mode: commuter_rail
      low: 100
      central: 120
      high: 160
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: S-Bahn and suburban EMUs.
    - context:
        mode: regional_rail
      low: 120
      central: 160
      high: 200
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Regional EMUs/DMUs.
    - context:
        mode: long_distance_rail
      low: 160
      central: 200
      high: 250
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Conventional intercity.
    - context:
        mode: high_speed_rail
      low: 250
      central: 300
      high: 350
      basis: documented
      sources: [tsi-inf]
      check: unverified
      rationale: TSI INF high-speed line categories are built for at least 250 km/h; 300–320 km/h is the common design speed.

- key: mode.dwell_s
  label: Dwell time at a stop
  group: Modes
  unit: s
  used_by: [timetable generation, running time, simulation (when passenger flows are not modelled)]
  values:
    - context:
        mode: "*"
      low: 15
      central: 30
      high: 60
      basis: documented
      sources: [tcqsm3]
      check: unverified
      rationale: TCQSM gives about 30 s as a typical urban dwell and 60 s for busy stops.
    - context:
        mode: [bus, trolleybus]
      low: 15
      central: 30
      high: 60
      basis: documented
      sources: [tcqsm3]
      check: unverified
      rationale: TCQSM default bus dwell; on-board fare payment pushes towards the high end.
    - context:
        mode: brt
      low: 10
      central: 20
      high: 40
      basis: documented
      sources: [tcqsm3]
      check: unverified
      rationale: Off-board fare collection and all-door boarding shorten dwell.
    - context:
        mode: intercity_bus
      low: 60
      central: 180
      high: 600
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Luggage handling and ticket checks at intermediate stops.
    - context:
        mode: tram
      low: 15
      central: 25
      high: 45
      basis: documented
      sources: [tcqsm3]
      check: unverified
      rationale: Low-floor, multiple doors.
    - context:
        mode: [light_rail, metro]
      low: 20
      central: 30
      high: 45
      basis: documented
      sources: [tcqsm3]
      check: unverified
      rationale: TCQSM rail dwell; central stations reach the high end.
    - context:
        mode: commuter_rail
      low: 30
      central: 45
      high: 60
      basis: documented
      sources: [tcqsm3]
      check: unverified
      rationale: Fewer doors per metre than metro.
    - context:
        mode: regional_rail
      low: 30
      central: 60
      high: 120
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Single-leaf doors, luggage.
    - context:
        mode: long_distance_rail
      low: 60
      central: 120
      high: 300
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Reserved seating and luggage.
    - context:
        mode: high_speed_rail
      low: 60
      central: 120
      high: 240
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: As long distance.

- key: mode.spare_share
  label: Spare vehicles, share of the vehicles in peak service (fleet)
  group: Modes
  unit: share
  used_by: [fleet sizing, depot capacity check, cost model]
  values:
    - context:
        mode: "*"
      low: 0.1
      central: 0.15
      high: 0.2
      basis: cited
      sources: [fta-c9030, tcrp-spare-ratio]
      check: secondary
      rationale: FTA expects spares at or below 20 % of vehicles in maximum service for fleets of 50 or more; 15 % is the project default already named in FR-PLAT-05.
    - context:
        mode: [bus, brt, trolleybus, intercity_bus]
      low: 0.1
      central: 0.15
      high: 0.2
      basis: cited
      sources: [fta-c9030, tcrp-spare-ratio]
      check: secondary
      rationale: FTA 20 % ceiling for bus fleets of 50 or more; smaller fleets need judgement and often run higher.
    - context:
        mode: [tram, light_rail]
      low: 0.1
      central: 0.15
      high: 0.2
      basis: documented
      sources: [fta-c9030]
      check: unverified
      rationale: FTA applies the 20 % guideline to rail as a reference point; light rail fleets are small, so the ceiling is common.
    - context:
        mode: [metro, commuter_rail, regional_rail]
      low: 0.08
      central: 0.12
      high: 0.18
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Larger rail fleets with planned maintenance windows usually run below the bus ratio.
    - context:
        mode: [long_distance_rail, high_speed_rail]
      low: 0.08
      central: 0.1
      high: 0.15
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: High utilisation fleets with night maintenance.

- key: mode.standing_density_ppm2
  label: Standing places, passengers per square metre of standing area
  group: Modes
  unit: persons/m²
  used_by: [vehicle capacity, crowding, passenger assignment]
  values:
    - context:
        mode: "*"
      low: 2
      central: 4
      high: 6
      basis: documented
      sources: [en-15663, tcqsm3]
      check: unverified
      rationale: 4 persons/m² is the common planning load for urban services; 6 is crush.
    - context:
        mode: [bus, brt, trolleybus]
      low: 3
      central: 4
      high: 8
      basis: cited
      sources: [unece-r107, tcqsm3]
      check: unverified
      rationale: UN R107 allows 0.125 m² per standing passenger in Class I buses (8/m², legal maximum); planning uses about 4/m².
    - context:
        mode: intercity_bus
      low: 0
      central: 0
      high: 0
      basis: cited
      sources: [unece-r107]
      check: unverified
      rationale: Class III coaches carry no standing passengers.
    - context:
        mode: [tram, light_rail, metro, commuter_rail]
      low: 3
      central: 4
      high: 6
      basis: documented
      sources: [en-15663, tcqsm3]
      check: unverified
      rationale: EN 15663 reference loads for urban/suburban service; 6/m² as crush.
    - context:
        mode: regional_rail
      low: 1
      central: 2
      high: 4
      basis: documented
      sources: [en-15663]
      check: unverified
      rationale: Mostly seated.
    - context:
        mode: [long_distance_rail, high_speed_rail]
      low: 0
      central: 0
      high: 2
      basis: documented
      sources: [en-15663]
      check: unverified
      rationale: Reserved seating; standing only in exceptional loads.

