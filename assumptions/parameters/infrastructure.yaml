# Infrastructure standards and drawing defaults. Schema: assumptions/README.md.
# Per-mode platform length, platform height, curve radii and track gauge are in modes.yaml.

- key: track.centre_distance_m
  label: Track centre distance (double track, open line)
  group: Infrastructure standards
  unit: m
  used_by: [drawing of new double track, clearance check]
  values:
    - context:
        mode: "*"
      low: 3.5
      central: 4.0
      high: 4.5
      basis: cited
      sources: [trackopedia-track-centres, ebo, tsi-inf]
      check: secondary
      rationale: "German practice: 4.00 m on upgraded lines up to 230 km/h, 4.50 m on new lines up to 300 km/h, 3.50 m absolute minimum (EBO §10)."
    - context:
        mode: tram
      low: 2.8
      central: 3.0
      high: 3.6
      basis: documented
      sources: [bostrab, mobsimlab-derivation]
      check: unverified
      rationale: Vehicle width 2.40–2.65 m plus kinematic sway and a safety gap of about 0.3 m; 3.60 m or more with centre poles.
    - context:
        mode: light_rail
      low: 3.0
      central: 3.2
      high: 3.8
      basis: documented
      sources: [bostrab, mobsimlab-derivation]
      check: unverified
      rationale: Wider and faster vehicles than tram; centre poles push to the high end.
    - context:
        mode: metro
      low: 3.2
      central: 3.6
      high: 4.0
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Car body 2.65–3.10 m plus sway and clearance; tunnel type dominates (twin bores are far apart).
    - context:
        mode: [commuter_rail, regional_rail, long_distance_rail]
      low: 3.5
      central: 4.0
      high: 4.5
      basis: cited
      sources: [trackopedia-track-centres, ebo]
      check: secondary
      rationale: As global.
    - context:
        mode: high_speed_rail
      low: 4.0
      central: 4.5
      high: 5.0
      basis: cited
      sources: [trackopedia-track-centres, tsi-inf]
      check: secondary
      rationale: 4.50 m on new lines up to 300 km/h; TSI INF sets a speed-dependent minimum (clause to be checked).

- key: track.clearance_marker_centre_distance_m
  label: Track centre distance at the clearance marker of converging tracks (where a waiting train must stand clear)
  group: Infrastructure standards
  unit: m
  used_by: [fouling point placement, usable track length]
  values:
    - context:
        mode: "*"
      low: 3.0
      central: 3.5
      high: 3.5
      basis: documented
      sources: [ebo, trackopedia-track-centres]
      check: unverified
      rationale: German clearance markers (Grenzzeichen) stand where converging tracks are 3.50 m apart, matching the minimum track centre distance.
    - context:
        mode: [tram, light_rail]
      low: 2.7
      central: 3.0
      high: 3.2
      basis: documented
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Vehicle width plus sway, as for tram track centre distance.
    - context:
        mode: metro
      low: 3.0
      central: 3.2
      high: 3.5
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Between tram and mainline.

- key: station.track_suggest_distance_m
  label: Distance for suggesting tracks at a station
  group: Infrastructure standards
  unit: m
  used_by: [editor, offering existing tracks when a stop or platform is placed]
  values:
    - context:
        mode: "*"
      low: 25
      central: 50
      high: 150
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Editor tolerance, not an engineering value; wide enough to cover a station throat, small enough to avoid unrelated tracks.

- key: platform.side_width_m
  label: Side platform width
  group: Infrastructure standards
  unit: m
  used_by: [new platform default, crowding capacity]
  values:
    - context:
        mode: "*"
      low: 2.5
      central: 3.5
      high: 5.0
      basis: documented
      sources: [tsi-prm, mobsimlab-derivation]
      check: unverified
      rationale: TSI PRM requires an obstacle-free width of at least 1.60 m beyond the danger area; with a danger area of about 1.0 m and street furniture this gives about 3.5 m.
    - context:
        mode: [bus, trolleybus, tram]
      low: 2.0
      central: 2.5
      high: 3.5
      basis: documented
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: "Street stops: 1.50 m wheelchair turning plus ramp deployment area (about 2.5 m)."

- key: platform.island_width_m
  label: Island platform width
  group: Infrastructure standards
  unit: m
  used_by: [new platform default, crowding capacity]
  values:
    - context:
        mode: "*"
      low: 5.5
      central: 7.0
      high: 10.0
      basis: documented
      sources: [tsi-prm, mobsimlab-derivation]
      check: unverified
      rationale: Two danger areas plus obstacle-free width and room for stairs or lifts in the middle.
    - context:
        mode: [bus, trolleybus, tram]
      low: 3.0
      central: 4.0
      high: 5.0
      basis: documented
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Shared street island stop with ramp deployment on both sides.

- key: crossing.clearance_m
  label: Clearance before and after a crossing
  group: Infrastructure standards
  unit: m
  used_by: [stop line placement, keep-clear zones in simulation]
  values:
    - context:
        mode: "*"
      low: 2
      central: 5
      high: 10
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Distance from the conflict area to the stop line so a waiting vehicle does not foul the crossing; local road rules decide.

- key: curve.cant_tram_mm
  label: "Curve speed: cant (superelevation) of tram and light rail curves"
  group: Infrastructure standards
  unit: mm
  used_by: [curve speed v = sqrt((D + I) R / 11.8)]
  values:
    - context:
        mode: "*"
      low: 0
      central: 60
      high: 150
      basis: documented
      sources: [bostrab-trr, mobsimlab-derivation]
      check: unverified
      rationale: Street-running track flush with the road has no cant; segregated tram and light rail track typically up to about 100–150 mm (BOStrab-TrR, figure to be checked).

- key: curve.cant_deficiency_tram_mm
  label: "Curve speed: permitted cant deficiency of tram and light rail curves"
  group: Infrastructure standards
  unit: mm
  used_by: [curve speed]
  values:
    - context:
        mode: "*"
      low: 70
      central: 100
      high: 150
      basis: documented
      sources: [bostrab-trr, mobsimlab-derivation]
      check: unverified
      rationale: "I = a · s / g with s ≈ 1500 mm: 0.65 m/s² unbalanced lateral acceleration (comfort with standing passengers) gives about 100 mm; 1.0 m/s² gives about 150 mm."

- key: curve.cant_rail_mm
  label: "Curve speed: cant (superelevation) of metro and railway curves"
  group: Infrastructure standards
  unit: mm
  used_by: [curve speed]
  values:
    - context:
        mode: "*"
      low: 100
      central: 160
      high: 180
      basis: cited
      sources: [en-13803, ebo, eu-reco-2001-290]
      check: secondary
      rationale: 2001/290/EC limits design cant on new high-speed lines to 180 mm (seen in source); EN 13803 and EBO §6 give 160 mm as the usual limit on ballasted track and 180 mm as the maximum (to be checked).
    - context:
        mode: metro
      low: 60
      central: 100
      high: 150
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Lower line speeds need less cant; trains stop in curves at stations.

- key: curve.cant_deficiency_rail_mm
  label: "Curve speed: permitted cant deficiency of metro and railway curves"
  group: Infrastructure standards
  unit: mm
  used_by: [curve speed]
  values:
    - context:
        mode: "*"
      low: 100
      central: 130
      high: 150
      basis: cited
      sources: [en-13803, ebo]
      check: unverified
      rationale: "EN 13803 and EBO §6: 130 mm normal and 150 mm with conditions for conventional stock; tilting trains are higher. Clause to be checked."
    - context:
        mode: metro
      low: 70
      central: 100
      high: 130
      basis: documented
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: 0.65 m/s² comfort limit for standing passengers gives about 100 mm.

- key: structure.outline_width_m
  label: "Bridge and tunnel outline: width beyond the rails on each side (drawing)"
  group: Infrastructure standards
  unit: m
  used_by: [drawing of bridges and tunnels]
  values:
    - context:
        mode: "*"
      low: 1.0
      central: 1.5
      high: 2.5
      basis: educated-guess
      sources: [en-15273, mobsimlab-derivation]
      check: unverified
      rationale: "Drawing value: structure gauge half-width (about 1.6–2.0 m from track centre for mainline, EN 15273) minus half the gauge, plus a walkway."
    - context:
        mode: [tram, light_rail]
      low: 0.8
      central: 1.2
      high: 1.5
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Narrower vehicles.
    - context:
        mode: [long_distance_rail, high_speed_rail]
      low: 1.5
      central: 2.2
      high: 3.0
      basis: educated-guess
      sources: [en-15273, mobsimlab-derivation]
      check: unverified
      rationale: Larger gauge and cable troughs, escape walkway.

- key: structure.underground_level_depth_m
  label: Depth of track per underground level, below the street (ramps)
  group: Infrastructure standards
  unit: m
  used_by: [ramp length and portal placement]
  values:
    - context:
        mode: "*"
      low: 6
      central: 8
      high: 12
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: "Cut-and-cover box: about 1–2 m cover for utilities, 4.5–6 m internal height, slab; deeper for mainline overhead line."

- key: structure.elevated_level_height_m
  label: Height of track per elevated level, above the street (ramps)
  group: Infrastructure standards
  unit: m
  used_by: [ramp length and viaduct drawing]
  values:
    - context:
        mode: "*"
      low: 6
      central: 7
      high: 9
      basis: documented
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Road clearance of about 4.5–5.0 m (national road standards) plus 1.5–2.0 m deck depth.

- key: platform.max_gradient_pct
  label: Steepest gradient of track at a station platform, tram, light rail and metro
  group: Infrastructure standards
  unit: "%"
  used_by: [station placement check]
  values:
    - context:
        mode: "*"
      low: 0
      central: 0.25
      high: 0.5
      basis: cited
      sources: [ebo, tsi-inf]
      check: unverified
      rationale: EBO §7 and TSI INF limit station tracks where vehicles are stabled to 2.5 mm/m (0.25 %) so that vehicles do not roll away. Clause to be checked.
    - context:
        mode: [tram, light_rail]
      low: 0.25
      central: 2.0
      high: 4.0
      basis: educated-guess
      sources: [bostrab-trr, mobsimlab-derivation]
      check: unverified
      rationale: Street stops follow the road profile; steep stops make wheelchair boarding and ramps harder. BOStrab-TrR values to be checked.
    - context:
        mode: metro
      low: 0
      central: 0.25
      high: 0.5
      basis: documented
      sources: [ebo]
      check: unverified
      rationale: As mainline practice.

- key: stop.reuse_distance_m
  label: Distance within which a new stop or station reuses an existing one
  group: Infrastructure standards
  unit: m
  used_by: [editor and import, merging stops]
  values:
    - context:
        mode: "*"
      low: 30
      central: 75
      high: 150
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Editor tolerance. Smaller than typical stop spacing (300–500 m for bus) and larger than the size of a stop area.

- key: switch.cant_deficiency_mm
  label: "Turnouts: permitted cant deficiency in the diverging track"
  group: Infrastructure standards
  unit: mm
  used_by: [diverging speed of a turnout radius, v = sqrt(I R / 11.8), switch catalogue checks]
  values:
    - context:
        mode: "*"
      low: 90
      central: 100
      high: 120
      basis: documented
      sources: [dewiki-weiche, en-13803]
      check: secondary
      rationale: "The DB standard turnout speeds (R 190 m 40 km/h, 300 m 50, 760 m 80, 1200 m 100) all equal sqrt(100 · R / 11.8) rounded down, so the diverging track runs with about 100 mm cant deficiency and no cant. EN 13803 allows more with conditions (clause to be checked)."
    - context:
        mode: metro
      low: 70
      central: 76
      high: 100
      basis: cited
      sources: [gb-50157]
      check: secondary
      rationale: "GB 50157 commentary: 0.5 m/s² unbalanced lateral acceleration in metro turnouts (R 200 m gives 36 km/h); 0.5 · 1500 / 9.81 = 76 mm."
    - context:
        mode: [tram, light_rail]
      low: 70
      central: 100
      high: 150
      basis: documented
      sources: [krakow-tram-switches, mobsimlab-derivation]
      check: unverified
      rationale: As curve.cant_deficiency_tram_mm. The Kraków limit of 25 km/h for R 50 m deep-groove switches corresponds to about 150 mm, the upper end.

- key: switch.default_turnout
  label: "Turnouts: default catalogue turnout offered when connecting tracks"
  group: Infrastructure standards
  unit: id
  kind: enum
  options:
    - tram-r25
    - tram-r50
    - tram-r100
    - db-ew-190-1-9
    - db-ew-300-1-9
    - db-ew-500-1-12
    - db-ew-760-1-14
    - db-ew-1200-1-18.5
    - db-ew-2500-1-26.5-fb
    - cn-metro-60-no9
    - arema-no10
  used_by: [railway design tool, connection between tracks]
  values:
    - context:
        mode: "*"
      central: db-ew-300-1-9
      basis: educated-guess
      sources: [dewiki-weiche, mobsimlab-derivation]
      check: unverified
      rationale: 50 km/h diverging in 33 m is the usual compromise for station and junction connections on conventional lines. The planner picks any element of switches.yaml; this is only the first offer.
    - context:
        mode: tram
      central: tram-r50
      basis: educated-guess
      sources: [nortrak-transit, mobsimlab-derivation]
      check: unverified
      rationale: 50 m is the common street junction radius; 25 m for depots and loops, 100 m on segregated track.
    - context:
        mode: light_rail
      central: tram-r100
      basis: educated-guess
      sources: [nortrak-transit, mobsimlab-derivation]
      check: unverified
      rationale: Faster segregated running; street sections can switch to tram-r50.
    - context:
        mode: metro
      central: db-ew-190-1-9
      basis: educated-guess
      sources: [gb-50157, mobsimlab-derivation]
      check: unverified
      rationale: 1:9 turnouts with R 190–200 m and 35–40 km/h diverging are the metro norm (GB 50157 No. 9 is the Chinese equivalent, cn-metro-60-no9).
    - context:
        mode: [long_distance_rail]
      central: db-ew-500-1-12
      basis: educated-guess
      sources: [hanser-weichen, mobsimlab-derivation]
      check: unverified
      rationale: 60 km/h diverging for passing loops and station throats on intercity lines.
    - context:
        mode: high_speed_rail
      central: db-ew-1200-1-18.5
      basis: educated-guess
      sources: [dewiki-weiche, mobsimlab-derivation]
      check: unverified
      rationale: 100 km/h diverging into station and overtaking tracks; junctions between lines use 1:26.5 or flatter.

- key: curve.vertical_radius_m
  label: Vertical curve radius at a change of gradient, minimum
  group: Infrastructure standards
  unit: m
  used_by: [ramp length between levels]
  values:
    - context:
        mode: "*"
      low: 500
      central: 2000
      high: 40000
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Wide fallback; every rail mode below has its own entry.
    - context:
        mode: tram
      low: 300
      central: 500
      high: 1000
      basis: documented
      sources: [bostrab-trr, mobsimlab-derivation]
      check: unverified
      rationale: Street-running trams follow the road profile; a few hundred metres is common at crests and sags (figure to be checked against BOStrab-TrR).
    - context:
        mode: light_rail
      low: 500
      central: 1000
      high: 2000
      basis: documented
      sources: [bostrab-trr, mobsimlab-derivation]
      check: unverified
      rationale: Higher speeds than tram; 1000 m keeps vertical acceleration below about 0.5 m/s² at 80 km/h.
    - context:
        mode: metro
      low: 1600
      central: 2000
      high: 5000
      basis: documented
      sources: [en-13803, mobsimlab-derivation]
      check: unverified
      rationale: "Rule of thumb from mainline practice: at least 0.25 · V² (V in km/h), so 1600 m at 80 km/h, rounded up to 2000 m."
    - context:
        mode: commuter_rail
      low: 3600
      central: 6000
      high: 10000
      basis: documented
      sources: [en-13803, mobsimlab-derivation]
      check: unverified
      rationale: "0.4 · V² (V = 120 km/h) is about 5800 m; 0.25 · V² gives the minimum 3600 m."
    - context:
        mode: regional_rail
      low: 6400
      central: 10000
      high: 15000
      basis: documented
      sources: [en-13803, mobsimlab-derivation]
      check: unverified
      rationale: "0.4 · V² at 160 km/h is about 10,000 m; 0.25 · V² gives the minimum 6400 m."
    - context:
        mode: long_distance_rail
      low: 10000
      central: 16000
      high: 25000
      basis: documented
      sources: [en-13803, mobsimlab-derivation]
      check: unverified
      rationale: "0.4 · V² at 200 km/h is 16,000 m; 0.25 · V² gives the minimum 10,000 m."
    - context:
        mode: high_speed_rail
      low: 22500
      central: 36000
      high: 50000
      basis: documented
      sources: [en-13803, tsi-inf, mobsimlab-derivation]
      check: unverified
      rationale: "0.4 · V² at 300 km/h is 36,000 m; 0.25 · V² gives the minimum 22,500 m."

- key: curve.cant_change_rate_mm_s
  label: "Transition curve: rate of change of cant, maximum"
  group: Infrastructure standards
  unit: mm/s
  used_by: [transition curve length]
  values:
    - context:
        mode: "*"
      low: 35
      central: 50
      high: 60
      basis: cited
      sources: [en-13803]
      check: unverified
      rationale: EN 13803 recommends about 50 mm/s for the rate of change of cant along a transition, with higher maximum values (clause to be checked). Length = speed · cant / rate.

- key: curve.cant_deficiency_change_rate_mm_s
  label: "Transition curve: rate of change of cant deficiency, maximum"
  group: Infrastructure standards
  unit: mm/s
  used_by: [transition curve length]
  values:
    - context:
        mode: "*"
      low: 40
      central: 55
      high: 70
      basis: cited
      sources: [en-13803]
      check: unverified
      rationale: EN 13803 recommends about 55 mm/s for the rate of change of cant deficiency (clause to be checked). Length = speed · cant deficiency / rate.

- key: curve.max_cant_gradient_mm_m
  label: "Transition curve: cant gradient along the track, maximum"
  group: Infrastructure standards
  unit: mm/m
  used_by: [transition curve length]
  values:
    - context:
        mode: "*"
      low: 1.0
      central: 2.25
      high: 2.5
      basis: cited
      sources: [en-13803]
      check: unverified
      rationale: About 1:450 recommended and 1:400 as a limit on ballasted track (EN 13803, to be checked). Length = cant / gradient.
    - context:
        mode: [tram, light_rail]
      low: 2.25
      central: 3.33
      high: 4.0
      basis: documented
      sources: [bostrab-trr, mobsimlab-derivation]
      check: unverified
      rationale: Slower vehicles allow a steeper cant ramp, about 1:300 (BOStrab-TrR, figure to be checked).

- key: platform.edge_offset_m
  label: Distance from track centre to the platform edge
  group: Infrastructure standards
  unit: m
  used_by: [station layout drawing, platform gap]
  values:
    - context:
        mode: "*"
      low: 1.6
      central: 1.65
      high: 1.7
      basis: cited
      sources: [tsi-prm, en-15273]
      check: unverified
      rationale: "TSI PRM and EN 15273-3 give bq0 = 1650 mm on straight track for 550 mm and 760 mm platforms on 1435 mm gauge (to be checked); curves add the gauge widening."
    - context:
        mode: [tram, light_rail]
      low: 1.25
      central: 1.35
      high: 1.45
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: "Half the vehicle width (2.40–2.65 m) plus a horizontal gap of about 50 mm for level boarding."
    - context:
        mode: metro
      low: 1.45
      central: 1.55
      high: 1.65
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: "Half the car body width (2.80–3.10 m) plus a gap of about 75 mm (access.level_gap_horizontal_mm)."

- key: station.track_beyond_platform_m
  label: Station track beyond each platform end, up to the station's connection point
  group: Infrastructure standards
  unit: m
  used_by: [station layout drawing, overrun at termini]
  values:
    - context:
        mode: "*"
      low: 10
      central: 40
      high: 100
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Room for the platform-end ramps, the starter signal and its overlap or a buffer-stop overrun; the line's track spacing is reached outside the station.
    - context:
        mode: tram
      low: 5
      central: 12
      high: 20
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Trams run on sight; a few metres past the stop is enough.
    - context:
        mode: light_rail
      low: 10
      central: 18
      high: 30
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Between tram and metro.
    - context:
        mode: metro
      low: 15
      central: 25
      high: 50
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Starter signal and a short overlap at the platform end.
    - context:
        mode: [long_distance_rail, high_speed_rail]
      low: 40
      central: 70
      high: 150
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Longer overlaps and wider platform track spacing to bring back to the line spacing.

- key: ocl.span_m
  label: Overhead line span (mast spacing) on straight track
  group: Infrastructure standards
  unit: m
  used_by: [overhead line drawing, mast count]
  values:
    - context:
        mode: "*"
      low: 50
      central: 63
      high: 80
      basis: documented
      sources: [en-50119, mobsimlab-derivation]
      check: unverified
      rationale: Mainline catenary spans are typically 60–65 m on straight track and shorter in curves; EN 50119 sets the design rules, not a fixed span.
    - context:
        mode: [tram, light_rail]
      low: 25
      central: 35
      high: 45
      basis: documented
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Tram trolley wire without a catenary sags more, so spans of about 30–40 m are usual.
    - context:
        mode: metro
      low: 40
      central: 50
      high: 60
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Between tram and mainline; only used where a metro is built with overhead line instead of third rail.

- key: level_crossing.permitted
  label: "Level crossings with streets: usual for the mode (otherwise a warning asks for special safety measures)"
  group: Infrastructure standards
  unit: yes/no
  kind: enum
  options: ["yes", "no"]
  used_by: [railway design check of street-level track crossing a street]
  values:
    - context:
        mode: "*"
      central: "yes"
      basis: cited
      sources: [vuchic-2007, ebo]
      check: unverified
      rationale: Trams cross streets at traffic signals; light rail and mainline rail may keep level crossings (right-of-way category B). The line speed limit (level_crossing.max_line_speed_kmh) applies as well.
    - context:
        mode: [metro, high_speed_rail]
      central: "no"
      basis: cited
      sources: [vuchic-2007, ebo]
      check: unverified
      rationale: Metro is fully separated by definition (right-of-way category A, usually with a live third rail). High-speed lines run above the speed up to which level crossings are allowed (EBO § 11(2)).

- key: level_crossing.max_line_speed_kmh
  label: "Level crossings: highest usual line speed over a level crossing (above it, a warning asks for special safety measures)"
  group: Infrastructure standards
  unit: km/h
  used_by: [railway design check of street-level track crossing a street]
  values:
    - context:
        mode: "*"
      low: 140
      central: 160
      high: 200
      basis: cited
      sources: [ebo]
      check: unverified
      rationale: EBO § 11(2) does not allow level crossings on lines with a permitted speed above 160 km/h. Other countries set similar limits; the project country decides.

- key: level_crossing.min_angle_deg
  label: "Level crossings: smallest angle between track and street"
  group: Infrastructure standards
  unit: degrees
  used_by:
    [railway design check of street-level track crossing a street, telling street running from a crossing]
  values:
    - context:
        mode: "*"
      low: 30
      central: 45
      high: 70
      basis: educated-guess
      sources: [aashto-green-book, mobsimlab-derivation]
      check: unverified
      rationale: Road guidance asks for crossings as near to a right angle as possible, because a skewed crossing is longer, keeps road vehicles on the track for longer and makes it hard for drivers to look along the line. A warning below 45° is a maintainers' choice to be confirmed. For street-running trams, a track meeting a street at a flatter angle is taken as running along the street, not crossing it.

- key: level_crossing.warning_time_s
  label: "Level crossings: warning time before a train reaches the crossing"
  group: Infrastructure standards
  unit: s
  used_by:
    [approach distance in the track topology (start of the crossing's warning), road closure in simulation]
  values:
    - context:
        mode: "*"
      low: 20
      central: 25
      high: 40
      basis: cited
      sources: [us-49cfr234]
      check: unverified
      rationale: 49 CFR 234.225 requires at least 20 s of warning; railways usually add a few seconds for barriers to come down, so the central value is 25 s. Countries set their own times.
    - context:
        mode: [tram, light_rail]
      low: 10
      central: 15
      high: 25
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: Trams crossing at traffic signals request priority one signal cycle step ahead (amber plus clearance time of the conflicting traffic), about 10–20 s. To be confirmed against local signal timing.

- key: level_crossing.barrier_closing_s
  label: "Level crossings with barriers: time from triggering until the crossing is proved closed"
  group: Infrastructure standards
  unit: s
  used_by: [interlocking, road closure in simulation]
  values:
    - context:
        mode: "*"
      low: 10
      central: 15
      high: 25
      basis: educated-guess
      sources: [ebo, mobsimlab-derivation]
      check: unverified
      rationale: "Road lights show a few seconds before the barriers start to lower; lowering takes about 6–10 s; the crossing is then proved closed."

- key: level_crossing.signal_closing_s
  label: "Level crossings with road traffic signals only: time from triggering until closed"
  group: Infrastructure standards
  unit: s
  used_by: [interlocking, road closure in simulation]
  values:
    - context:
        mode: "*"
      low: 6
      central: 10
      high: 15
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: "Amber then red for road traffic, with a clearing time for vehicles already on the crossing."

- key: level_crossing.reopen_s
  label: "Level crossings: time from the train clearing the crossing until road traffic may go again"
  group: Infrastructure standards
  unit: s
  used_by:
    [
      road closure per train in the track topology,
      expected wait of buses at level crossings in street line running times,
    ]
  values:
    - context:
        mode: "*"
      low: 6
      central: 10
      high: 12
      basis: cited
      sources: [mutcd-2009-part8]
      check: unverified
      rationale: "MUTCD 2009 § 8C.04: gate arms rise to upright in not more than 12 s once the train has cleared and no other train is detected; the lights stop when the arms are up. Barriers rising in about 6–10 s are usual elsewhere. The central value is between the two."
    - context:
        mode: [tram, light_rail]
      low: 3
      central: 5
      high: 8
      basis: educated-guess
      sources: [hcm7, mobsimlab-derivation]
      check: unverified
      rationale: Trams in the street cross at traffic signals, so road traffic waits only for the intergreen after the tram has cleared (clearance of the tram's conflict area plus the start of the road green), usually a few seconds. To be confirmed against local signal timing.
