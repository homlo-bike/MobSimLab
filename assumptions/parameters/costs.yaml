# Construction and operating cost unit values (09-planning-models §3, ADR-0039). Schema: assumptions/README.md.
#
# Prices are 2023 international dollars at purchasing power parity (the Transit Costs Project basis),
# except vehicles, which are traded internationally and are in 2023 US dollars at market exchange rates.
# The cost tables convert both to the project's country and the latest year with World Bank indicators
# (PPP conversion factor, exchange rate, US GDP deflator).
# Construction values are before design, management and contingency, which are added as shares.

- key: cost.civil.at_grade_per_km
  label: Civil works at street level or on its own formation, double track
  group: Cost
  unit: US$ million per route-km (2023, PPP)
  used_by:
    - "construction cost: civil works"
  values:
    - context:
        mode: "*"
      low: 3
      central: 7
      high: 15
      basis: educated-guess
      sources:
        - mobsimlab-derivation
        - transit-costs-project
      check: unverified
      rationale:
        Earthworks, drainage, minor structures and utility diversions for a segregated double track at grade.
        Transit Costs Project data show at-grade lines cost a fraction of tunnelled ones.
    - context:
        mode: tram
      low: 5
      central: 11
      high: 20
      basis: documented
      sources:
        - railwaypro-besancon
        - bathtrams-uk-costs
        - mobsimlab-derivation
      check: secondary
      rationale:
        Street reconstruction kerb to kerb and utility diversions. French tram lines average about €25–30
        million per km all in (Besançon €17.5 million); about a third of that is street works, converted at about
        0.73 € per international $ (2023).
    - context:
        mode: light_rail
      low: 4
      central: 9
      high: 18
      basis: documented
      sources:
        - railwaypro-besancon
        - mobsimlab-derivation
      check: unverified
      rationale: As tram with more own right of way and less street reconstruction.
    - context:
        mode: metro
      low: 5
      central: 10
      high: 20
      basis: educated-guess
      sources:
        - mobsimlab-derivation
        - transit-costs-project
      check: unverified
      rationale: Fully segregated formation with fencing and grade separation of every road; rare at grade.
    - context:
        mode: high_speed_rail
      low: 6
      central: 12
      high: 22
      basis: documented
      sources:
        - worldbank-china-hsr
        - uic-hsr-cost
        - mobsimlab-derivation
      check: secondary
      rationale:
        Earthworks of a 300–350 km/h formation. The World Bank puts Chinese HSR at about US$ 17–21 million
        per km all in and European lines at US$ 25–39 million per km; UIC reports about €45.5 million per km on average
        including structures.

- key: cost.civil.elevated_per_km
  label: Elevated guideway on columns, double track
  group: Cost
  unit: US$ million per route-km (2023, PPP)
  used_by:
    - "construction cost: civil works"
  values:
    - context:
        mode: "*"
      low: 20
      central: 40
      high: 80
      basis: documented
      sources:
        - fta-relative-costs
        - transit-costs-project
        - mobsimlab-derivation
      check: unverified
      rationale:
        "FTA comparison quoted by the City of Toronto: underground costs about twice elevated and four times
        surface per km. Taken as about half the cut and cover value."

- key: cost.civil.viaduct_per_km
  label: Viaduct (long multi-span structure), double track
  group: Cost
  unit: US$ million per route-km (2023, PPP)
  used_by:
    - "construction cost: civil works"
  values:
    - context:
        mode: "*"
      low: 12
      central: 30
      high: 70
      basis: documented
      sources:
        - worldbank-china-hsr
        - mobsimlab-derivation
      check: secondary
      rationale:
        "World Bank: Chinese double-track HSR viaducts cost about RMB 57–73 million per km (US$ 9–12 million,
        2014 prices); European and North American costs are two to five times higher."

- key: cost.civil.bridge_per_km
  label: Bridge over a river, road or railway, double track
  group: Cost
  unit: US$ million per route-km (2023, PPP)
  used_by:
    - "construction cost: civil works"
  values:
    - context:
        mode: "*"
      low: 30
      central: 70
      high: 160
      basis: educated-guess
      sources:
        - worldbank-china-hsr
        - mobsimlab-derivation
      check: unverified
      rationale:
        Longer spans and deeper foundations than a viaduct; about two to three times the viaduct cost per
        metre of deck.

- key: cost.civil.ramp_per_km
