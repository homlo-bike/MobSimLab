        "Tunnel boring, segments, cross passages and shafts, without stations. Transit Costs Project: tunnel
        depth and method are among the largest cost drivers; high values for poor ground or dense cities."
    - context:
        mode: high_speed_rail
      low: 25
      central: 50
      high: 120
