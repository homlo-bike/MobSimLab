# Source register for the assumption library (ADR-0018).
#
# Every `sources:` id used in assumptions/parameters/*.yaml must be defined here.
# `licence` describes the cited document, not this file. The library only quotes
# numeric values (facts) with a reference; no text or tables are copied.
# `access`: free | paywalled | on-request.
# `retrieved`: date the URL was last opened or checked by a maintainer.
# `checked_via`: how the retrieval was done (direct | search-snippet | none).
#   `none` means the URL is the publisher's catalogue page and the clause was
#   not read on that date; the value entries that rely on it are marked
#   `check: unverified` until someone reads the clause.

