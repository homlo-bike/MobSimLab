# Noise estimate defaults of the noise plugin (ADR-0038 §5). Schema: assumptions/README.md.
# Used by crates/noise through crates/noise/data/defaults.json (generated by tools/noise/export_defaults.py).
# The CNOSSOS-EU road coefficients are not Project Preferences: they are the data file crates/noise/data/cnossos-road.json.

- key: noise.receiver_height_m
  label: "Receiver height above ground"
  group: Noise
  unit: m
  used_by: [noise corridor in the editors, noise map]
  values:
    - context: { mode: "*" }
      low: 1.5
      central: 4
      high: 4
      basis: cited
      sources: [end-2002]
      check: unverified
      rationale: "Strategic noise maps assess L_den and L_night at 4 m above ground (END Annex I). 1.5 m is the usual ear height for single-storey and garden checks."

- key: noise.day_start_h
  label: "Start of the day period (L_day)"
  group: Noise
  unit: h
  used_by: [noise indicators]
  values:
    - context: { mode: "*" }
      low: 6
      central: 7
      high: 8
      basis: cited
      sources: [end-2002]
      check: unverified
      rationale: "END Annex I: day 07–19, evening 19–23, night 23–07 by default; Member States may shift the periods by one or two hours."

- key: noise.evening_start_h
  label: "Start of the evening period (L_evening)"
  group: Noise
  unit: h
  used_by: [noise indicators]
  values:
    - context: { mode: "*" }
      low: 18
      central: 19
      high: 20
      basis: cited
      sources: [end-2002]
      check: unverified
      rationale: "END Annex I default 19:00; the evening period may be shortened by one or two hours with the day or night period lengthened to match."

- key: noise.night_start_h
  label: "Start of the night period (L_night)"
  group: Noise
  unit: h
  used_by: [noise indicators]
  values:
    - context: { mode: "*" }
      low: 22
      central: 23
      high: 24
      basis: cited
      sources: [end-2002]
      check: unverified
      rationale: "END Annex I default 23:00 for an eight-hour night."

- key: noise.evening_penalty_db
  label: "Evening penalty in L_den"
  group: Noise
  unit: dB
  used_by: [noise indicators]
  values:
    - context: { mode: "*" }
      low: 5
      central: 5
      high: 5
      basis: cited
      sources: [end-2002]
      check: unverified
      rationale: "L_den = 10 lg[(12·10^(L_day/10) + 4·10^((L_evening+5)/10) + 8·10^((L_night+10)/10))/24] (END Annex I)."

- key: noise.night_penalty_db
  label: "Night penalty in L_den"
  group: Noise
  unit: dB
  used_by: [noise indicators]
  values:
    - context: { mode: "*" }
      low: 10
      central: 10
      high: 10
      basis: cited
      sources: [end-2002]
      check: unverified
      rationale: "END Annex I, as for the evening penalty."

- key: noise.band_lden_db
  label: "Noise corridor edge in the editors, L_den"
  group: Noise
  unit: dB
  used_by: [noise corridor in the editors]
  values:
    - context: { mode: "*" }
      low: 45
      central: 55
      high: 65
      basis: cited
      sources: [end-2002]
      check: unverified
      rationale: "55 dB L_den is the lowest band Member States report under END Annex VI; the editor corridor is drawn out to it (ADR-0038 §1)."

- key: noise.band_lnight_db
  label: "Noise corridor edge in the editors, L_night"
  group: Noise
  unit: dB
  used_by: [noise corridor in the editors]
  values:
    - context: { mode: "*" }
      low: 40
      central: 50
      high: 60
      basis: cited
      sources: [end-2002]
      check: unverified
      rationale: "50 dB L_night is the lowest END Annex VI reporting band for the night."

- key: noise.who_guideline_lden_db
  label: "WHO guideline level, L_den"
  group: Noise
  unit: dB
  used_by: [noise map exposure, noise corridor checks]
  values:
    - context: { mode: "*" }
      low: 53
      central: 53
      high: 53
      basis: cited
      sources: [who-noise-2018]
      check: unverified
      rationale: "WHO 2018 recommends reducing road traffic noise below 53 dB L_den."
    - context:
        { mode: [tram, light_rail, metro, commuter_rail, regional_rail, long_distance_rail, high_speed_rail] }
      low: 54
      central: 54
      high: 54
      basis: cited
      sources: [who-noise-2018]
      check: unverified
      rationale: "WHO 2018 recommends reducing railway noise below 54 dB L_den."

- key: noise.who_guideline_lnight_db
  label: "WHO guideline level, L_night"
  group: Noise
  unit: dB
  used_by: [noise map exposure, noise corridor checks]
  values:
    - context: { mode: "*" }
      low: 45
      central: 45
      high: 45
      basis: cited
      sources: [who-noise-2018]
      check: unverified
      rationale: "WHO 2018: road traffic noise below 45 dB L_night."
    - context:
        { mode: [tram, light_rail, metro, commuter_rail, regional_rail, long_distance_rail, high_speed_rail] }
      low: 44
      central: 44
      high: 44
      basis: cited
      sources: [who-noise-2018]
      check: unverified
      rationale: "WHO 2018: railway noise below 44 dB L_night."

- key: noise.air_temperature_c
  label: "Air temperature for atmospheric absorption"
  group: Noise
  unit: °C
  used_by: [noise propagation]
  values:
    - context: { mode: "*" }
      low: 5
      central: 15
      high: 25
      basis: documented
      sources: [iso-9613-1, noisemodelling]
      check: unverified
      rationale: "ISO 9613-1 absorption is computed from temperature and humidity; 15 °C and 70 % are common defaults in CNOSSOS software. Absorption matters little within the 100–200 m of an editor corridor."

- key: noise.relative_humidity_pct
  label: "Relative humidity for atmospheric absorption"
  group: Noise
  unit: "%"
  used_by: [noise propagation]
  values:
    - context: { mode: "*" }
      low: 50
      central: 70
      high: 90
      basis: documented
      sources: [iso-9613-1, noisemodelling]
      check: unverified
      rationale: "As for the air temperature."

- key: noise.ground_factor_default
  label: "Ground factor G where land use is unknown (0 hard, 1 soft)"
  group: Noise
  unit: "-"
  used_by: [noise propagation]
  values:
    - context: { mode: "*" }
      low: 0
      central: 0.5
      high: 1
      basis: documented
      sources: [cnossos-2015, iso-9613-2]
      check: unverified
      rationale: "G = 0 for paved ground and water, 1 for grass, fields and forest. 0.5 stands for a mixed urban edge until land use from OSM is imported (ADR-0038 §2). The quick estimate applies the ISO 9613-2 ground effect with this one value."

- key: noise.max_source_distance_m
  label: "Largest source-to-receiver distance considered"
  group: Noise
  unit: m
  used_by: [noise corridor in the editors, noise map]
  values:
    - context: { mode: "*" }
      low: 250
      central: 500
      high: 1000
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: "Beyond about 500 m a transit line rarely lifts a receiver above 45 dB L_den; the range is tested in sensitivity runs."

- key: noise.grid_spacing_m
  label: "Receiver grid spacing"
  group: Noise
  unit: m
  used_by: [noise corridor in the editors, noise map]
  values:
    - context: { mode: "*" }
      low: 5
      central: 10
      high: 20
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: "Typical spacing of urban strategic maps. The editor coarsens the grid for very long lines so the corridor still recomputes on each edit."

- key: noise.favourable_probability_day
  label: "Share of favourable propagation conditions, day"
  group: Noise
  unit: "-"
  used_by: [noise map (full propagation)]
  values:
    - context: { mode: "*" }
      low: 0.33
      central: 0.5
      high: 1.0
      basis: documented
      sources: [noisemodelling]
      check: unverified
      rationale: "NMPB-2008 defaults as used for France in CNOSSOS software; Hungarian climatology finds about one third by day. Used by the full map; the editor corridor assumes favourable conditions throughout (an upper bound)."

- key: noise.favourable_probability_evening
  label: "Share of favourable propagation conditions, evening"
  group: Noise
  unit: "-"
  used_by: [noise map (full propagation)]
  values:
    - context: { mode: "*" }
      low: 0.33
      central: 0.75
      high: 1.0
      basis: documented
      sources: [noisemodelling]
      check: unverified
      rationale: "As for the day; about two thirds in Hungarian climatology."

- key: noise.favourable_probability_night
  label: "Share of favourable propagation conditions, night"
  group: Noise
  unit: "-"
  used_by: [noise map (full propagation)]
  values:
    - context: { mode: "*" }
      low: 0.66
      central: 1.0
      high: 1.0
      basis: documented
      sources: [noisemodelling]
      check: unverified
      rationale: "As for the day."

- key: noise.reflection_order
  label: "Reflection order (full map)"
  group: Noise
  unit: "-"
  used_by: [noise map (full propagation)]
  values:
    - context: { mode: "*" }
      low: 0
      central: 1
      high: 2
      basis: documented
      sources: [noisemodelling]
      check: unverified
      rationale: "First-order façade reflections are usual CNOSSOS mapping practice."

- key: noise.building_level_height_m
  label: "Storey height for buildings without a height"
  group: Noise
  unit: m
  used_by: [noise map (full propagation)]
  values:
    - context: { mode: "*" }
      low: 2.8
      central: 3
      high: 3.5
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: "Used when OSM has building:levels but no height; a building with neither counts as three storeys."

- key: noise.road_source_height_m
  label: "Road vehicle source height"
  group: Noise
  unit: m
  used_by: [noise corridor in the editors]
  values:
    - context: { mode: "*" }
      low: 0.05
      central: 0.05
      high: 0.05
      basis: cited
      sources: [cnossos-2015]
      check: unverified
      rationale: "CNOSSOS-EU places the road line source 0.05 m above the road surface."

- key: noise.rail_source_height_m
  label: "Rail vehicle source height above the rail head"
  group: Noise
  unit: m
  used_by: [noise corridor in the editors]
  values:
    - context: { mode: "*" }
      low: 0.05
      central: 0.5
      high: 4
      basis: educated-guess
      sources: [cnossos-2015, mobsimlab-derivation]
      check: unverified
      rationale: "CNOSSOS-EU uses two railway sources, at 0.05 m (rolling and impact) and 4 m (pantograph and aerodynamic). The quick estimate uses one source at 0.5 m, between the two and nearer the dominant rolling noise."

- key: noise.road_stop_zone_m
  label: "Acceleration and braking zone either side of a stop"
  group: Noise
  unit: m
  used_by: [noise corridor in the editors]
  values:
    - context: { mode: "*" }
      low: 50
      central: 100
      high: 100
      basis: cited
      sources: [cnossos-2015]
      check: unverified
      rationale: "CNOSSOS-EU applies the acceleration correction within 100 m of a signalised junction or roundabout, fading linearly; a stop is treated like a signalised junction (ADR-0038 §2)."

- key: noise.electric_road_propulsion_delta_db
  label: "Electric buses and trolleybuses: change to the propulsion noise term"
  group: Noise
  unit: dB
  used_by: [noise corridor in the editors, noise map]
  values:
    - context: { mode: "*" }
      low: -12
      central: -8
      high: -3
      basis: educated-guess
      sources: [nzta-rr703]
      check: secondary
      rationale: "PLACEHOLDER awaiting the product owner's value (asked 2026-11-03). NZTA RR 703 found electric buses about 8 dB quieter at 10 km/h and no different at 30 km/h; applying the change to the CNOSSOS propulsion term only reproduces that fade-out because rolling noise dominates with speed. CNOSSOS-EU has no electric category yet."

- key: noise.rail_passby_db
  label: "Rail pass-by level L_pAeq,Tp at 7.5 m and 1.2 m at the reference speed, ballasted track"
  group: Noise
  unit: dB(A)
  used_by: [noise corridor in the editors]
  values:
    - context: { mode: "*" }
      low: 74
      central: 78
      high: 82
      basis: educated-guess
      sources: [tsi-noi, iso-3095, mobsimlab-derivation]
      check: unverified
      rationale: "Interim rail emission until the CNOSSOS-EU railway database (Appendix F) is in the crate: one measured-style pass-by level per mode, scaled with speed. Fallback for a mode without its own entry."
    - context: { mode: tram }
      low: 72
      central: 75
      high: 79
      basis: educated-guess
      sources: [iso-3095, mobsimlab-derivation]
      check: unverified
      rationale: "Modern low-floor trams measured to ISO 3095 at 40 km/h typically fall between the low and high values; reference speed 40 km/h."
    - context: { mode: light_rail }
      low: 73
      central: 77
      high: 81
      basis: educated-guess
      sources: [iso-3095, mobsimlab-derivation]
      check: unverified
      rationale: "Light rail vehicles at 50 km/h on ballast, between trams and metro."
    - context: { mode: metro }
      low: 75
      central: 79
      high: 83
      basis: educated-guess
      sources: [iso-3095, mobsimlab-derivation]
      check: unverified
      rationale: "Metro trains on surface ballasted track at 60 km/h; rubber-tyred metro is several dB quieter and needs its own measured value."
    - context: { mode: commuter_rail }
      low: 74
      central: 77
      high: 80
      basis: documented
      sources: [tsi-noi]
      check: unverified
      rationale: "TSI NOI limits electric multiple units to 80 dB at 80 km/h; recent EMUs measure 3–6 dB below the limit. Reference speed 80 km/h."
    - context: { mode: regional_rail }
      low: 74
      central: 78
      high: 81
      basis: documented
      sources: [tsi-noi]
      check: unverified
      rationale: "TSI NOI: EMU 80 dB and DMU 81 dB at 80 km/h; regional fleets mix both. Reference speed 80 km/h."
    - context: { mode: long_distance_rail }
      low: 76
      central: 80
      high: 84
      basis: documented
      sources: [tsi-noi]
      check: unverified
      rationale: "Locomotive-hauled trains: TSI NOI limits 84 dB for electric locomotives and 79 dB for coaches at 80 km/h. Reference speed 80 km/h."
    - context: { mode: high_speed_rail }
      low: 75
      central: 78
      high: 80
      basis: documented
      sources: [tsi-noi]
      check: unverified
      rationale: "High-speed EMUs at 80 km/h are within the TSI NOI EMU limit (80 dB); aerodynamic noise above about 200 km/h is added by the speed law."

- key: noise.rail_passby_ref_speed_kmh
  label: "Reference speed of the rail pass-by level"
  group: Noise
  unit: km/h
  used_by: [noise corridor in the editors]
  values:
    - context: { mode: "*" }
      low: 80
      central: 80
      high: 80
      basis: cited
      sources: [tsi-noi]
      check: unverified
      rationale: "TSI NOI states pass-by limits at 80 km/h."
    - context: { mode: tram }
      low: 40
      central: 40
      high: 40
      basis: documented
      sources: [iso-3095]
      check: unverified
      rationale: "Usual measurement speed for trams."
    - context: { mode: light_rail }
      low: 50
      central: 50
      high: 50
      basis: documented
      sources: [iso-3095]
      check: unverified
      rationale: "Usual measurement speed for light rail."
    - context: { mode: metro }
      low: 60
      central: 60
      high: 60
      basis: documented
      sources: [iso-3095]
      check: unverified
      rationale: "Usual measurement speed for metro trains."

- key: noise.rail_rolling_speed_exponent
  label: "Rail rolling noise: dB per decade of speed"
  group: Noise
  unit: dB
  used_by: [noise corridor in the editors]
  values:
    - context: { mode: "*" }
      low: 25
      central: 30
      high: 35
      basis: documented
      sources: [cnossos-2015]
      check: unverified
      rationale: "Rolling noise grows about 30 lg(v/v0) between about 30 and 200 km/h; below that traction and auxiliaries keep a floor (taken 10 dB under the reference pass-by level)."

- key: noise.rail_squeal_r300_db
  label: "Curve squeal, railways, radius up to 300 m"
  group: Noise
  unit: dB
  used_by: [noise corridor in the editors, noise map]
  values:
    - context: { mode: "*" }
      low: 5
      central: 8
      high: 10
      basis: cited
      sources: [cnossos-2021]
      check: secondary
      rationale: "Directive (EU) 2021/1226, railway squeal table: +8 dB for R ≤ 300 m on at least 50 m of track (read in the German and Spanish texts). Low and high are sensitivity values for lubricated and badly squealing curves."

- key: noise.rail_squeal_r500_db
  label: "Curve squeal, railways, radius 300–500 m"
  group: Noise
  unit: dB
  used_by: [noise corridor in the editors, noise map]
  values:
    - context: { mode: "*" }
      low: 3
      central: 5
      high: 8
      basis: cited
      sources: [cnossos-2021]
      check: secondary
      rationale: "Directive (EU) 2021/1226: +5 dB for 300 < R ≤ 500 m."

- key: noise.tram_squeal_r200_db
  label: "Curve squeal, trams, radius up to 200 m"
  group: Noise
  unit: dB
  used_by: [noise corridor in the editors, noise map]
  values:
    - context: { mode: "*" }
      low: 3
      central: 5
      high: 8
      basis: cited
      sources: [cnossos-2021]
      check: secondary
      rationale: "Directive (EU) 2021/1226: trams +5 dB for R ≤ 200 m."

- key: noise.squeal_min_length_m
  label: "Shortest curve that gets the squeal correction"
  group: Noise
  unit: m
  used_by: [noise corridor in the editors, noise map]
  values:
    - context: { mode: "*" }
      low: 50
      central: 50
      high: 50
      basis: cited
      sources: [cnossos-2021]
      check: secondary
      rationale: "The squeal correction applies to curves of at least 50 m length."

- key: noise.rail_switch_db
  label: "Switches and crossings: impact noise added over the switch"
  group: Noise
  unit: dB
  used_by: [noise corridor in the editors]
  values:
    - context: { mode: "*" }
      low: 2
      central: 4
      high: 6
      basis: educated-guess
      sources: [cnossos-2015, mobsimlab-derivation]
      check: unverified
      rationale: "CNOSSOS-EU adds impact noise from the joint density; a turnout with two or three joints and a rigid crossing over about 30–60 m raises the local emission by a few dB. Interim until the impact term of the railway database is in the crate."

- key: noise.rail_bridge_db
  label: "Elevated track: bridge noise added"
  group: Noise
  unit: dB
  used_by: [noise corridor in the editors]
  values:
    - context: { mode: "*" }
      low: 1
      central: 3
      high: 9
      basis: educated-guess
      sources: [cnossos-2015, mobsimlab-derivation]
      check: unverified
      rationale: "CNOSSOS-EU adds a bridge correction per structure type: small for heavy concrete viaducts with ballast, up to about +9 dB for steel bridges with direct fastening. Central for a concrete viaduct."

- key: noise.tram_embedded_track_db
  label: "Trams on embedded street track, compared with ballast"
  group: Noise
  unit: dB
  used_by: [noise corridor in the editors]
  values:
    - context: { mode: "*" }
      low: 0
      central: 2
      high: 5
      basis: educated-guess
      sources: [cnossos-2021, mobsimlab-derivation]
      check: unverified
      rationale: "Embedded track in paving radiates more than ballast and reflects; grass track would be quieter. The CNOSSOS-EU 2021 tram superstructure entries give the exact correction once the railway database is in the crate."

- key: noise.cable_car_tower_lw_db
  label: "Cable car tower: sound power while cabins pass the sheaves"
  group: Noise
  unit: dB(A)
  used_by: [noise map (cable cars, indicative)]
  values:
    - context: { mode: "*" }
