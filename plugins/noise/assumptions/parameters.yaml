  group: Noise
  unit: dB
  used_by: [noise corridor in the editors, noise map]
  values:
    - context: { mode: "*" }
      low: 5
      central: 8
      high: 10
      basis: cited
      sources: [cnossos-2021]
      check: read
      rationale: "Directive (EU) 2021/1226, Annex point (4)(b), squeal table: trains +8 dB for curves with R ≤ 300 m and at least 50 m of track (and switch turnouts with R ≤ 300 m), added to the rolling noise in all bands. Low and high are sensitivity values for lubricated and badly squealing curves."

