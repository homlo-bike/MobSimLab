      check: unverified
      rationale: "PLACEHOLDER awaiting the product owner's value (asked 2026-11-03) and the cable car research. Order of magnitude from the Burnaby Mountain Gondola study; results using it are labelled indicative."

- key: noise.cable_car_station_lw_db
  label: "Cable car station: sound power of drive, bullwheel and cabin handling"
