      high: 105
      basis: educated-guess
      sources: [burnaby-gondola-noise]
      check: unverified
      rationale: "PLACEHOLDER awaiting the product owner's value (asked 2026-11-03) and the cable car research."

- key: noise.ferry_cruise_lw_db
  label: "Ferry at cruise speed: sound power"
  group: Noise
  unit: dB(A)
  used_by: [noise map (ferries, indicative)]
