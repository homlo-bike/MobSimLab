# Noise estimate defaults of the noise plugin (ADR-0038 §5). Schema: assumptions/README.md.
# Used by crates/noise through crates/noise/data/defaults.json (generated by tools/noise/export_defaults.py).
# The CNOSSOS-EU road coefficients are not Project Preferences: they are the data file crates/noise/data/cnossos-road.json.

- key: noise.receiver_height_m
  label: "Receiver height above ground"
  group: Noise
  unit: m
  used_by: [noise corridor in the editors, noise map]
  values:
    - context: { mode: "*" }
      low: 1.5
      central: 4
      high: 4
      basis: cited
      sources: [end-2002]
      check: unverified
      rationale: "Strategic noise maps assess L_den and L_night at 4 m above ground (END Annex I). 1.5 m is the usual ear height for single-storey and garden checks."

- key: noise.day_start_h
  label: "Start of the day period (L_day)"
  group: Noise
  unit: h
  used_by: [noise indicators]
  values:
    - context: { mode: "*" }
      low: 6
      central: 7
      high: 8
      basis: cited
      sources: [end-2002]
      check: unverified
      rationale: "END Annex I: day 07–19, evening 19–23, night 23–07 by default; Member States may shift the periods by one or two hours."

- key: noise.evening_start_h
  label: "Start of the evening period (L_evening)"
  group: Noise
  unit: h
  used_by: [noise indicators]
  values:
    - context: { mode: "*" }
      low: 18
      central: 19
      high: 20
      basis: cited
      sources: [end-2002]
      check: unverified
      rationale: "END Annex I default 19:00; the evening period may be shortened by one or two hours with the day or night period lengthened to match."

- key: noise.night_start_h
  label: "Start of the night period (L_night)"
  group: Noise
  unit: h
  used_by: [noise indicators]
  values:
    - context: { mode: "*" }
      low: 22
      central: 23
      high: 24
      basis: cited
      sources: [end-2002]
      check: unverified
      rationale: "END Annex I default 23:00 for an eight-hour night."

- key: noise.evening_penalty_db
  label: "Evening penalty in L_den"
  group: Noise
  unit: dB
  used_by: [noise indicators]
  values:
    - context: { mode: "*" }
      low: 5
      central: 5
      high: 5
      basis: cited
      sources: [end-2002]
      check: unverified
      rationale: "L_den = 10 lg[(12·10^(L_day/10) + 4·10^((L_evening+5)/10) + 8·10^((L_night+10)/10))/24] (END Annex I)."

- key: noise.night_penalty_db
  label: "Night penalty in L_den"
  group: Noise
  unit: dB
  used_by: [noise indicators]
  values:
    - context: { mode: "*" }
      low: 10
      central: 10
      high: 10
      basis: cited
      sources: [end-2002]
      check: unverified
      rationale: "END Annex I, as for the evening penalty."

- key: noise.band_lden_db
  label: "Noise corridor edge in the editors, L_den"
  group: Noise
  unit: dB
  used_by: [noise corridor in the editors]
  values:
    - context: { mode: "*" }
      low: 45
      central: 55
      high: 65
      basis: cited
      sources: [end-2002]
      check: unverified
      rationale: "55 dB L_den is the lowest band Member States report under END Annex VI; the editor corridor is drawn out to it (ADR-0038 §1)."

- key: noise.band_lnight_db
  label: "Noise corridor edge in the editors, L_night"
  group: Noise
  unit: dB
  used_by: [noise corridor in the editors]
  values:
    - context: { mode: "*" }
      low: 40
      central: 50
      high: 60
      basis: cited
      sources: [end-2002]
      check: unverified
      rationale: "50 dB L_night is the lowest END Annex VI reporting band for the night."

- key: noise.who_guideline_lden_db
  label: "WHO guideline level, L_den"
  group: Noise
  unit: dB
  used_by: [noise map exposure, noise corridor checks]
  values:
    - context: { mode: "*" }
      low: 53
      central: 53
      high: 53
      basis: cited
      sources: [who-noise-2018]
      check: unverified
      rationale: "WHO 2018 recommends reducing road traffic noise below 53 dB L_den."
    - context:
        { mode: [tram, light_rail, metro, commuter_rail, regional_rail, long_distance_rail, high_speed_rail] }
      low: 54
      central: 54
      high: 54
      basis: cited
      sources: [who-noise-2018]
      check: unverified
      rationale: "WHO 2018 recommends reducing railway noise below 54 dB L_den."

- key: noise.who_guideline_lnight_db
  label: "WHO guideline level, L_night"
  group: Noise
  unit: dB
  used_by: [noise map exposure, noise corridor checks]
  values:
    - context: { mode: "*" }
      low: 45
      central: 45
      high: 45
      basis: cited
      sources: [who-noise-2018]
      check: unverified
      rationale: "WHO 2018: road traffic noise below 45 dB L_night."
    - context:
        { mode: [tram, light_rail, metro, commuter_rail, regional_rail, long_distance_rail, high_speed_rail] }
      low: 44
      central: 44
      high: 44
      basis: cited
      sources: [who-noise-2018]
      check: unverified
      rationale: "WHO 2018: railway noise below 44 dB L_night."

- key: noise.air_temperature_c
  label: "Air temperature for atmospheric absorption"
  group: Noise
  unit: °C
  used_by: [noise propagation]
  values:
    - context: { mode: "*" }
      low: 5
      central: 15
      high: 25
      basis: documented
      sources: [iso-9613-1, noisemodelling]
      check: unverified
      rationale: "ISO 9613-1 absorption is computed from temperature and humidity; 15 °C and 70 % are common defaults in CNOSSOS software. Absorption matters little within the 100–200 m of an editor corridor."

- key: noise.relative_humidity_pct
  label: "Relative humidity for atmospheric absorption"
  group: Noise
  unit: "%"
  used_by: [noise propagation]
  values:
    - context: { mode: "*" }
      low: 50
      central: 70
      high: 90
      basis: documented
      sources: [iso-9613-1, noisemodelling]
      check: unverified
      rationale: "As for the air temperature."

- key: noise.ground_factor_default
  label: "Ground factor G where land use is unknown (0 hard, 1 soft)"
  group: Noise
  unit: "-"
  used_by: [noise propagation]
  values:
    - context: { mode: "*" }
      low: 0
      central: 0.5
      high: 1
      basis: documented
      sources: [cnossos-2015, iso-9613-2]
      check: unverified
      rationale: "G = 0 for paved ground and water, 1 for grass, fields and forest. 0.5 stands for a mixed urban edge until land use from OSM is imported (ADR-0038 §2). The quick estimate applies the ISO 9613-2 ground effect with this one value."

- key: noise.max_source_distance_m
  label: "Largest source-to-receiver distance considered"
  group: Noise
  unit: m
  used_by: [noise corridor in the editors, noise map]
  values:
    - context: { mode: "*" }
      low: 250
      central: 500
      high: 1000
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: "Beyond about 500 m a transit line rarely lifts a receiver above 45 dB L_den; the range is tested in sensitivity runs."

- key: noise.grid_spacing_m
  label: "Receiver grid spacing"
  group: Noise
  unit: m
  used_by: [noise corridor in the editors, noise map]
  values:
    - context: { mode: "*" }
      low: 5
      central: 10
      high: 20
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: "Typical spacing of urban strategic maps. The editor coarsens the grid for very long lines so the corridor still recomputes on each edit."

- key: noise.building_storey_height_m
  label: "Height of one storey, for OSM buildings tagged with storeys only"
  group: Noise
  unit: m
  used_by: [noise map]
  values:
    - context: { mode: "*" }
      low: 2.8
      central: 3
      high: 3.5
      basis: educated-guess
      sources: [mobsimlab-derivation, osm-data]
      check: unverified
      rationale: "OSM buildings carry `height` (used as given) or `building:levels`; storeys × this value gives the screen height. 3 m is a common floor-to-floor height of housing; offices and older buildings are taller."

- key: noise.building_default_height_m
  label: "Height of an OSM building with neither height nor storeys"
  group: Noise
  unit: m
  used_by: [noise map]
  values:
    - context: { mode: "*" }
      low: 4
      central: 8
      high: 15
      basis: educated-guess
      sources: [mobsimlab-derivation, osm-data]
      check: unverified
      rationale: "Most OSM buildings have no height tag. 8 m stands for a two-to-three-storey building; the low end (a single storey or shed) screens less, which is the cautious side for the map. Any building at least 2 to 3 m above the line of sight already gives most of the roof screening."

- key: noise.favourable_probability_day
  label: "Share of favourable propagation conditions, day"
  group: Noise
  unit: "-"
  used_by: [noise map (full propagation)]
  values:
    - context: { mode: "*" }
      low: 0.33
      central: 0.5
      high: 1.0
      basis: documented
      sources: [noisemodelling]
      check: unverified
      rationale: "NMPB-2008 defaults as used for France in CNOSSOS software; Hungarian climatology finds about one third by day. Used by the full map; the editor corridor assumes favourable conditions throughout (an upper bound)."

- key: noise.favourable_probability_evening
  label: "Share of favourable propagation conditions, evening"
  group: Noise
  unit: "-"
  used_by: [noise map (full propagation)]
  values:
    - context: { mode: "*" }
      low: 0.33
      central: 0.75
      high: 1.0
      basis: documented
      sources: [noisemodelling]
      check: unverified
      rationale: "As for the day; about two thirds in Hungarian climatology."

- key: noise.favourable_probability_night
  label: "Share of favourable propagation conditions, night"
  group: Noise
  unit: "-"
  used_by: [noise map (full propagation)]
  values:
    - context: { mode: "*" }
      low: 0.66
      central: 1.0
      high: 1.0
      basis: documented
      sources: [noisemodelling]
      check: unverified
      rationale: "As for the day."

- key: noise.reflection_order
  label: "Reflection order (full map)"
  group: Noise
  unit: "-"
  used_by: [noise map (full propagation)]
  values:
    - context: { mode: "*" }
      low: 0
      central: 1
      high: 2
      basis: documented
      sources: [noisemodelling]
      check: unverified
      rationale: "First-order façade reflections are usual CNOSSOS mapping practice."

- key: noise.reflection_max_distance_m
  label: "Farthest facade that reflects onto a receiver (full map)"
  group: Noise
  unit: m
  used_by: [noise map (full propagation)]
  values:
    - context: { mode: "*" }
      low: 25
      central: 50
      high: 100
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: "First-order reflections are searched on the facades within this distance of each map receiver. 50 m covers the opposite side of most urban streets and squares; a farther facade adds little next to the direct sound, and a wider search slows the map down."

- key: noise.facade_reflection_coefficient
  label: "Share of sound energy a facade reflects"
  group: Noise
  unit: "-"
  used_by: [noise map (full propagation)]
  values:
    - context: { mode: "*" }
      low: 0.4
      central: 0.8
      high: 1.0
      basis: documented
      sources: [iso-9613-2]
      check: unverified
      rationale: "ISO 9613-2 Table 4 gives 1 for flat hard walls without openings, 0.8 for walls of buildings with windows and small additions or bays, and 0.4 for factory walls with half the surface openings, installations or pipes. 0.8 (a reflection loss of about 1 dB) stands for ordinary building facades."

- key: noise.terrain_filter_window_m
  label: "Width of what is taken out of the surface model as not ground"
  group: Noise
  unit: m
  used_by: [noise map (full propagation)]
  values:
    - context: { mode: "*" }
      low: 30
      central: 60
      high: 120
      basis: educated-guess
      sources: [zhang-2003-pmf, copernicus-glo30]
      check: unverified
      rationale: "Copernicus GLO-30 is a surface model with roofs and tree tops. Samples inside OSM buildings are dropped, then a morphological opening over this window (Zhang et al. 2003) removes anything narrower that stands above its surroundings: other buildings, tree rows, bridges. Hills and embankments wider than the window stay. Too narrow a window keeps large buildings and woods as terrain; too wide flattens small hills."

- key: noise.building_level_height_m
  label: "Storey height for buildings without a height"
  group: Noise
  unit: m
  used_by: [noise map (full propagation)]
  values:
    - context: { mode: "*" }
      low: 2.8
      central: 3
      high: 3.5
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: "Used when OSM has building:levels but no height; a building with neither counts as three storeys."

- key: noise.road_source_height_m
  label: "Road vehicle source height"
  group: Noise
  unit: m
  used_by: [noise corridor in the editors]
  values:
    - context: { mode: "*" }
      low: 0.05
      central: 0.05
      high: 0.05
      basis: cited
      sources: [cnossos-2015]
      check: unverified
      rationale: "CNOSSOS-EU places the road line source 0.05 m above the road surface."

- key: noise.rail_source_height_a_m
  label: "Rail source A height above the rail head (rolling, impact, squeal, bridge, low traction)"
  group: Noise
  unit: m
  used_by: [noise corridor in the editors, noise map]
  values:
    - context: { mode: "*" }
      low: 0.5
      central: 0.5
      high: 0.5
      basis: cited
      sources: [cnossos-2015]
      check: read
      rationale: "CNOSSOS-EU Annex II 2.3.1, Figure 2.3.a: source A at 0.5 m above the plane of the rail heads."

- key: noise.rail_source_height_b_m
  label: "Rail source B height above the rail head (roof traction, pantograph, aerodynamic)"
  group: Noise
  unit: m
  used_by: [noise corridor in the editors, noise map]
  values:
    - context: { mode: "*" }
      low: 4
      central: 4
      high: 4
      basis: cited
      sources: [cnossos-2015]
      check: read
      rationale: "CNOSSOS-EU Annex II 2.3.1, Figure 2.3.a: source B at 4.0 m above the plane of the rail heads."

- key: noise.rail_min_roughness_speed_kmh
  label: "Lowest speed used for the rail rolling noise roughness"
  group: Noise
  unit: km/h
  used_by: [noise corridor in the editors, noise map]
  values:
    - context: { mode: "*" }
      low: 50
      central: 50
      high: 50
      basis: cited
      sources: [cnossos-2015]
      check: read
      rationale: "CNOSSOS-EU Annex II 2.3.2 (rolling noise): a minimum speed of 50 km/h is used for the total effective roughness, to cover braking and impact noise at low speed; it does not change the vehicle flow. Impact noise is not modelled below this speed."
    - context: { mode: [tram, light_rail] }
      low: 30
      central: 30
      high: 30
      basis: cited
      sources: [cnossos-2015]
      check: read
      rationale: "CNOSSOS-EU Annex II 2.3.2: 30 km/h for trams and light metro."

- key: noise.rail_aero_from_kmh
  label: "Speed above which aerodynamic noise is added"
  group: Noise
  unit: km/h
  used_by: [noise corridor in the editors, noise map]
  values:
    - context: { mode: "*" }
      low: 200
      central: 200
      high: 200
      basis: cited
      sources: [cnossos-2015]
      check: read
      rationale: "CNOSSOS-EU Annex II 2.3.2 (aerodynamic noise): only relevant above 200 km/h. The Table G-6 values are then added at sources A and B with alpha 50 (L_W = L_W,0 + 50 lg(v/300))."

- key: noise.rail_vehicle_length_m
  label: "Rail vehicle length used to count vehicles in a train"
  group: Noise
  unit: m
  used_by: [noise corridor in the editors, noise map]
  values:
    - context: { mode: "*" }
      low: 25
      central: 25
      high: 25
      basis: educated-guess
      sources: [cnossos-2015, mobsimlab-derivation]
      check: unverified
      rationale: "CNOSSOS-EU counts vehicles (sub-units of a train). The train length the editors give is divided by this length to get the number of vehicles; 25 m is a usual mainline multiple-unit car."
    - context: { mode: [tram, light_rail] }
      low: 30
      central: 30
      high: 30
      basis: educated-guess
      sources: [cnossos-2015, mobsimlab-derivation]
      check: unverified
      rationale: "Articulated trams and light rail vehicles cannot be split, so CNOSSOS-EU treats each as one vehicle; 30 m is a usual unit length, so a double unit counts as two."
    - context: { mode: metro }
      low: 20
      central: 20
      high: 20
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: "Usual metro car length."
    - context: { mode: long_distance_rail }
      low: 26.4
      central: 26.4
      high: 26.4
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: "UIC-X/Z passenger coach length."

- key: noise.rail_axles_per_vehicle
  label: "Axles per rail vehicle"
  group: Noise
  unit: axles
  used_by: [noise corridor in the editors, noise map]
  values:
    - context: { mode: "*" }
      low: 4
      central: 4
      high: 4
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: "Two two-axle bogies per car. Rolling noise grows 10 lg(N_a) with the axle count (CNOSSOS-EU formulas 2.3.8 to 2.3.10)."
    - context: { mode: [tram, light_rail] }
      low: 4
      central: 6
      high: 8
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: "A 30 m articulated low-floor tram runs on two to four bogies (some with independent wheels); three bogies is common."

- key: noise.rail_powered_vehicle_share
  label: "Share of rail vehicles that carry traction equipment (multiple units)"
  group: Noise
  unit: share
  used_by: [noise corridor in the editors, noise map]
  values:
    - context: { mode: "*" }
      low: 0.5
      central: 0.5
      high: 0.75
      basis: educated-guess
      sources: [cnossos-2015, mobsimlab-derivation]
      check: unverified
      rationale: "The Table G-5 traction values are per vehicle. In a multiple unit only some cars carry motors and converters; half is usual for EMUs and high-speed trains with distributed traction."
    - context: { mode: [tram, light_rail] }
      low: 1
      central: 1
      high: 1
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: "Each tram or light rail vehicle is self-propelled."
    - context: { mode: long_distance_rail }
      low: 0
      central: 0
      high: 0
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: "Locomotive-hauled: the coaches have no traction; the locomotive is counted by noise.rail_locomotives_per_train."

- key: noise.rail_locomotives_per_train
  label: "Locomotives per train"
  group: Noise
  unit: count
  used_by: [noise corridor in the editors, noise map]
  values:
    - context: { mode: "*" }
      low: 0
      central: 0
      high: 0
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: "Multiple units have no locomotive."
    - context: { mode: long_distance_rail }
      low: 1
      central: 1
      high: 1
      basis: educated-guess
      sources: [mobsimlab-derivation]
      check: unverified
      rationale: "One locomotive hauls the coaches; its traction noise comes from noise.rail_traction."

- key: noise.rail_traction
  label: "Traction noise source (CNOSSOS-EU Table G-5)"
  group: Noise
  unit: id
  kind: enum
  options: [emu, dmu, electric_loco, diesel_loco_800kw, diesel_loco_2200kw]
  used_by: [noise corridor in the editors, noise map]
  values:
    - context: { mode: "*" }
      low: emu
      central: emu
      high: emu
      basis: educated-guess
      sources: [cnossos-2015, cnossos-2021]
      check: read
      rationale: "Electric multiple unit, per powered vehicle, split between source A and source B as the table gives."
    - context: { mode: regional_rail }
      low: emu
      central: emu
      high: dmu
      basis: educated-guess
      sources: [cnossos-2015, cnossos-2021]
      check: read
      rationale: "Regional fleets mix electric and diesel multiple units; the high end assumes diesel."
    - context: { mode: long_distance_rail }
      low: electric_loco
      central: electric_loco
      high: diesel_loco_2200kw
      basis: educated-guess
      sources: [cnossos-2015, cnossos-2021]
      check: read
      rationale: "Electric locomotive; the high end is a 2 200 kW diesel locomotive (Table G-5 with the 6 300 Hz row corrected by 2021/1226)."

- key: noise.rail_wheel_roughness
  label: "Wheel roughness by brake type (CNOSSOS-EU Table G-1)"
  group: Noise
  unit: id
  kind: enum
  options: [cast_iron, composite, disc]
  used_by: [noise corridor in the editors, noise map]
  values:
    - context: { mode: "*" }
      low: disc
      central: disc
      high: composite
      basis: educated-guess
      sources: [cnossos-2015]
      check: read
      rationale: "Passenger rolling stock is disc braked; the high end allows for composite tread brakes, which leave rougher wheels. Table G-1 starts at 1 000 mm; longer wavelengths take the 1 000 mm value."

- key: noise.rail_rail_roughness
  label: "Rail roughness (CNOSSOS-EU Table G-1, as replaced by 2021/1226)"
  group: Noise
  unit: id
  kind: enum
  options: [e, m]
  used_by: [noise corridor in the editors, noise map]
  values:
    - context: { mode: "*" }
      low: e
      central: m
      high: m
      basis: cited
      sources: [cnossos-2021]
      check: read
      rationale: "M: average network, normally maintained. The low end is E, well maintained and very smooth (EN ISO 3095 reference)."

- key: noise.rail_contact_filter
  label: "Contact filter by wheel load and diameter (CNOSSOS-EU Table G-2, as replaced by 2021/1226)"
  group: Noise
  unit: id
  kind: enum
  options:
    [
      wheel_load_50kn_d360,
      wheel_load_50kn_d680,
      wheel_load_50kn_d920,
      wheel_load_25kn_d920,
      wheel_load_100kn_d920,
    ]
  used_by: [noise corridor in the editors, noise map]
  values:
    - context: { mode: "*" }
      low: wheel_load_50kn_d920
      central: wheel_load_50kn_d920
      high: wheel_load_50kn_d920
      basis: educated-guess
      sources: [cnossos-2021]
      check: read
      rationale: "Passenger cars with 920 mm wheels; 50 kN wheel load is the nearest table entry for 10–14 t axle loads."
    - context: { mode: [tram, light_rail] }
      low: wheel_load_50kn_d680
      central: wheel_load_50kn_d680
      high: wheel_load_50kn_d680
      basis: educated-guess
      sources: [cnossos-2021]
      check: read
      rationale: "Low-floor vehicles have small wheels (about 600–680 mm)."

- key: noise.rail_wheel_transfer
  label: "Wheel transfer function by wheel diameter (CNOSSOS-EU Table G-3)"
  group: Noise
  unit: id
  kind: enum
  options: [d920, d840, d680, d1200]
  used_by: [noise corridor in the editors, noise map]
  values:
    - context: { mode: "*" }
      low: d920
      central: d920
      high: d920
      basis: educated-guess
      sources: [cnossos-2015]
      check: read
      rationale: "920 mm wheels, no noise measure."
    - context: { mode: [tram, light_rail] }
      low: d680
      central: d680
      high: d680
      basis: educated-guess
      sources: [cnossos-2015]
      check: read
      rationale: "Small wheels of low-floor vehicles."
    - context: { mode: metro }
      low: d840
      central: d840
      high: d840
      basis: educated-guess
      sources: [cnossos-2015]
      check: read
      rationale: "Metro wheels are usually about 840 mm."

- key: noise.rail_track_transfer
  label: "Track transfer function by sleeper and rail pad (CNOSSOS-EU Table G-3, as replaced by 2021/1226)"
  group: Noise
  unit: id
  kind: enum
  options: [mono_soft, mono_medium, mono_hard, bi_soft, bi_medium, bi_hard, wooden, direct_fastening_bridge]
  used_by: [noise corridor in the editors, noise map]
  values:
    - context: { mode: "*" }
      low: mono_hard
      central: mono_medium
      high: mono_soft
      basis: educated-guess
      sources: [cnossos-2021]
      check: read
      rationale: "Ballasted track on concrete mono-block sleepers with medium rail pads (250–800 MN/m). Soft pads let the rail radiate more; hard pads less. Bridges keep this track: the bridge structure is added as its own source."

- key: noise.rail_bridge_transfer
  label: "Bridge transfer function (CNOSSOS-EU Table G-7, as replaced by 2021/1226)"
  group: Noise
  unit: id
  kind: enum
  options: [plus10, plus15]
  used_by: [noise corridor in the editors, noise map]
  values:
    - context: { mode: "*" }
      low: plus10
      central: plus10
      high: plus15
      basis: cited
      sources: [cnossos-2021]
      check: read
      rationale: "Table G-7 gives two bridge transfer functions, headed +10 dB(A) and +15 dB(A). Bridge noise is an extra omnidirectional source at A: L_W,0,bridge = L_R,TOT + L_H,bridge + 10 lg(N_a) (formula 2.3.18 as replaced)."

- key: noise.rail_impact_extent_m
  label: "Impact noise from a switch or joint: extent before and after it"
  group: Noise
  unit: m
  used_by: [noise corridor in the editors, noise map]
  values:
    - context: { mode: "*" }
      low: 50
      central: 50
      high: 50
      basis: cited
      sources: [cnossos-2015]
      check: read
      rationale: "CNOSSOS-EU Annex II 2.3.2 (impact noise): the impact roughness raises the emission from 50 m before to 50 m after the joint or switch, at a joint density of one per 100 m (Table G-4 single switch/joint/crossing)."

- key: noise.road_stop_zone_m
  label: "Acceleration and braking zone either side of a stop"
  group: Noise
  unit: m
  used_by: [noise corridor in the editors]
  values:
    - context: { mode: "*" }
      low: 50
      central: 100
      high: 100
      basis: cited
      sources: [cnossos-2015]
      check: unverified
      rationale: "CNOSSOS-EU applies the acceleration correction within 100 m of a signalised junction or roundabout, fading linearly; a stop is treated like a signalised junction (ADR-0038 §2)."

- key: noise.electric_road_propulsion_delta_db
  label: "Electric buses and trolleybuses: change to the propulsion noise term"
  group: Noise
  unit: dB
  used_by: [noise corridor in the editors, noise map]
  values:
    - context: { mode: "*" }
      low: -12
      central: -8
      high: -3
      basis: educated-guess
      sources: [nzta-rr703]
      check: secondary
      rationale: "PLACEHOLDER awaiting the product owner's value (asked 2026-11-03). NZTA RR 703 found electric buses about 8 dB quieter at 10 km/h and no different at 30 km/h; applying the change to the CNOSSOS propulsion term only reproduces that fade-out because rolling noise dominates with speed. CNOSSOS-EU has no electric category yet."

- key: noise.rail_squeal_r300_db
