- key: noise.ferry_berth_lw_db
  label: "Ferry at the berth: sound power of engines, auxiliaries and ramp"
  group: Noise
  unit: dB(A)
  used_by: [noise map (ferries, indicative)]
  values:
    - context: { mode: "*" }
      low: 90
      central: 100
      high: 110
      basis: educated-guess
      sources: [nomeports]
      check: unverified
      rationale: "PLACEHOLDER awaiting the product owner's value (asked 2026-11-03) and the ferry research."
