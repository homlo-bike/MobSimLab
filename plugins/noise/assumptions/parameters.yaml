- key: noise.tram_embedded_track_db
  label: "Trams on embedded street track: added to the track part of rolling noise"
  group: Noise
  unit: dB
  used_by: [noise corridor in the editors, noise map]
  values:
    - context: { mode: "*" }
      low: 0
      central: 2
      high: 5
      basis: educated-guess
      sources: [cnossos-2015, mobsimlab-derivation]
      check: unverified
      rationale: "Embedded track in paving radiates more than ballast and reflects; grass track would be quieter. CNOSSOS-EU lists embedded track (track base code T, Table 2.3.b) but gives no transfer function for it in Appendix G, so this MobSimLab correction is added to the track radiation of the ballasted track transfer function."

