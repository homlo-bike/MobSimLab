# Parameters of the cargo bike plugin (Cargo bike tab). Schema: assumptions/README.md.
# Exported to crates/cargo-bike/data/defaults.json by tools/cargo-bike/export_defaults.py.
# Savings values are German reference prices of 2024 in EUR; the tab scales them to the country of the start point.

- key: cargo_bike.bike_mass_kg
  label: Cargo bike mass
  group: Cargo bike
  unit: kg
  used_by:
    - cargo bike range
  values:
    - context:
        mode: "*"
      low: 35
      central: 35
      high: 35
      basis: documented
      sources:
        - homlo-kit-2026
      check: unverified
      rationale: Generic DIY cargo tricycle kit with battery, as specified by the product owner.
- key: cargo_bike.load_kg
  label: Load carried
  group: Cargo bike
  unit: kg
  used_by:
    - cargo bike range
  values:
    - context:
        mode: "*"
      low: 0
      central: 80
      high: 150
      basis: documented
      sources:
        - homlo-kit-2026
      check: unverified
      rationale: Default load of the kit's planning case; the load is carried both ways.
- key: cargo_bike.rider_mass_kg
  label: Rider mass
  group: Cargo bike
  unit: kg
  used_by:
    - cargo bike range
  values:
    - context:
        mode: "*"
      low: 60
      central: 90
      high: 120
      basis: documented
      sources:
        - homlo-kit-2026
      check: unverified
      rationale: Default rider of the kit's planning case.
- key: cargo_bike.battery_wh
  label: Battery capacity
  group: Cargo bike
  unit: Wh
  used_by:
    - cargo bike range
  values:
    - context:
        mode: "*"
      low: 500
      central: 900
      high: 1500
      basis: documented
      sources:
        - homlo-kit-2026
      check: unverified
      rationale: Nominal battery energy of the kit.
- key: cargo_bike.battery_usable_share
  label: Usable share of the battery
  group: Cargo bike
  unit: share
  used_by:
    - cargo bike range
  values:
    - context:
        mode: "*"
      low: 0.8
      central: 0.9
      high: 0.95
      basis: educated-guess
      sources:
        - homlo-kit-2026
      check: unverified
      rationale:
        The battery management system stops before the cells are empty and capacity falls with age and cold;
        90 % of the nominal energy is a common planning value for a battery in good condition.
- key: cargo_bike.motor_rated_w
  label: Motor power (mechanical, sustained)
  group: Cargo bike
  unit: W
  used_by:
    - cargo bike range
  values:
    - context:
        mode: "*"
      low: 250
      central: 250
      high: 500
      basis: cited
      sources:
        - eu-168-2013
        - bafang-m420
      check: unverified
      rationale:
        A pedelec motor is limited to 0.25 kW continuous rated power (Regulation (EU) 168/2013, Art. 2(2)(h));
        the Bafang M400 range is rated 250 W. Short peaks above it are not counted, so long climbs are not overestimated.
- key: cargo_bike.motor_efficiency
  label: Motor and controller efficiency
  group: Cargo bike
  unit: share
  used_by:
    - cargo bike range
  values:
    - context:
        mode: "*"
      low: 0.75
      central: 0.8
      high: 0.85
      basis: cited
      sources:
        - hollandbikeshop-m420
      check: unverified
      rationale: Retailer data sheet of the Bafang M420 gives about 80 %.
- key: cargo_bike.drivetrain_efficiency
  label: Drivetrain efficiency (chain and gears)
  group: Cargo bike
  unit: share
  used_by:
    - cargo bike range
  values:
    - context:
        mode: "*"
      low: 0.9
      central: 0.95
      high: 0.97
      basis: educated-guess
      sources:
        - tengattini-bigazzi-2018
      check: unverified
      rationale:
        A clean bicycle chain drive loses a few per cent; a tricycle's longer chain and differential lose
        a little more.
- key: cargo_bike.assist_cutoff_kmh
  label: Assistance cut-off speed
  group: Cargo bike
  unit: km/h
  used_by:
    - cargo bike range
  values:
    - context:
        mode: "*"
      low: 25
      central: 25
      high: 25
      basis: cited
      sources:
        - eu-168-2013
      check: unverified
      rationale: Pedal assistance must cut off at 25 km/h.
- key: cargo_bike.assist_share
  label: Share of the pedalling power the motor gives
  group: Cargo bike
  unit: share
  used_by:
    - cargo bike range
  values:
    - context:
        mode: "*"
      low: 0.4
      central: 0.6
      high: 0.8
      basis: educated-guess
      sources:
        - bafang-m420
      check: unverified
      rationale:
        A mid-drive in a middle assistance level gives about as much again as the rider (60 % of the total);
        the motor is capped at its rated power.
- key: cargo_bike.rider_power_w
  label: Rider's sustained pedalling power
  group: Cargo bike
  unit: W
  used_by:
    - cargo bike range
  values:
    - context:
        mode: "*"
      low: 60
      central: 100
      high: 150
      basis: educated-guess
      sources:
        - tengattini-bigazzi-2018
      check: unverified
      rationale:
        An everyday rider holds about 100 W for an hour without getting out of breath; on a climb that needs
        more the bike slows down.
- key: cargo_bike.rolling_resistance
  label: Rolling resistance coefficient
  group: Cargo bike
  unit: ratio
  used_by:
    - cargo bike range
  values:
    - context:
        mode: "*"
      low: 0.007
      central: 0.01
      high: 0.015
      basis: educated-guess
      sources:
        - tengattini-bigazzi-2018
      check: unverified
      rationale:
        Utilitarian bicycles average 0.0077; a loaded tricycle on three wider tyres, often at lower pressure,
        rolls harder.
- key: cargo_bike.drag_area_m2
  label: Drag area (Cd·A)
  group: Cargo bike
  unit: m²
  used_by:
    - cargo bike range
  values:
    - context:
        mode: "*"
      low: 0.6
      central: 0.9
      high: 1.2
      basis: educated-guess
      sources:
        - tengattini-bigazzi-2018
      check: unverified
      rationale:
        Upright city cyclists average 0.56 m²; the cargo box and its load in front of the rider add about
        half as much again.
- key: cargo_bike.air_density
  label: Air density
  group: Cargo bike
  unit: kg/m³
  used_by:
    - cargo bike range
  values:
    - context:
        mode: "*"
      low: 1.15
      central: 1.2
      high: 1.25
      basis: educated-guess
      sources:
        - tengattini-bigazzi-2018
      check: unverified
      rationale: Air at about 20 °C near sea level.
- key: cargo_bike.speed_separated_kmh
  label: Cruising speed on a separated cycle track or cycle path
  group: Cargo bike
  unit: km/h
  used_by:
    - cargo bike range
  values:
    - context:
        mode: "*"
      low: 15
      central: 20
      high: 24
      basis: educated-guess
      sources:
        - eu-168-2013
      check: unverified
      rationale: Below the 25 km/h assistance cut-off; a loaded tricycle rides steadily where it has its own track.
- key: cargo_bike.speed_lane_kmh
  label: Cruising speed in a painted bike lane
  group: Cargo bike
  unit: km/h
  used_by:
    - cargo bike range
  values:
    - context:
        mode: "*"
      low: 14
      central: 19
      high: 23
      basis: educated-guess
      sources:
        - eu-168-2013
      check: unverified
      rationale: "Slightly slower than on a separated track: parked cars, doors and turning traffic."
- key: cargo_bike.speed_quiet_kmh
  label: Cruising speed on quiet streets without a bike lane
  group: Cargo bike
  unit: km/h
  used_by:
    - cargo bike range
  values:
    - context:
        mode: "*"
      low: 12
      central: 17
      high: 22
      basis: educated-guess
      sources:
        - eu-168-2013
      check: unverified
      rationale: "Residential and service streets, tracks: junctions every block and shared space."
- key: cargo_bike.speed_mixed_kmh
  label: Cruising speed in main-road traffic without a bike lane
  group: Cargo bike
  unit: km/h
  used_by:
    - cargo bike range
  values:
    - context:
        mode: "*"
      low: 10
      central: 15
      high: 20
      basis: educated-guess
      sources:
        - eu-168-2013
      check: unverified
      rationale: A wide, slow tricycle in general traffic on main roads keeps to the kerb and is held up by traffic.
- key: cargo_bike.stops_per_km_separated
  label: Stops per km on separated cycle tracks
  group: Cargo bike
  unit: 1/km
  used_by:
    - cargo bike range
  values:
