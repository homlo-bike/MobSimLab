        mode: "*"
      low: 0.2
      central: 0.5
      high: 1
      basis: educated-guess
      sources:
        - tengattini-bigazzi-2018
      check: unverified
      rationale: Crossings with priority for the track; few stops.
- key: cargo_bike.stops_per_km_lane
  label: Stops per km in painted bike lanes
  group: Cargo bike
  unit: 1/km
  used_by:
    - cargo bike range
  values:
    - context:
        mode: "*"
      low: 0.5
      central: 1
      high: 2
      basis: educated-guess
      sources:
        - tengattini-bigazzi-2018
      check: unverified
      rationale: Junctions on main roads without a signal of their own.
- key: cargo_bike.stops_per_km_quiet
  label: Stops per km on quiet streets
  group: Cargo bike
  unit: 1/km
  used_by:
    - cargo bike range
  values:
    - context:
        mode: "*"
      low: 0.5
      central: 1.5
      high: 3
      basis: educated-guess
      sources:
        - tengattini-bigazzi-2018
      check: unverified
      rationale: Give-way and right-before-left junctions every block.
- key: cargo_bike.stops_per_km_mixed
  label: Stops per km in main-road traffic
  group: Cargo bike
  unit: 1/km
  used_by:
    - cargo bike range
  values:
    - context:
        mode: "*"
      low: 1
      central: 2.5
      high: 4
      basis: educated-guess
      sources:
        - tengattini-bigazzi-2018
      check: unverified
      rationale: Queues, turning cars and junctions in general traffic.
- key: cargo_bike.signal_stop_share
  label: Share of traffic signals that stop the bike
  group: Cargo bike
  unit: share
  used_by:
    - cargo bike range
  values:
    - context:
        mode: "*"
      low: 0.3
      central: 0.5
      high: 0.7
      basis: educated-guess
      sources:
        - tengattini-bigazzi-2018
      check: unverified
      rationale: About half of the signals on a route show red on arrival. Counted in addition to the stops per km.
- key: cargo_bike.route_factor_separated
  label: "Route choice weight: separated cycle track"
  group: Cargo bike
  unit: ratio
  used_by:
    - cargo bike range
  values:
    - context:
        mode: "*"
      low: 1
      central: 1
      high: 1
      basis: educated-guess
      sources:
        - homlo-kit-2026
      check: unverified
      rationale:
        "The route prefers streets with bike infrastructure: each metre counts this many metres. Separated
        tracks are the reference."
- key: cargo_bike.route_factor_lane
  label: "Route choice weight: painted bike lane"
  group: Cargo bike
  unit: ratio
  used_by:
    - cargo bike range
  values:
    - context:
        mode: "*"
      low: 1
      central: 1.1
      high: 1.3
      basis: educated-guess
      sources:
        - homlo-kit-2026
      check: unverified
      rationale: Accepts a 10 % detour to ride on a separated track instead of a painted lane.
- key: cargo_bike.route_factor_quiet
  label: "Route choice weight: quiet street"
  group: Cargo bike
  unit: ratio
  used_by:
    - cargo bike range
  values:
    - context:
        mode: "*"
      low: 1
      central: 1.2
      high: 1.5
      basis: educated-guess
      sources:
        - homlo-kit-2026
      check: unverified
      rationale: Accepts a 20 % detour to ride on a bike lane or track instead.
- key: cargo_bike.route_factor_mixed
  label: "Route choice weight: main road without bike lane"
  group: Cargo bike
  unit: ratio
  used_by:
    - cargo bike range
  values:
    - context:
        mode: "*"
      low: 1.2
      central: 2
      high: 3
      basis: educated-guess
      sources:
        - homlo-kit-2026
      check: unverified
      rationale:
        Avoids main-road traffic without a bike lane where a reasonable alternative exists (up to twice as
        long).
- key: cargo_bike.detour_factor
  label: Street distance over straight-line distance (range map)
  group: Cargo bike
  unit: ratio
  used_by:
    - cargo bike range
  values:
    - context:
        mode: "*"
      low: 1.1
      central: 1.3
      high: 1.5
      basis: cited
      sources:
        - boeing-2019
      check: unverified
      rationale:
        Street network circuity of cities is about 1.03–1.3; a bike route that prefers bike lanes takes a
        bit more. Used by the range map, which follows straight bearings.
- key: cargo_bike.elevation_smoothing_m
  label: Height smoothing window
  group: Cargo bike
  unit: m
  used_by:
    - cargo bike range
  values:
    - context:
        mode: "*"
      low: 50
      central: 100
      high: 200
      basis: educated-guess
      sources:
        - tengattini-bigazzi-2018
      check: unverified
      rationale:
        The Copernicus GLO-30 surface model has about ±4 m of noise and buildings and trees in it; averaging
        the heights over 100 m keeps the real hills and drops the noise.
- key: cargo_bike.savings.trips_per_week
  label: Round trips per week
  group: Cargo bike
  unit: 1/week
  used_by:
    - cargo bike savings
  values:
    - context:
        mode: "*"
      low: 1
      central: 5
      high: 14
      basis: educated-guess
      sources:
        - homlo-kit-2026
      check: unverified
      rationale: A cargo bike used for a weekday commute or delivery round; change it to the real use.
- key: cargo_bike.savings.weeks_per_year
  label: Weeks of use per year
  group: Cargo bike
  unit: weeks
  used_by:
    - cargo bike savings
  values:
    - context:
        mode: "*"
      low: 30
      central: 46
      high: 52
      basis: educated-guess
      sources:
        - homlo-kit-2026
      check: unverified
      rationale: A working year without holidays and the worst weather weeks.
- key: cargo_bike.savings.bike_price_eur
  label: Cargo bike purchase price (2024 EUR)
  group: Cargo bike
  unit: EUR
  used_by:
    - cargo bike savings
  values:
    - context:
        mode: "*"
      low: 2000
      central: 4000
      high: 8000
      basis: documented
      sources:
        - homlo-kit-2026
      check: unverified
      rationale:
        Default price of the DIY generic cargo tricycle kit; converted to the local currency at the market
        exchange rate.
- key: cargo_bike.savings.bike_lifetime_years
  label: Cargo bike lifetime
  group: Cargo bike
  unit: years
  used_by:
    - cargo bike savings
  values:
    - context:
        mode: "*"
      low: 5
      central: 8
      high: 12
      basis: educated-guess
      sources:
        - homlo-kit-2026
      check: unverified
      rationale:
        Frame and motor last about eight years of daily use; the battery is replaced once in that time (in
        the maintenance cost).
- key: cargo_bike.savings.bike_maintenance_eur
  label: Cargo bike maintenance per year (2024 EUR)
  group: Cargo bike
  unit: EUR/year
  used_by:
    - cargo bike savings
  values:
    - context:
        mode: "*"
      low: 80
      central: 200
      high: 400
      basis: educated-guess
      sources:
        - homlo-kit-2026
      check: unverified
      rationale: Chain, brake pads and tyres, one service a year and a share of a replacement battery.
- key: cargo_bike.savings.bike_insurance_eur
  label: Cargo bike insurance per year (2024 EUR)
  group: Cargo bike
  unit: EUR/year
  used_by:
    - cargo bike savings
  values:
    - context:
        mode: "*"
      low: 0
      central: 80
      high: 200
      basis: educated-guess
      sources:
        - adac-autokosten
      check: unverified
      rationale: Theft and damage cover for an e-bike in Germany costs about €50–150 a year.
- key: cargo_bike.savings.electricity_eur_kwh
  label: Household electricity price (2024 EUR)
  group: Cargo bike
  unit: EUR/kWh
  used_by:
    - cargo bike savings
  values:
    - context:
        mode: "*"
      low: 0.29
      central: 0.39
      high: 0.45
      basis: cited
      sources:
        - eurostat-electricity-2024
      check: unverified
      rationale: "Germany, second half of 2024: €39.43 per 100 kWh (EU €28.72)."
- key: cargo_bike.savings.charger_efficiency
  label: Charger efficiency
