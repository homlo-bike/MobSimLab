    - context:
        mode: "*"
      low: 12000
      central: 20000
      high: 35000
      basis: educated-guess
      sources:
        - adac-autokosten
      check: unverified
      rationale: A new small car or small van in Germany; converted to the local currency at the market exchange rate.
- key: cargo_bike.savings.car_years
  label: Years the car is kept
  group: Cargo bike
