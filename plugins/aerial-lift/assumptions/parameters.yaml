- key: ropeway.station_rope_height_m
  label: Rope height at a station
  group: Cable cars
  unit: m
  used_by:
    - profile
    - clearance check
  values:
    - context:
        mode: "*"
      low: 5
      central: 8
      high: 15
      basis: educated-guess
      sources:
        - mobsimlab-derivation
      check: unverified
      rationale: Rope height above the station's ground level where cabins enter; elevated stations are higher.
- key: ropeway.cabin_hang_m
  label: Rope to cabin bottom
  group: Cable cars
  unit: m
  used_by:
    - clearance check
  values:
    - context:
        mode: "*"
      low: 3
      central: 4
      high: 6
      basis: educated-guess
      sources:
        - mobsimlab-derivation
      check: unverified
      rationale: Hanger plus cabin height; large tricable and aerial tramway cabins hang lower.
    - context:
        mode: cable_car
        ropeway_system: 3s
      low: 4
      central: 5
      high: 6
      basis: educated-guess
      sources:
        - mobsimlab-derivation
      check: unverified
      rationale: Larger cabins (to verify).
    - context:
        mode: aerial_tramway
        ropeway_system: reversible
      low: 4
      central: 6
      high: 8
      basis: educated-guess
      sources:
        - mobsimlab-derivation
      check: unverified
      rationale: Large cabins and carriage (to verify).
- key: ropeway.sag_ratio
  label: Rope sag under load, share of span
  group: Cable cars
  unit: share
  used_by:
    - profile
    - clearance check
    - automatic towers
  values:
    - context:
        mode: "*"
      low: 0.02
      central: 0.04
      high: 0.06
      basis: educated-guess
      sources:
        - mobsimlab-derivation
      check: unverified
      rationale:
        Mid-span sag of a loaded rope as a share of the span; depends on rope tension (to verify against
        EN 12927 design practice).
- key: ropeway.station_passage_s
  label: Time through an intermediate station
  group: Cable cars
  unit: s
  used_by:
    - running time
    - stopping pattern
  values:
    - context:
        mode: "*"
      low: 20
      central: 45
      high: 90
      basis: educated-guess
      sources:
        - mobsimlab-derivation
      check: unverified
      rationale:
        A detached cabin slows to platform speed, passes the platform and reattaches; for an aerial tramway
        this is the acceleration and braking loss per trip.
    - context:
        mode: cable_car
        ropeway_system: 3s
      low: 40
      central: 60
      high: 90
      basis: educated-guess
      sources:
        - mobsimlab-derivation
      check: unverified
      rationale: Longer platforms for large cabins (to verify).
    - context:
        mode: cable_car
        ropeway_system: pulsed
      low: 30
      central: 60
      high: 90
      basis: educated-guess
      sources:
        - mobsimlab-derivation
      check: unverified
      rationale: The rope stops while cabins are in the station (to verify).
    - context:
        mode: aerial_tramway
        ropeway_system: reversible
      low: 20
      central: 30
      high: 60
      basis: educated-guess
      sources:
        - mobsimlab-derivation
      check: unverified
      rationale: Acceleration and braking loss of a shuttle trip (to verify).
