        ropeway_system: 2s
      low: 15
      central: 17
      high: 17
      basis: educated-guess
      sources:
        - mobsimlab-derivation
      check: unverified
      rationale: "R1 §1.2: 15 to 17 places."
    - context:
        mode: cable_car
        ropeway_system: 3s
      low: 30
      central: 32
      high: 35
      basis: educated-guess
      sources:
        - mobsimlab-derivation
      check: unverified
      rationale: "R1 §1.2: 30 to 35 places."
    - context:
        mode: cable_car
        ropeway_system: funitel
      low: 20
      central: 24
      high: 30
      basis: educated-guess
      sources:
        - mobsimlab-derivation
      check: unverified
      rationale: "R1 §1.2: 20 to 30 places."
    - context:
        mode: cable_car
        ropeway_system: pulsed
      low: 4
      central: 8
      high: 15
      basis: educated-guess
      sources:
        - mobsimlab-derivation
      check: unverified
      rationale: "R1 §1.2: 4 to 15 places."
    - context:
        mode: aerial_tramway
        ropeway_system: reversible
      low: 30
      central: 80
      high: 200
      basis: educated-guess
      sources:
        - mobsimlab-derivation
      check: unverified
      rationale: "R1 §1.2: 30 to 200 places; urban commuter trams carry about 80 (to verify)."
- key: ropeway.max_span_m
  label: Span between supports, maximum
  group: Cable cars
  unit: m
  used_by:
    - span check
    - automatic towers
  values:
    - context:
        mode: "*"
      low: 150
      central: 400
      high: 3000
      basis: educated-guess
      sources:
        - mobsimlab-derivation
      check: unverified
      rationale: "R1 §1.5: a few hundred metres for monocable systems, over 1 km for tricable systems."
    - context:
        mode: cable_car
        ropeway_system: mgd
      low: 270
      central: 400
      high: 900
      basis: documented
      sources:
        - telecabine-lisboa-tech
        - poma-nizhny-novgorod
        - mobsimlab-derivation
      check: unverified
      rationale:
        "Longest span between two supports that the automatic towers may use. Urban monocable gondolas mostly
        span a few hundred metres: Lisbon's longest is 270 m. Nizhny Novgorod spans 900 m over the Volga, the
        longest for an 8-seat gondola, on two towers over 80 m. The central value is a planning default; a
        longer span needs taller towers for the rope sag."
    - context:
        mode: cable_car
        ropeway_system: 2s
      low: 500
      central: 800
      high: 1200
      basis: educated-guess
      sources:
        - mobsimlab-derivation
      check: unverified
      rationale: Separate carrying rope allows longer spans than MGD (to verify).
    - context:
        mode: cable_car
        ropeway_system: 3s
      low: 1000
      central: 1500
      high: 3000
      basis: documented
      sources:
        - peak-2-peak-span
        - mobsimlab-derivation
      check: unverified
      rationale:
        "R1 §1.2: long spans of 1 to 3 km, few towers. Peak 2 Peak (Whistler) spans 3,024 m between towers,
        the longest of any 3S."
    - context:
        mode: cable_car
        ropeway_system: funitel
      low: 400
      central: 600
      high: 800
      basis: educated-guess
      sources:
        - mobsimlab-derivation
      check: unverified
      rationale: Two haul ropes; between MGD and 2S (to verify).
    - context:
        mode: cable_car
        ropeway_system: pulsed
      low: 150
      central: 300
      high: 400
      basis: educated-guess
      sources:
        - mobsimlab-derivation
      check: unverified
      rationale: Light fixed-grip systems (to verify).
    - context:
        mode: aerial_tramway
        ropeway_system: reversible
      low: 800
      central: 1500
      high: 3000
      basis: educated-guess
      sources:
        - mobsimlab-derivation
      check: unverified
      rationale: Track ropes allow long spans (to verify).
- key: ropeway.max_station_angle_deg
  label: Direction change in a station, maximum
  group: Cable cars
  unit: °
  used_by:
    - station angle check
  values:
    - context:
        mode: "*"
      low: 0
      central: 30
      high: 90
      basis: educated-guess
      sources:
        - mobsimlab-derivation
      check: unverified
      rationale: Detachable lines change direction only in stations; how much depends on the station's bullwheels.
    - context:
        mode: cable_car
        ropeway_system: mgd
      low: 20
      central: 45
      high: 90
      basis: educated-guess
      sources:
        - mobsimlab-derivation
      check: unverified
      rationale:
        Angle stations of monocable lines turn the rope round horizontal sheaves; urban lines turn up to
        about 90° (to verify).
    - context:
        mode: cable_car
        ropeway_system: 2s
      low: 10
      central: 30
      high: 60
      basis: educated-guess
      sources:
        - mobsimlab-derivation
      check: unverified
      rationale: Carrying ropes end in the station; deflection is limited by the cabin rail (to verify).
    - context:
        mode: cable_car
        ropeway_system: 3s
      low: 10
      central: 20
      high: 30
      basis: educated-guess
      sources:
        - mobsimlab-derivation
      check: unverified
      rationale: Angle stations on tricable lines are rare and expensive (to verify).
    - context:
        mode: cable_car
        ropeway_system: funitel
      low: 10
      central: 30
      high: 60
      basis: educated-guess
      sources:
        - mobsimlab-derivation
      check: unverified
      rationale: As 2S (to verify).
    - context:
        mode: cable_car
        ropeway_system: pulsed
      low: 0
      central: 20
      high: 45
      basis: educated-guess
      sources:
        - mobsimlab-derivation
      check: unverified
      rationale: Fixed grips; small deflections only (to verify).
    - context:
        mode: aerial_tramway
        ropeway_system: reversible
      low: 0
      central: 0
      high: 0
      basis: educated-guess
      sources:
        - mobsimlab-derivation
      check: unverified
      rationale: Aerial tramways run straight between the terminals.
- key: ropeway.min_clearance_m
  label: Clearance under the loaded cabin, minimum
  group: Cable cars
  unit: m
  used_by:
    - clearance check (error below this)
  values:
    - context:
        mode: "*"
      low: 3
      central: 5
      high: 8
      basis: documented
      sources:
        - en-12929-1
      check: unverified
      rationale:
        EN 12929-1 sets the minimum distance between the lowest point of a loaded cabin and the ground, roads
        and buildings; exact values to verify against the clause and national rules.
- key: ropeway.recommended_clearance_m
  label: Clearance under the loaded cabin, recommended
  group: Cable cars
  unit: m
  used_by:
    - clearance check (warning below this)
    - automatic towers
  values:
    - context:
        mode: "*"
      low: 5
      central: 8
      high: 15
      basis: educated-guess
      sources:
        - mobsimlab-derivation
      check: unverified
      rationale: Margin over the minimum for swing in wind, snow and rescue access; automatic towers keep it.
- key: ropeway.station_approach_m
  label: Station approach, length
  group: Cable cars
  unit: m
  used_by:
    - clearance check
    - automatic towers
  values:
    - context:
        mode: "*"
      low: 10
      central: 30
      high: 60
      basis: educated-guess
      sources:
        - mobsimlab-derivation
      check: unverified
      rationale:
        Where cabins leave and enter a station they are close to platform height over the station's fenced
        approach. Within this distance of a station the cabin only has to clear the ground and buildings;
        beyond it the minimum and recommended clearances apply. To verify against EN 12929-1 (clearance
        profile and passageways) and the station design.
