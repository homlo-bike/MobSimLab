- key: ropeway.station_rope_height_m
  label: Rope height at a station
  group: Cable cars
  unit: m
  used_by:
  - profile
  - clearance check
  values:
  - context:
      mode: '*'
    low: 5
    central: 8
    high: 15
    basis: educated-guess
    sources:
    - mobsimlab-derivation
    check: unverified
    rationale: Rope height above the station's ground level where cabins enter; elevated stations are higher.
- key: ropeway.cabin_hang_m
  label: Rope to cabin bottom
  group: Cable cars
  unit: m
  used_by:
  - clearance check
  values:
  - context:
      mode: '*'
    low: 3
    central: 4
    high: 6
    basis: educated-guess
    sources:
    - mobsimlab-derivation
    check: unverified
    rationale: Hanger plus cabin height; large tricable and aerial tramway cabins hang lower.
  - context:
      mode: cable_car
      ropeway_system: 3s
    low: 4
    central: 5
    high: 6
    basis: educated-guess
    sources:
    - mobsimlab-derivation
    check: unverified
    rationale: Larger cabins (to verify).
  - context:
      mode: aerial_tramway
      ropeway_system: reversible
    low: 4
    central: 6
    high: 8
    basis: educated-guess
    sources:
    - mobsimlab-derivation
    check: unverified
    rationale: Large cabins and carriage (to verify).
- key: ropeway.sag_ratio
  label: Rope sag under load, share of span
  group: Cable cars
  unit: share
  used_by:
  - profile
  - clearance check
  - automatic towers
  values:
  - context:
      mode: '*'
    low: 0.02
    central: 0.04
    high: 0.06
    basis: educated-guess
    sources:
    - mobsimlab-derivation
    check: unverified
    rationale: Mid-span sag of a loaded rope as a share of the span; depends on rope tension (to verify against
      EN 12927 design practice).
- key: ropeway.station_passage_s
  label: Time through an intermediate station
  group: Cable cars
  unit: s
  used_by:
  - running time
  - stopping pattern
  values:
  - context:
      mode: '*'
    low: 20
    central: 45
    high: 90
    basis: educated-guess
    sources:
    - mobsimlab-derivation
    check: unverified
    rationale: A detached cabin slows to platform speed, passes the platform and reattaches; for an aerial tramway
      this is the acceleration and braking loss per trip.
  - context:
      mode: cable_car
      ropeway_system: 3s
    low: 40
    central: 60
    high: 90
    basis: educated-guess
    sources:
    - mobsimlab-derivation
    check: unverified
    rationale: Longer platforms for large cabins (to verify).
  - context:
      mode: cable_car
      ropeway_system: pulsed
    low: 30
    central: 60
    high: 90
    basis: educated-guess
    sources:
    - mobsimlab-derivation
    check: unverified
    rationale: The rope stops while cabins are in the station (to verify).
  - context:
      mode: aerial_tramway
      ropeway_system: reversible
    low: 20
    central: 30
    high: 60
    basis: educated-guess
    sources:
    - mobsimlab-derivation
    check: unverified
    rationale: Acceleration and braking loss of a shuttle trip (to verify).
- key: ropeway.terminal_dwell_s
  label: Boarding time at an aerial tramway terminal
  group: Cable cars
  unit: s
  used_by:
  - shuttle cycle
  - capacity
  values:
  - context:
      mode: '*'
    low: 30
    central: 60
    high: 120
    basis: educated-guess
    sources:
    - mobsimlab-derivation
    check: unverified
    rationale: Doors, boarding and alighting of a large cabin.
- key: ropeway.reserve_share
  label: Spare cabins, share of cabins on the line
  group: Cable cars
  unit: share
  used_by:
  - cabin count
  values:
  - context:
      mode: '*'
    low: 0.05
    central: 0.1
    high: 0.15
    basis: educated-guess
    sources:
    - mobsimlab-derivation
    check: unverified
    rationale: Cabins kept in the garage for maintenance and peak boosts.
- key: ropeway.wind_slow_kmh
  label: Wind speed at which the line slows down
  group: Cable cars
  unit: km/h
  used_by:
  - weather scenarios (planned, ADR-0037 §5a)
  values:
  - context:
      mode: '*'
    low: 40
    central: 60
    high: 80
    basis: documented
    sources:
    - wandernundmehr-wind
    check: unverified
    rationale: 'R1 §1.4: slow-down at about 60 to 70 km/h, depending on technology and site.'
  - context:
      mode: cable_car
      ropeway_system: mgd
    low: 60
    central: 70
    high: 70
    basis: cited
    sources:
    - idfm-cable-c1
    check: unverified
    rationale: Câble C1 (MGD) slows above 70 km/h.
  - context:
      mode: cable_car
      ropeway_system: 3s
    low: 70
    central: 80
    high: 100
    basis: documented
    sources:
    - wandernundmehr-wind
    check: unverified
    rationale: Tricable systems tolerate more wind (to verify).
- key: ropeway.wind_stop_kmh
  label: Wind speed at which the line stops
  group: Cable cars
  unit: km/h
  used_by:
  - weather scenarios (planned, ADR-0037 §5a)
  values:
  - context:
      mode: '*'
    low: 60
    central: 80
    high: 110
    basis: documented
    sources:
    - wandernundmehr-wind
    check: unverified
    rationale: 'R1 §1.4: stop at about 60 to 110 km/h depending on technology and site.'
  - context:
      mode: cable_car
      ropeway_system: mgd
    low: 60
    central: 90
    high: 90
    basis: cited
    sources:
    - idfm-cable-c1
    check: unverified
    rationale: Câble C1 (MGD) stops above 90 km/h with replacement buses; other MGDs stop at 60 to 70 km/h (wandernundmehr.at).
  - context:
      mode: cable_car
      ropeway_system: 3s
    low: 90
    central: 100
    high: 110
    basis: documented
    sources:
    - wandernundmehr-wind
    check: unverified
    rationale: Up to about 100 to 110 km/h.
- key: ropeway.capacity_ceiling_pphpd
  label: Capacity ceiling of any ropeway
  group: Cable cars
  unit: p/h/dir
  used_by:
  - capacity check
  values:
  - context:
      mode: '*'
    low: 4500
    central: 6000
    high: 8000
    basis: documented
    sources:
    - doppelmayr-urban-faq
    check: unverified
    rationale: 'R1 §1.2: about 6,000 p/h/dir for any ropeway; Doppelmayr TRI-Line claims up to 8,000.'
