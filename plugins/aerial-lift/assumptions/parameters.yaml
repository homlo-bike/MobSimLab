        mode: "*"
      low: 30
      central: 60
      high: 120
      basis: educated-guess
      sources:
        - mobsimlab-derivation
      check: unverified
      rationale: Doors, boarding and alighting of a large cabin.
- key: ropeway.reserve_share
  label: Spare cabins, share of cabins on the line
  group: Cable cars
  unit: share
  used_by:
    - cabin count
  values:
    - context:
        mode: "*"
      low: 0.05
      central: 0.1
      high: 0.15
      basis: educated-guess
      sources:
        - mobsimlab-derivation
      check: unverified
      rationale: Cabins kept in the garage for maintenance and peak boosts.
- key: ropeway.wind_slow_kmh
  label: Wind speed at which the line slows down
  group: Cable cars
  unit: km/h
  used_by:
    - weather scenarios (planned, ADR-0037 §5a)
  values:
    - context:
        mode: "*"
      low: 40
      central: 60
      high: 80
      basis: documented
      sources:
        - wandernundmehr-wind
      check: unverified
      rationale: "R1 §1.4: slow-down at about 60 to 70 km/h, depending on technology and site."
    - context:
        mode: cable_car
        ropeway_system: mgd
      low: 60
      central: 70
      high: 70
      basis: cited
      sources:
        - idfm-cable-c1
      check: unverified
      rationale: Câble C1 (MGD) slows above 70 km/h.
    - context:
        mode: cable_car
        ropeway_system: 3s
      low: 70
      central: 80
      high: 100
      basis: documented
      sources:
        - wandernundmehr-wind
      check: unverified
      rationale: Tricable systems tolerate more wind (to verify).
- key: ropeway.wind_stop_kmh
  label: Wind speed at which the line stops
  group: Cable cars
  unit: km/h
  used_by:
    - weather scenarios (planned, ADR-0037 §5a)
  values:
    - context:
        mode: "*"
      low: 60
      central: 80
      high: 110
      basis: documented
      sources:
        - wandernundmehr-wind
      check: unverified
      rationale: "R1 §1.4: stop at about 60 to 110 km/h depending on technology and site."
    - context:
        mode: cable_car
        ropeway_system: mgd
      low: 60
      central: 90
      high: 90
      basis: cited
      sources:
        - idfm-cable-c1
      check: unverified
      rationale: Câble C1 (MGD) stops above 90 km/h with replacement buses; other MGDs stop at 60 to 70 km/h (wandernundmehr.at).
    - context:
        mode: cable_car
        ropeway_system: 3s
      low: 90
      central: 100
      high: 110
      basis: documented
      sources:
        - wandernundmehr-wind
      check: unverified
      rationale: Up to about 100 to 110 km/h.
- key: ropeway.capacity_ceiling_pphpd
  label: Capacity ceiling of any ropeway
  group: Cable cars
  unit: p/h/dir
  used_by:
    - capacity check
  values:
    - context:
        mode: "*"
      low: 4500
      central: 6000
      high: 8000
      basis: documented
      sources:
        - doppelmayr-urban-faq
      check: unverified
      rationale: "R1 §1.2: about 6,000 p/h/dir for any ropeway; Doppelmayr TRI-Line claims up to 8,000."
- key: ropeway.cost.station_each
  label: Cable car station
  group: Cable car costs
  unit: US$ million per station (2023, PPP)
  used_by:
    - "construction cost: stations"
  values:
    - context:
        mode: "*"
      low: 8
      central: 13
      high: 25
      basis: documented
      sources:
