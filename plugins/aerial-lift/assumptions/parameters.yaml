# Parameters of the aerial-lift plugin (assumptions/README.md format), with the context keys
# `mode` (cable_car, aerial_tramway) and `ropeway_system`. Every entry starts unverified; the values come from Research R1
# (docs/research/r1-cable-car-and-ferry.md). Checked by tools/plugins/check.py.

- key: ropeway.line_speed_ms
  label: Line speed
  group: Cable cars
  unit: m/s
  used_by:
    - running time
    - cabin spacing
    - cabin count
  values:
    - context:
        mode: "*"
      low: 3
      central: 5
      high: 12
      basis: educated-guess
      sources:
        - mobsimlab-derivation
      check: unverified
      rationale: Fallback spanning pulsed gondolas to aerial tramways; every system has its own entry.
    - context:
        mode: cable_car
        ropeway_system: mgd
      low: 5
      central: 6
      high: 6
      basis: documented
      sources:
        - poma-urban-brochure
      check: unverified
      rationale:
        "R1 §1.2: monocable detachable gondolas run up to about 6 m/s; urban lines often run slower off-peak
        to save energy."
    - context:
        mode: cable_car
        ropeway_system: 2s
      low: 6
      central: 6.5
      high: 7
      basis: educated-guess
      sources:
        - mobsimlab-derivation
      check: unverified
      rationale: "R1 §1.2: about 6 to 7 m/s (to verify)."
    - context:
        mode: cable_car
        ropeway_system: 3s
      low: 6
      central: 7.5
      high: 8.5
      basis: educated-guess
      sources:
        - mobsimlab-derivation
      check: unverified
      rationale: "R1 §1.2: up to 7.5 to 8.5 m/s (to verify)."
    - context:
        mode: cable_car
        ropeway_system: funitel
      low: 6
      central: 6.5
      high: 7
      basis: educated-guess
      sources:
        - mobsimlab-derivation
      check: unverified
      rationale: "R1 §1.2: about 6 to 7 m/s."
    - context:
        mode: cable_car
        ropeway_system: pulsed
      low: 4
      central: 4.5
      high: 5
      basis: educated-guess
      sources:
        - mobsimlab-derivation
      check: unverified
      rationale: "R1 §1.2: 4 to 5 m/s."
    - context:
        mode: aerial_tramway
        ropeway_system: reversible
      low: 8
      central: 10
      high: 12
      basis: educated-guess
      sources:
        - mobsimlab-derivation
      check: unverified
      rationale: "R1 §1.2: up to 10 to 12 m/s (to verify)."
- key: ropeway.cabin_interval_s
  label: Cabin interval
  group: Cable cars
  unit: s
  used_by:
    - capacity
    - cabin count
    - published timetable headway
  values:
    - context:
        mode: "*"
      low: 8
      central: 12
      high: 60
      basis: educated-guess
      sources:
        - mobsimlab-derivation
      check: unverified
      rationale: "R1 §1.2: a continuous gondola runs a cabin every 8 to 30 s; pulsed groups are further apart."
    - context:
        mode: cable_car
        ropeway_system: mgd
      low: 8
      central: 12
      high: 30
      basis: documented
      sources:
        - poma-urban-brochure
      check: unverified
      rationale: "R1 §1.2 example: 10-place cabins every 12 s at 6 m/s give 3,000 p/h/dir."
    - context:
        mode: cable_car
        ropeway_system: 2s
      low: 15
      central: 20
      high: 30
      basis: educated-guess
      sources:
        - mobsimlab-derivation
      check: unverified
      rationale: "17-place cabins at about 3,000 p/h/dir: 17 × 3600 / 3000 ≈ 20 s."
    - context:
        mode: cable_car
        ropeway_system: 3s
      low: 20
      central: 25
      high: 40
      basis: educated-guess
      sources:
        - mobsimlab-derivation
      check: unverified
      rationale: "32-place cabins at about 5,000 p/h/dir: 32 × 3600 / 5000 ≈ 23 s; 25 s with margin."
    - context:
        mode: cable_car
        ropeway_system: funitel
      low: 20
      central: 25
      high: 35
      basis: educated-guess
      sources:
        - mobsimlab-derivation
      check: unverified
      rationale: "24-place cabins at about 3,500 p/h/dir: 24 × 3600 / 3500 ≈ 25 s."
    - context:
        mode: cable_car
        ropeway_system: pulsed
      low: 30
      central: 60
      high: 120
      basis: educated-guess
      sources:
        - mobsimlab-derivation
      check: unverified
      rationale: Groups of fixed-grip cabins; the rope stops while a group is in the stations.
