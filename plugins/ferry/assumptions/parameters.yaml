# Parameters of the ferry plugin (assumptions/README.md format), with the context keys
# `mode` (ferry) and `vessel_type`. Every entry starts unverified; the values come from Research R1
# (docs/research/r1-cable-car-and-ferry.md). Checked by tools/plugins/check.py.

- key: ferry.service_speed_kn
  label: Service speed
  group: Ferries
  unit: kn
  used_by:
    - running time
  values:
    - context:
        mode: "*"
      low: 8
      central: 12
      high: 35
      basis: educated-guess
      sources:
        - mobsimlab-derivation
      check: unverified
      rationale: "R1 §2.1: water buses run 8 to 25 knots, commuter fast ferries 25 to 35."
    - context:
        mode: ferry
        vessel_type: monohull
      low: 8
      central: 12
      high: 15
      basis: educated-guess
      sources:
        - mobsimlab-derivation
      check: unverified
      rationale: River and harbour water buses (to verify).
    - context:
        mode: ferry
        vessel_type: catamaran
      low: 20
      central: 25
      high: 35
      basis: educated-guess
      sources:
        - mobsimlab-derivation
      check: unverified
      rationale: "R1 §2.1: commuter fast ferries, 25 to 35 knots."
    - context:
        mode: ferry
        vessel_type: hydrofoil
      low: 18
      central: 22
      high: 30
      basis: documented
      sources:
        - candela-p12-techcrunch
      check: unverified
      rationale:
        Electric hydrofoils such as the Candela P-12, about 25 knots top speed (to verify); service speed
        somewhat lower.
- key: ferry.berthing_s
  label: Berthing manoeuvre per call
  group: Ferries
  unit: s
  used_by:
    - running time
  values:
    - context:
        mode: "*"
      low: 60
      central: 120
      high: 300
      basis: documented
      sources:
        - tcrp-238
      check: unverified
      rationale: Approach, mooring and leaving per call; TCRP Report 238 treats manoeuvring time (values to verify).
    - context:
        mode: ferry
        vessel_type: hydrofoil
      low: 60
      central: 90
      high: 180
      basis: educated-guess
      sources:
        - mobsimlab-derivation
      check: unverified
      rationale: Small vessel, quick to moor (to verify).
- key: ferry.boarding_pax_per_min_per_gangway
  label: Boarding rate per gangway
  group: Ferries
  unit: passengers/min
  used_by:
    - dwell
  values:
    - context:
        mode: "*"
      low: 15
      central: 30
      high: 50
      basis: documented
      sources:
        - tcrp-238
      check: unverified
      rationale: TCRP Report 238 treats gangway throughput as the capacity limit at busy terminals (values to verify).
- key: ferry.min_dwell_s
  label: Dwell at a call, minimum
  group: Ferries
  unit: s
  used_by:
    - dwell
    - layover
  values:
    - context:
        mode: "*"
      low: 30
      central: 60
      high: 120
      basis: educated-guess
      sources:
        - mobsimlab-derivation
      check: unverified
      rationale: Gangway out and in, with few passengers.
- key: ferry.passenger_capacity
  label: Passengers per vessel
  group: Ferries
  unit: passengers
  used_by:
    - capacity
    - dwell check
  values:
    - context:
        mode: "*"
      low: 20
      central: 250
      high: 600
      basis: educated-guess
      sources:
        - mobsimlab-derivation
      check: unverified
      rationale: Fallback; use the vessel's certified capacity once the catalogue has ferries.
    - context:
        mode: ferry
        vessel_type: monohull
      low: 100
      central: 250
      high: 600
      basis: educated-guess
      sources:
        - mobsimlab-derivation
      check: unverified
      rationale: Harbour and river water buses (to verify).
    - context:
        mode: ferry
        vessel_type: catamaran
      low: 150
      central: 300
      high: 450
      basis: educated-guess
      sources:
        - mobsimlab-derivation
      check: unverified
      rationale: Commuter catamarans (to verify).
    - context:
        mode: ferry
        vessel_type: hydrofoil
      low: 20
      central: 30
      high: 50
      basis: cited
      sources:
        - candela-p12-techcrunch
      check: unverified
      rationale: "Candela P-12: 30 passengers."
- key: ferry.air_draft_m
  label: Air draft (height above the waterline)
  group: Ferries
  unit: m
  used_by:
    - bridge check
  values:
    - context:
        mode: "*"
      low: 3
      central: 6
      high: 15
      basis: educated-guess
      sources:
        - mobsimlab-derivation
      check: unverified
      rationale: Fallback; use the vessel's own air draft once the catalogue has ferries.
    - context:
        mode: ferry
        vessel_type: monohull
      low: 3
      central: 6
      high: 12
      basis: educated-guess
      sources:
        - mobsimlab-derivation
      check: unverified
      rationale: City water buses pass under low river bridges, often 4 to 8 m above the water (to verify).
    - context:
        mode: ferry
        vessel_type: catamaran
      low: 4
      central: 7
      high: 12
      basis: educated-guess
      sources:
        - mobsimlab-derivation
      check: unverified
      rationale: Commuter catamarans with an enclosed upper deck (to verify).
    - context:
        mode: ferry
        vessel_type: hydrofoil
      low: 2.5
      central: 3.5
      high: 5
      basis: educated-guess
      sources:
        - mobsimlab-derivation
      check: unverified
      rationale: Small electric hydrofoils such as the Candela P-12, a single low cabin (to verify).
- key: ferry.draught_m
  label: Draught (depth below the waterline)
  group: Ferries
  unit: m
  used_by:
    - depth check
  values:
    - context:
        mode: "*"
      low: 0.8
      central: 1.8
      high: 3.5
      basis: educated-guess
      sources:
        - mobsimlab-derivation
      check: unverified
      rationale: Fallback; use the vessel's own draught once the catalogue has ferries.
    - context:
        mode: ferry
        vessel_type: monohull
      low: 1
      central: 1.8
      high: 3
      basis: educated-guess
      sources:
        - mobsimlab-derivation
      check: unverified
      rationale: Harbour and river water buses (to verify).
    - context:
        mode: ferry
        vessel_type: catamaran
      low: 1.2
      central: 1.6
      high: 2.5
      basis: educated-guess
      sources:
        - mobsimlab-derivation
      check: unverified
      rationale: Commuter catamarans draw little water for their size (to verify).
    - context:
        mode: ferry
        vessel_type: hydrofoil
      low: 0.8
      central: 1.2
      high: 2
      basis: educated-guess
      sources:
        - mobsimlab-derivation
      check: unverified
      rationale: With the foils down, at the pier and at low speed (to verify).
- key: ferry.under_keel_clearance_m
  label: Water kept under the keel
  group: Ferries
  unit: m
  used_by:
    - depth check
  values:
    - context:
        mode: "*"
      low: 0.5
      central: 1
      high: 2
      basis: educated-guess
      sources:
        - mobsimlab-derivation
      check: unverified
      rationale: "Margin under the keel for squat, waves and the tide; GEBCO’s grid of about 450 m smooths out shoals, so the depth check keeps 1 m (educated guess)."
- key: ferry.harbour_speed_kn
  label: Speed limit in a new speed zone
  group: Ferries
  unit: kn
  used_by:
    - speed zones
  values:
    - context:
        mode: "*"
      low: 4
      central: 6
      high: 8
      basis: educated-guess
      sources:
        - mobsimlab-derivation
      check: unverified
      rationale: Typical harbour and wash-restricted limits; each zone can have its own.
- key: ferry.layover_s
  label: Layover at the ends of a line, minimum
  group: Ferries
  unit: s
  used_by:
    - vessel blocks
    - berth check
  values:
    - context:
        mode: "*"
      low: 180
      central: 300
      high: 600
      basis: educated-guess
      sources:
        - mobsimlab-derivation
      check: unverified
      rationale: Recovery time plus turning the vessel round.
- key: ferry.pax_per_call_share
  label: Passengers on and off at the busiest call, share of capacity
  group: Ferries
  unit: share
  used_by:
    - dwell
  values:
    - context:
        mode: "*"
      low: 0.2
      central: 0.5
      high: 1.0
      basis: educated-guess
      sources:
        - mobsimlab-derivation
      check: unverified
      rationale: "Planning value until demand is modelled: half a vessel load changes at the busiest call."
- key: ferry.wave_limit_hs_m
  label: Significant wave height limit
  group: Ferries
  unit: m
  used_by:
    - weather scenarios (planned, ADR-0037 §5a)
  values:
    - context:
        mode: "*"
      low: 0.5
      central: 1.5
      high: 3
      basis: educated-guess
      sources:
        - mobsimlab-derivation
      check: unverified
      rationale: Each vessel class has its own limit; Directive 2009/45/EC sea areas C and D use 2.5 m and 1.5 m.
    - context:
        mode: ferry
        vessel_type: monohull
      low: 1
      central: 1.5
      high: 2.5
      basis: educated-guess
      sources:
        - mobsimlab-derivation
      check: unverified
      rationale: (to verify)
    - context:
        mode: ferry
        vessel_type: catamaran
      low: 1.5
      central: 2
      high: 3
      basis: educated-guess
      sources:
        - mobsimlab-derivation
      check: unverified
      rationale: (to verify)
    - context:
        mode: ferry
        vessel_type: hydrofoil
      low: 0.5
      central: 1
      high: 1.5
      basis: educated-guess
      sources:
        - mobsimlab-derivation
      check: unverified
      rationale: (to verify)
- key: ferry.reserve_share
  label: Reserve vessels, share of the vessels in service
  group: Ferries
  unit: share
  used_by:
    - fleet
  values:
    - context:
        mode: "*"
      low: 0.1
      central: 0.2
      high: 0.34
      basis: educated-guess
      sources:
        - mobsimlab-derivation
      check: unverified
      rationale: Vessels spend weeks a year in dry dock and surveys; a small fleet needs one spare, so 1 in 3 to 1 in 10.
- key: ferry.cost.pier_each
  label: Ferry pier
  group: Ferry costs
  unit: US$ million per pier (2023, PPP)
  used_by:
    - "construction cost: stations"
  values:
    - context:
        mode: "*"
      low: 1
      central: 4
      high: 10
      basis: documented
      sources:
        - nycedc-ferry-landings
        - mobsimlab-derivation
      check: unverified
      rationale:
        "Floating landing (barge or pontoon), gangway, piles, canopy and waiting area, before design (15 %) and
        contingency (25 %). NYC Ferry's US$55 M for 10 new landings and upgrades (2017) is about US$5.5 M a
        landing; a simple pontoon on a quay is about US$1 M, a terminal building with several berths over US$10 M."
- key: ferry.cost.vessel_each
  label: Ferry vessel
  group: Ferry costs
  unit: US$ million each (2023, market)
  used_by:
    - "construction cost: vehicles"
  values:
    - context:
        mode: "*"
      low: 2
      central: 6
      high: 16
      basis: documented
      sources:
        - nyc-ferry-vessel-cost
        - weta-kvichak-contract
        - mobsimlab-derivation
      check: unverified
      rationale: Fallback across vessel types; the vessel type's own value applies.
    - context:
        mode: ferry
        vessel_type: monohull
      low: 2
      central: 4
      high: 8
      basis: documented
      sources:
        - nyc-ferry-vessel-cost
      check: unverified
      rationale:
        "NYC Ferry's 149-passenger aluminium boats cost close to US$4 M each (2016–2020); larger 350-passenger
        boats and inflation since then point to the high end."
    - context:
        mode: ferry
        vessel_type: catamaran
      low: 8
      central: 15
      high: 20
      basis: documented
      sources:
        - weta-kvichak-contract
        - weta-mavrik-contract
      check: unverified
      rationale:
        "San Francisco Bay Ferry: US$32 M for two 400-passenger 27-knot catamarans (Kvichak) and US$30 M for two
        320-passenger 36-knot ones (Mavrik), about US$15–16 M each."
    - context:
        mode: ferry
        vessel_type: hydrofoil
      low: 2
      central: 2.7
      high: 3.5
      basis: documented
      sources:
        - candela-p12-price
      check: unverified
      rationale: "Candela P-12 Shuttle (30 passengers, electric): listed at €1.7 M to €2.5 M."
- key: ferry.cost.vessel_hour
  label: Ferry crew, fuel and running repairs per vessel-hour
  group: Ferry costs
  unit: US$ per hour (2023, PPP)
  used_by:
    - "operating cost: service"
  values:
    - context:
        mode: "*"
      low: 450
      central: 900
      high: 2000
      basis: documented
      sources:
        - ntd-ferry-agency-profiles
        - mobsimlab-derivation
      check: unverified
      rationale:
        "US ferry operators report US$490 (BillyBey), US$850–1,010 (NY Waterway), US$690–1,170 (NYC Ferry) and
        US$2,410 (Steamship Authority) of operating expense per vessel revenue hour (FTA agency profiles,
        2017–2021). Overheads and upkeep are added on top, so the central value is below the NYC Ferry figure."
    - context:
        mode: ferry
        vessel_type: catamaran
      low: 700
      central: 1200
      high: 2400
      basis: documented
      sources:
        - ntd-ferry-agency-profiles
        - mobsimlab-derivation
      check: unverified
      rationale: Fast catamarans burn several hundred litres of fuel an hour; the upper part of the US range.
    - context:
        mode: ferry
        vessel_type: hydrofoil
      low: 150
      central: 300
      high: 500
      basis: educated-guess
      sources:
        - candela-p12-price
        - mobsimlab-derivation
      check: unverified
      rationale:
        Two crew and electricity at about 2 kWh per km; Candela claims running costs far below a diesel boat of
        the same size.
