# MobSimLab: exactly two containers (ADR-0003).
# First run:  deploy/scripts/init-secrets && cp .env.example .env  (edit MOBSIMLAB_PUBLIC_URL)
#             docker compose up -d
# The only secret file you must create is the database password (db_password). master_key and session_secret are
# optional: add them as secrets only if you want to provide them (see .env.example).
# Keep your secret files somewhere else? Set MOBSIMLAB_SECRETS_PATH in .env; do not edit the /run/secrets paths below,
# they are where Docker puts the files inside the containers.
name: mobsimlab

services:
  mobsimlab:
    image: ${MOBSIMLAB_IMAGE:-ghcr.io/homlo-bike/mobsimlab:${MOBSIMLAB_VERSION:-latest}}
    build: { context: ., dockerfile: deploy/Dockerfile }
    container_name: mobsimlab
    ports: ["${MOBSIMLAB_BIND:-127.0.0.1}:8080:8080"]
    environment:
      MOBSIMLAB_PUBLIC_URL: ${MOBSIMLAB_PUBLIC_URL:?set MOBSIMLAB_PUBLIC_URL in .env}
      MOBSIMLAB_DB_HOST: postgres
      MOBSIMLAB_SIM_WORKERS: ${MOBSIMLAB_SIM_WORKERS:-1}
      MOBSIMLAB_BOOTSTRAP_OWNER_EMAIL: ${MOBSIMLAB_BOOTSTRAP_OWNER_EMAIL:-}
      MOBSIMLAB_BOOTSTRAP_OWNER_SUBJECT: ${MOBSIMLAB_BOOTSTRAP_OWNER_SUBJECT:-}
      MOBSIMLAB_OIDC_ISSUER: ${MOBSIMLAB_OIDC_ISSUER:-}
      MOBSIMLAB_OIDC_CLIENT_ID: ${MOBSIMLAB_OIDC_CLIENT_ID:-}
      MOBSIMLAB_TRUSTED_PROXIES: ${MOBSIMLAB_TRUSTED_PROXIES:-}
      MOBSIMLAB_RATE_LIMIT_AUTH: ${MOBSIMLAB_RATE_LIMIT_AUTH:-10}
      MOBSIMLAB_RATE_LIMIT_WRITES: ${MOBSIMLAB_RATE_LIMIT_WRITES:-120}
      MOBSIMLAB_DEVELOPMENT_MODE: ${MOBSIMLAB_DEVELOPMENT_MODE:-false}
      MOBSIMLAB_OSM_OVERPASS_MAX_KM2: ${MOBSIMLAB_OSM_OVERPASS_MAX_KM2:-400}
      MOBSIMLAB_OSM_MAX_AREA_KM2: ${MOBSIMLAB_OSM_MAX_AREA_KM2:-20000}
      MOBSIMLAB_OSM_PBF_MAX_MB: ${MOBSIMLAB_OSM_PBF_MAX_MB:-4000}
      MOBSIMLAB_OSM_CACHE_DAYS: ${MOBSIMLAB_OSM_CACHE_DAYS:-7}
      MOBSIMLAB_GEOFABRIK_URL: ${MOBSIMLAB_GEOFABRIK_URL:-https://download.geofabrik.de}
      MOBSIMLAB_GEOFABRIK_CACHE_DAYS: ${MOBSIMLAB_GEOFABRIK_CACHE_DAYS:-7}
      MOBSIMLAB_DEM_MAX_AREA_KM2: ${MOBSIMLAB_DEM_MAX_AREA_KM2:-20000}
      MOBSIMLAB_DEM_UPLOAD_MAX_MB: ${MOBSIMLAB_DEM_UPLOAD_MAX_MB:-500}
      MOBSIMLAB_DEM_UPLOAD_MAX_CELLS: ${MOBSIMLAB_DEM_UPLOAD_MAX_CELLS:-25000000}
      MOBSIMLAB_OSM_TOOL_TIMEOUT_MIN: ${MOBSIMLAB_OSM_TOOL_TIMEOUT_MIN:-120}
      MOBSIMLAB_ELEVATION_FALLBACK: ${MOBSIMLAB_ELEVATION_FALLBACK:-open-elevation}
      MOBSIMLAB_OPEN_ELEVATION_URL: ${MOBSIMLAB_OPEN_ELEVATION_URL:-https://api.open-elevation.com}
      MOBSIMLAB_LOG_LEVEL: ${MOBSIMLAB_LOG_LEVEL:-info}
    secrets: [db_password, oidc_client_secret]
    volumes: ["mobsimlab-data:/data"]
    depends_on: { postgres: { condition: service_healthy } }
    read_only: true
    tmpfs: ["/run:uid=10001,gid=10001,mode=0755,exec", "/tmp:uid=10001,gid=10001,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    deploy: { resources: { limits: { cpus: "${MOBSIMLAB_CPUS:-4}", memory: "${MOBSIMLAB_MEMORY:-8g}" } } }

  postgres:
    # Pinned by digest as well as tag (security review); update both together.
    image: postgis/postgis:17-3.5@sha256:01a6a70e41e6c4467c8f55f6063555ed72db2d6662cd0d571040d42eadaeb6f6
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      # A path inside the container, where Docker mounts the secret: keep it as it is.
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes: ["pgdata:/var/lib/postgresql/data", "./db/init:/docker-entrypoint-initdb.d:ro"]
    # No host port: only the mobsimlab container can reach the database.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mobsimlab"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

secrets:
  # Paths on this computer, relative to this file.
  # One password for the database. PostgreSQL's superuser gets it only to create the database: the first start then
  # removes the superuser's password, so this password cannot sign in as superuser (db/init/10-roles.sh).
  db_password: { file: "${MOBSIMLAB_SECRETS_PATH:-./deploy/secrets}/db_password" }
  # Empty for a public OIDC client; otherwise the client secret from your identity provider.
  oidc_client_secret: { file: "${MOBSIMLAB_SECRETS_PATH:-./deploy/secrets}/oidc_client_secret" }

volumes:
  pgdata: {}
  mobsimlab-data: {}
