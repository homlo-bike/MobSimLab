[workspace]
resolver = "2"
members = [
  "crates/rail-model",
  "crates/rail-dynamics",
  "crates/rail-plan",
  "crates/rail-interlocking",
  "crates/rail-sim",
  "crates/rail-sim-wasm",
  "crates/mobsim-py",
  "crates/street-routing",
  "crates/street-routing-wasm",
  "crates/rail-design",
  "crates/rail-design-wasm",
  "crates/journey-planner",
  "crates/journey-planner-wasm",
]

[workspace.package]
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/homlo-bike/MobSimLab"
rust-version = "1.80"

[profile.release]
lto = "thin"
codegen-units = 1
