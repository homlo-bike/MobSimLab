# Advanced: a separate password for each of the three database roles, instead of the one db_password.
# Needed by installs set up with 2026.11.1-alpha, whose roles were created with four passwords. Use it with:
#   COMPOSE_FILE=compose.yaml:deploy/compose.separate-db-passwords.yaml    (in .env)
# A role's own file wins over db_password. The files are the ones the alpha's init-secrets created:
# db_password points at the migrator's password, and db_admin_password at db_superuser_password.
services:
  mobsimlab:
    secrets: [db_migrator_password, db_app_password, db_worker_password]

secrets:
  db_password: { file: "${MOBSIMLAB_SECRETS_PATH:-./deploy/secrets}/db_migrator_password" }
  db_admin_password: { file: "${MOBSIMLAB_SECRETS_PATH:-./deploy/secrets}/db_superuser_password" }
  db_migrator_password: { file: "${MOBSIMLAB_SECRETS_PATH:-./deploy/secrets}/db_migrator_password" }
  db_app_password: { file: "${MOBSIMLAB_SECRETS_PATH:-./deploy/secrets}/db_app_password" }
  db_worker_password: { file: "${MOBSIMLAB_SECRETS_PATH:-./deploy/secrets}/db_worker_password" }
