[project]
name = "mobsim-worker"
version = "0.1.0"
description = "MobSimLab simulation worker (SUMO co-simulation, demand, appraisal)"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12,<3.13"
dependencies = [
    "psycopg[binary]==3.3.6",
    "structlog>=25.4",
]

[project.optional-dependencies]
sim = [
    "eclipse-sumo==1.28.0",
    "libsumo==1.28.0",
    "pyproj==3.7.2",
    "rtree==1.4.1",
]
# The four-step demand model (ADR-0019). AequilibraE brings numpy, pandas, scipy and openmatrix.
demand = ["aequilibrae==1.7.2", "pyyaml>=6.0"]

[project.scripts]
mobsim-worker = "mobsim_worker.main:main"

[dependency-groups]
dev = ["pytest>=8.4", "ruff>=0.14", "mypy>=1.18"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["spikes"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106", "D"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.mypy.overrides]]
module = ["mobsim_kernels", "sumo", "sumolib", "sumolib.*", "libsumo", "aequilibrae", "aequilibrae.*", "openmatrix", "pandas", "pandas.*", "scipy", "scipy.*"]
ignore_missing_imports = true

[tool.uv]
# AequilibraE declares pyaml (WTFPL, not on the licence gate's list) but only imports PyYAML (MIT), which the
# demand extra names itself; leave pyaml out.
override-dependencies = ["pyaml; sys_platform == 'never'"]
