[project]
name = "mobsim-worker"
version = "0.1.0"
description = "MobSimLab simulation worker (SUMO co-simulation, demand, appraisal)"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12,<3.13"
dependencies = [
    "structlog>=25.4",
]

[project.optional-dependencies]
sim = ["eclipse-sumo==1.28.0", "libsumo==1.28.0"]

[project.scripts]
mobsim-worker = "mobsim_worker.main:main"

[dependency-groups]
dev = ["pytest>=8.4", "ruff>=0.14", "mypy>=1.18"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["spikes"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "D"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
