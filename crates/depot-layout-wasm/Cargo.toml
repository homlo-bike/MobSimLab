[package]
name = "depot-layout-wasm"
version = "0.1.0"
description = "WebAssembly bindings of the MobSimLab road depot layouts for the Create tab's depot tool"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
depot-layout = { path = "../depot-layout" }
serde = "1"
serde_json = "1"
wasm-bindgen = "=0.2.129"
