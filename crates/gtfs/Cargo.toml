[package]
name = "gtfs"
version = "0.1.0"
description = "MobSimLab GTFS importer and exporter (GTFS plugin): reads a GTFS feed's text files into the published timetable for one service day, and writes the published timetable of the drawn lines as GTFS text files."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
journey-planner = { path = "../journey-planner" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
