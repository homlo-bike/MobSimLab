[package]
name = "cargo-bike-wasm"
version = "0.1.0"
description = "WebAssembly bindings of the MobSimLab cargo bike plugin (range and savings) for the Cargo bike tab"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cargo-bike = { path = "../cargo-bike" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
street-routing = { path = "../street-routing" }
wasm-bindgen = "=0.2.129"
