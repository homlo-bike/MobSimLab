[package]
name = "cargo-bike"
version = "0.1.0"
description = "MobSimLab cargo bike plugin: battery range of an electric cargo bike or tricycle on the street network, with hills and bike lanes, and what it saves against a car."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
street-routing = { path = "../street-routing" }
