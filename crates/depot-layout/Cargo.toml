[package]
name = "depot-layout"
version = "0.1.0"
description = "MobSimLab road depot layouts: parking, charging, maintenance and reserve lanes in a depot polygon, swept-path checks, the depot driving network, capacity against the fleet with a slot per vehicle, and dynamic sizing."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
