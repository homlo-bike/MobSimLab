[package]
name = "journey-planner-wasm"
version = "0.1.0"
description = "WebAssembly bindings of journey-planner for the MobSimLab web app"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
journey-planner = { path = "../journey-planner" }
serde = "1"
serde_json = "1"
wasm-bindgen = "=0.2.129"
