[package]
name = "noise-wasm"
version = "0.1.0"
description = "WebAssembly bindings of the MobSimLab noise estimate for the street line tool and the railway editor (ADR-0038)"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
noise = { path = "../noise" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.129"
