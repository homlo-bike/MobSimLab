[package]
name = "street-routing"
version = "0.1.0"
description = "MobSimLab street routing for bus, BRT, trolleybus and intercity bus lines: road graph from OSM, legal paths without U-turns, route-point circuits and depot trips (ADR-0029)."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
pathfinding = "4.16"
quick-xml = "0.38"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
