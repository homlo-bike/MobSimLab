# Builds the static viewer site (docs/user/static-viewer.md) when a version tag is pushed and attaches its ZIP
# to the GitHub release of that tag:  mobsimlab-static-<version>.zip, ready to upload to Cloudflare Pages.
# The release itself is created by the release workflow of the desktop apps; this job waits for it and only
# adds the ZIP. The ZIP's projects/ folder is empty: add .mslab files with tools/add-projects.mjs.
name: Release static viewer

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-static-${{ github.ref }}
  cancel-in-progress: false

jobs:
  static:
    name: Static viewer ZIP
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with: { toolchain: stable, targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2
        with: { tool: wasm-bindgen@0.2.129 }
      - name: WebAssembly engines
        run: tools/wasm/build-street-routing.sh && tools/wasm/build-rail-design.sh && tools/wasm/build-rail-sim.sh && tools/wasm/build-journey-planner.sh && tools/wasm/build-mode-kits.sh && tools/wasm/build-noise.sh && tools/wasm/build-energy.sh && tools/wasm/build-gtfs.sh && tools/wasm/build-cargo-bike.sh && tools/wasm/build-depot-layout.sh
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Build the site
        env:
          MOBSIMLAB_BUILD: ${{ github.ref_name }}
        run: |
          pnpm build:static
          test -f apps/web/dist-static/index.html
          test -f apps/web/dist-static/_headers
          test -f apps/web/dist-static/tools/add-projects.mjs
          test -f apps/web/dist-static/projects/index.json
          version="${GITHUB_REF_NAME#v}"
          mv apps/web/mobsimlab-static.zip "mobsimlab-static-${version}.zip"
          sha256sum "mobsimlab-static-${version}.zip" > "mobsimlab-static-${version}.zip.sha256"
          echo "ASSET=mobsimlab-static-${version}.zip" >> "$GITHUB_ENV"
      - name: Wait for the release of this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for _ in $(seq 1 60); do
            gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 && exit 0
            sleep 30
          done
          echo "::error::No GitHub release for $GITHUB_REF_NAME after 30 minutes; create it, then re-run this job."
          exit 1
      - name: Attach the ZIP
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" "$ASSET" "$ASSET.sha256" --repo "$GITHUB_REPOSITORY" --clobber
