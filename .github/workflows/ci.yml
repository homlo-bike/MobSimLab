name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { fetch-depth: 0 }
      - name: Every commit has a Signed-off-by line
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          # --first-parent: commits brought in by merges were checked on their own branch.
          for c in $(git rev-list --no-merges --first-parent "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$c" | grep -qE '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::commit $c has no Signed-off-by line (git commit -s)"; missing=1
            fi
          done
          exit $missing

  workflows:
    name: Workflow lint (actionlint)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color

  node:
    name: Web and API (lint, typecheck, test, build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with: { toolchain: stable, targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2
        with: { tool: wasm-bindgen@0.2.129 }
      - name: Build the street routing, railway design, rail capacity run, journey planner, mode kits, noise, energy, GTFS, cargo bike and depot layout WebAssembly modules (browser and API)
        run: tools/wasm/build-street-routing.sh && tools/wasm/build-rail-design.sh && tools/wasm/build-rail-sim.sh && tools/wasm/build-journey-planner.sh && tools/wasm/build-mode-kits.sh && tools/wasm/build-noise.sh && tools/wasm/build-energy.sh && tools/wasm/build-gtfs.sh && tools/wasm/build-cargo-bike.sh && tools/wasm/build-depot-layout.sh && tools/wasm/build-api.sh
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with: { python-version: "3.12" }
      - name: Python worker with the Rust kernels (the API's simulation run test starts it)
        working-directory: worker
        run: |
          uv sync --frozen --no-dev
          uv pip install "maturin>=1.9,<2"
          uv run --no-sync maturin develop --release -m ../crates/mobsim-py/Cargo.toml
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  python:
    name: Worker (ruff, mypy, pytest)
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: worker } }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with: { python-version: "3.12" }
      # The sim extra brings Eclipse SUMO, so the road simulation tests run a real SUMO run; the demand extra
      # brings AequilibraE for the demand model tests.
      - run: uv sync --frozen --extra sim --extra demand
      - run: uv run --frozen --extra sim --extra demand ruff check .
      - run: uv run --frozen --extra sim --extra demand ruff format --check .
      - run: uv run --frozen --extra sim --extra demand mypy
      - run: uv run --frozen --extra sim --extra demand pytest -q
      - name: Demand test town matches contracts/demand-input.schema.json
        run: |
          (cd .. && uvx ruff check tools/contracts && uvx ruff format --check tools/contracts)
          mkdir -p "$RUNNER_TEMP/demand"
          uv run --frozen --extra sim --extra demand python -c "import json, sys; sys.path.insert(0, 'tests'); from test_demand import town; json.dump(town(), open(sys.argv[1], 'w'))" "$RUNNER_TEMP/demand/town.json"
          uv run --no-project --with jsonschema python ../tools/contracts/check_demand_input.py "$RUNNER_TEMP"/demand/*.json

  assumptions:
    name: Assumption library (schema, sources, DEFAULTS.md up to date)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with: { python-version: "3.12" }
      - run: uv run --no-project --with pyyaml python tools/assumptions/check.py --check-rendered
      - name: Cost tables values match the assumption library
        run: uvx ruff check tools/costs && uvx ruff format --check tools/costs && uv run --no-project --with pyyaml python tools/costs/export_defaults.py --check
      - name: Benefit tables values match the assumption library
        run: uvx ruff check tools/benefits && uvx ruff format --check tools/benefits && uv run --no-project --with pyyaml python tools/benefits/export_defaults.py --check
      - name: Fare revenue values match the assumption library
        run: uvx ruff check tools/fares && uvx ruff format --check tools/fares && uv run --no-project --with pyyaml python tools/fares/export_defaults.py --check
      - name: Appraisal values match the assumption library
        run: uvx ruff check tools/appraisal && uvx ruff format --check tools/appraisal && uv run --no-project --with pyyaml python tools/appraisal/export_defaults.py --check
      - name: Design rules in Project preferences match the assumption library
        run: uvx ruff check tools/design-rules && uvx ruff format --check tools/design-rules && uv run --no-project --with pyyaml python tools/design-rules/export_defaults.py --check
      - name: Demand model values match the assumption library
        run: uvx ruff check tools/demand && uvx ruff format --check tools/demand && uv run --no-project --with pyyaml python tools/demand/export_defaults.py --check
      - name: Parameters in Project preferences match the assumption library
        run: uvx ruff check tools/parameters && uvx ruff format --check tools/parameters && uv run --no-project --with pyyaml python tools/parameters/export_defaults.py --check
      - name: Assumptions report sources match the assumption library
        run: uvx ruff check tools/assumptions-report && uvx ruff format --check tools/assumptions-report && uv run --no-project --with pyyaml python tools/assumptions-report/export_sources.py --check

  rust:
    name: Kernels (fmt, clippy, test, S2 smoke benchmark)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with: { toolchain: stable, components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --exclude mobsim-py
      - name: Street routing, railway design, rail capacity run, journey planner, mode kits, noise, energy, GTFS, cargo bike and depot layout compile to WebAssembly
        run: rustup target add wasm32-unknown-unknown && cargo build --locked --target wasm32-unknown-unknown -p street-routing-wasm -p rail-design-wasm -p rail-sim-wasm -p journey-planner-wasm -p mode-kits-wasm -p noise-wasm -p energy-wasm -p gtfs-wasm -p cargo-bike-wasm -p depot-layout-wasm
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with: { python-version: "3.12" }
      - name: Railway topology export matches contracts/rail-topology.schema.json
        run: |
          uvx ruff check tools/contracts && uvx ruff format --check tools/contracts
          mkdir -p "$RUNNER_TEMP/topology"
          cargo run -q -p rail-design --example topology -- "$RUNNER_TEMP/topology"
          uv run --no-project --with jsonschema python tools/contracts/check_rail_topology.py "$RUNNER_TEMP"/topology/*.json
      - name: Saved depots match contracts/depot.schema.json
        run: |
          mkdir -p "$RUNNER_TEMP/depots"
          cargo run -q -p depot-layout --example export -- "$RUNNER_TEMP/depots"
          uv run --no-project --with jsonschema python tools/contracts/check_depot.py "$RUNNER_TEMP"/depots/*.json
      - name: S2 benchmark (one simulated hour, must not deadlock)
        run: cargo run --release -p rail-sim --bin bench_s2 -- 3600 1.0 | tee bench.json

  plugins:
    name: Plugins (manifests, modes, parameters, registry up to date)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with: { python-version: "3.12" }
      - run: uvx ruff check tools/plugins && uvx ruff format --check tools/plugins
      - run: uv run --no-project --with jsonschema --with pyyaml python tools/plugins/check.py --check-rendered
      - name: Noise engine values match the noise plugin's parameters
        run: uvx ruff check tools/noise && uvx ruff format --check tools/noise && uv run --no-project --with pyyaml python tools/noise/export_defaults.py --check
      - name: Cargo bike engine values match the cargo bike plugin's parameters
        run: uvx ruff check tools/cargo-bike && uvx ruff format --check tools/cargo-bike && uv run --no-project --with pyyaml python tools/cargo-bike/export_defaults.py --check
      - run: uv run --no-project --with jsonschema --with pyyaml --with pytest pytest -q tools/plugins

  vehicles:
    name: Vehicle catalogue (schema, sources, core fields)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with: { python-version: "3.12" }
      - run: uvx ruff check tools/vehicles && uvx ruff format --check tools/vehicles
      - run: uv run --no-project --with jsonschema --with pyyaml python tools/vehicles/check.py
      - run: python tools/vehicles/rail_trains.py --check
      - run: python tools/vehicles/street_vehicles.py --check
      - run: uv run --no-project --with jsonschema --with pyyaml --with pytest pytest -q tools/vehicles

  licence-gate:
    name: Licence gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version-file: .nvmrc, cache: pnpm }
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with: { python-version: "3.12" }
      - run: pnpm install --frozen-lockfile
      - name: Gate self-test (must block a GPL-2.0-only package)
        run: uv run --no-project --with pytest pytest -q tools/license-gate
      - name: Collect licences
        run: |
          pnpm licenses list --prod --json > npm.json
          cargo metadata --format-version 1 > cargo.json
          (cd worker && uv sync --frozen --no-dev --extra sim --extra demand && uv pip install pip-licenses && \
           uv run --no-sync pip-licenses --format=json > ../py.json)
      - run: python3 tools/license-gate/license_gate.py --npm npm.json --cargo cargo.json --python py.json

  secrets-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    name: Image build, smoke test, SBOM and scan
    runs-on: ubuntu-24.04
    needs: [node, python, rust]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/Dockerfile
          tags: mobsimlab:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Refuses to start without secrets
        run: |
          set +e
          docker run --rm -e MOBSIMLAB_PUBLIC_URL=http://localhost:8080 -e MOBSIMLAB_DB_HOST=x \
            --entrypoint node -w /app/api mobsimlab:ci dist/main.js
          code=$?
          test "$code" = 78 || { echo "expected exit 78, got $code"; exit 1; }
      - name: Compose up with generated secrets
        env:
          MOBSIMLAB_IMAGE: mobsimlab:ci
          MOBSIMLAB_PUBLIC_URL: http://localhost:8080
        run: |
          deploy/scripts/init-secrets
          docker compose up -d --no-build
          for _ in $(seq 1 60); do
            s=$(docker inspect -f '{{.State.Health.Status}}' mobsimlab 2>/dev/null || echo starting)
            [ "$s" = healthy ] && break; sleep 3
          done
          docker compose ps
          curl -fsS http://127.0.0.1:8080/api/health
          curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="root">'
          docker exec mobsimlab id -u | grep -qx 10001
          docker compose exec -T postgres psql -U postgres -d mobsimlab -tAc \
            "select string_agg(rolname, ',' order by rolname) from pg_roles where rolname like 'mobsimlab_%'" \
            | grep -qx 'mobsimlab_app,mobsimlab_migrator,mobsimlab_worker'
          docker compose exec -T postgres psql -U postgres -d mobsimlab -tAc "select name from meta.migration" \
            | grep -qx '0001_iam_audit.sql'
          curl -fsS http://127.0.0.1:8080/api/auth/me | grep -q '"mode":"setup"'
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/setup)
          test "$code" = 401 || { echo "expected 401 from /api/setup, got $code"; exit 1; }
          curl -fsS http://127.0.0.1:8080/.well-known/oauth-protected-resource/mcp | grep -q '"resource"'
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/mcp)
          test "$code" = 401 || { echo "expected 401 from /mcp without a token, got $code"; exit 1; }
          docker exec -w /app/api mobsimlab node -e "require('./wasm/street-routing/street_routing_wasm.js')"
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with: { image: "mobsimlab:ci", format: cyclonedx-json, output-file: sbom.cdx.json }
      - name: Vulnerability scan (report only in Phase 0)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.0 \
            image --severity CRITICAL --ignore-unfixed --exit-code 0 mobsimlab:ci
