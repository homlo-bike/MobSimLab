name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - name: Every commit has a Signed-off-by line
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          # --first-parent: commits brought in by merges were checked on their own branch.
          for c in $(git rev-list --no-merges --first-parent "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$c" | grep -qE '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::commit $c has no Signed-off-by line (git commit -s)"; missing=1
            fi
          done
          exit $missing

  workflows:
    name: Workflow lint (actionlint)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color

  node:
    name: Web and API (lint, typecheck, test, build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  python:
    name: Worker (ruff, mypy, pytest)
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: worker } }
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.12" }
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q

  assumptions:
    name: Assumption library (schema, sources, DEFAULTS.md up to date)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.12" }
      - run: uv run --no-project --with pyyaml python tools/assumptions/check.py --check-rendered

  rust:
    name: Kernels (fmt, clippy, test, S2 smoke benchmark)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --exclude mobsim-py
      - name: S2 benchmark (one simulated hour, must not deadlock)
        run: cargo run --release -p rail-sim --bin bench_s2 -- 3600 1.0 | tee bench.json

  licence-gate:
    name: Licence gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version-file: .nvmrc, cache: pnpm }
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.12" }
      - run: pnpm install --frozen-lockfile
      - name: Gate self-test (must block a GPL-2.0-only package)
        run: uv run --no-project --with pytest pytest -q tools/license-gate
      - name: Collect licences
        run: |
          pnpm licenses list --prod --json > npm.json
          cargo metadata --format-version 1 > cargo.json
          (cd worker && uv sync --frozen --no-dev --extra sim && uv pip install pip-licenses && \
           uv run --no-sync pip-licenses --format=json > ../py.json)
      - run: python3 tools/license-gate/license_gate.py --npm npm.json --cargo cargo.json --python py.json

  secrets-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    name: Image build, smoke test, SBOM and scan
    runs-on: ubuntu-24.04
    needs: [node, python, rust]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          tags: mobsimlab:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Refuses to start without secrets
        run: |
          set +e
          docker run --rm -e MOBSIMLAB_PUBLIC_URL=http://localhost:8080 -e MOBSIMLAB_DB_HOST=x \
            --entrypoint node -w /app/api mobsimlab:ci dist/main.js
          code=$?
          test "$code" = 78 || { echo "expected exit 78, got $code"; exit 1; }
      - name: Compose up with generated secrets
        env:
          MOBSIMLAB_IMAGE: mobsimlab:ci
          MOBSIMLAB_PUBLIC_URL: http://localhost:8080
        run: |
          deploy/scripts/init-secrets
          docker compose up -d --no-build
          for _ in $(seq 1 60); do
            s=$(docker inspect -f '{{.State.Health.Status}}' mobsimlab 2>/dev/null || echo starting)
            [ "$s" = healthy ] && break; sleep 3
          done
          docker compose ps
          curl -fsS http://127.0.0.1:8080/api/health
          curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="root">'
          docker exec mobsimlab id -u | grep -qx 10001
          docker compose exec -T postgres psql -U postgres -d mobsimlab -tAc \
            "select string_agg(rolname, ',' order by rolname) from pg_roles where rolname like 'mobsimlab_%'" \
            | grep -qx 'mobsimlab_app,mobsimlab_migrator,mobsimlab_worker'
          docker compose exec -T postgres psql -U postgres -d mobsimlab -tAc "select name from meta.migration" \
            | grep -qx '0001_iam_audit.sql'
          curl -fsS http://127.0.0.1:8080/api/auth/me | grep -q '"mode":"setup"'
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/setup)
          test "$code" = 401 || { echo "expected 401 from /api/setup, got $code"; exit 1; }
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with: { image: "mobsimlab:ci", format: cyclonedx-json, output-file: sbom.cdx.json }
      - name: Vulnerability scan (report only in Phase 0)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.0 \
            image --severity CRITICAL --ignore-unfixed --exit-code 0 mobsimlab:ci
