name: Bug report
description: Something in MobSimLab does not work as described.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Please do not report security vulnerabilities here; see [SECURITY.md](https://github.com/homlo-bike/MobSimLab/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you see, and what did you expect to see instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The steps that lead to the problem. Attach a small `.mslab` project or screenshots if they help.
      placeholder: |
        1. Open …
        2. Click …
        3. See …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: MobSimLab version
      description: The release (for example `2026.11.1-alpha`) or the commit you built from.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where it happens
      options:
        - Web app
        - API or server
        - Simulation worker
        - Static viewer
        - Installation or deployment
        - Something else
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
      description: For example Firefox 145 on Windows 11, or the server's OS and Docker version for deployment problems.
  - type: textarea
    id: logs
    attributes:
      label: Logs or error messages
      description: Paste any relevant output. Remove secrets, tokens and personal data first.
      render: text
