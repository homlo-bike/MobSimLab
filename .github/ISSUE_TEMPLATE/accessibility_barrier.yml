name: Accessibility barrier
description: Something in MobSimLab is hard or impossible to use with your setup.
labels: ["accessibility"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for telling us. See [ACCESSIBILITY.md](https://github.com/homlo-bike/MobSimLab/blob/main/ACCESSIBILITY.md) for what we aim to support. If you would rather not report this in public, contact the maintainer privately as described there.
  - type: textarea
    id: barrier
    attributes:
      label: The barrier
      description: What were you trying to do, and what stopped you or made it difficult?
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where in the app
      description: For example the sign-in page, the Schematic tab or the railway editor.
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Your setup
      description: Browser and operating system, and any assistive technology or settings you use (for example a screen reader, keyboard only, zoom, high contrast or reduced motion).
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: MobSimLab version
      description: The release or commit, if you know it.
